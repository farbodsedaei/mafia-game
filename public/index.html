    box.innerHTML = '';
    Array.from(state.players.values()).forEach(entry => {
      const row = document.createElement('div');
      row.className = 'slot' + (entry.alive ? ' connected' : '');
      row.innerHTML =
        '<div class="name">' + escapeHtml(entry.name) + (entry.alive ? '' : ' <span class="hint" style="font-size:11px;">' + escapeHtml(t('outLabel')) + '</span>') + '</div>' +
        '<span class="tag ' + (entry.independent ? 'independent' : entry.role) + '" style="flex-shrink:0;">' + escapeHtml(entry.roleName || entry.role) + '</span>';
      box.appendChild(row);
    });
    showScreen('screen-host-game-over');
  };

  /* ---------------- Night phase ---------------- */
  // Ordered list of night phases. Mafia-aligned roles (the kill decision and
  // ماتادور's block) act together in one shared 'mafia-phase' step. زودیاک acts
  // alone, right after — its own 'zodiac-phase' step — since it's independent,
  // not a civilian role, and must go after Mafia but before the civilians per
  // its design. Once that's all resolved (so ماتادور's block target is known),
  // every civilian action role (دکتر, کنستانتین, کاراگاه, حرفه‌ای, تفنگدار, اوشن's
  // recruit choice) is prompted at the same time too, in one shared
  // 'civilian-phase' step. Nobody waits on anyone else to decide before making
  // their own choice; this is what actually saves real time at the table, not
  // sequential one-at-a-time turns. اوشن's talk stays its own step afterward,
  // since it needs everyone's civilian-phase decisions finalized first.
  const NIGHT_STEP_ORDER = ['eyes-closed', 'mafia-phase', 'zodiac-phase', 'civilian-phase', 'ocean-talk'];
  const CIVILIAN_PHASE_ROLES = ['doctor', 'constantine', 'detective', 'professional', 'gunner', 'ocean-recruit'];

  function findAliveByRoleName(name){
    return Array.from(state.players.entries()).filter(([id, e]) => e.alive && e.roleName === name);
  }
  function isBlockedTonight(id){
    return id === state.night.blockedId;
  }

  function startNight(){
    state.night = { blockedId: null, savedId: null, professionalTargetId: null, mafiaTargetId: null, mafiaRecruitId: null, revivedId: null, zodiacTargetId: null, extraDeathIds: [], mafiaPending: new Set(), zodiacPending: new Set(), civilianPending: new Set(), deferredMatadorPrompt: null, killDeciderIds: new Set(), decisionsLog: [] };
    aliveEntries().forEach(([id, entry]) => sendToPlayer(entry, { type: 'phase', phase: 'night', day: state.day }));
    $('night-day').textContent = t('nightLabel', { n: state.day });
    showScreen('screen-host-night');
    runNightStep(0);
  }

  function runNightStep(index){
    if(index >= NIGHT_STEP_ORDER.length){ showMorningReadyScreen(); return; }
    // Night 1 exists only for Mafia to see who their teammates are — the
    // eyes-closed step already covers that (mafiaTalkNow + the always-on
    // Mafia chat). No kill, no ماتادور block, no زودیاک shot, no civilian
    // ability of any kind that night — every other step is skipped, and
    // resolveNight() naturally finds nothing to resolve since none of
    // state.night's decision fields ever got populated. The real game
    // begins Night 2.
    if(state.day === 1 && NIGHT_STEP_ORDER[index] !== 'eyes-closed'){
      showMorningReadyScreen();
      return;
    }
    state.nightStepIndex = index;
    const step = NIGHT_STEP_ORDER[index];
    state.gamePhase = 'night-' + step;
    if(step === 'mafia-phase') startMafiaPhaseStep();
    else if(step === 'zodiac-phase') startZodiacPhaseStep();
    else if(step === 'civilian-phase') startCivilianPhaseStep();
    else if(step === 'ocean-talk') startOceanTalkStep();
    else if(step === 'eyes-closed') startEyesClosedStep();
    // Live-refresh the God's console if it's open, so a NEW step's pending
    // role holders show up right away — not just whenever the next decision
    // happens to come in (recordNightDecision already covers that half).
    refreshDebugPanelIfOpen();
  }

  function advanceNight(){
    runNightStep(state.nightStepIndex + 1);
  }

  // زودیاک acts alone, right after Mafia and before the civilian roles. Per the
  // game's settings it either shoots every night or only every other night
  // (Night 1, 3, 5…) — see the "زودیاک's Shooting" toggle in host setup. Like
  // any other blockable role, ماتادور can still shut it down for the night.
  function startZodiacPhaseStep(){
    state.night.zodiacPending = new Set();
    const shootsTonight = state.zodiacShootsEveryNight || (state.day % 2 === 1);
    if(shootsTonight){
      promptCivilianRole('zodiac', ROLE_NAME_ZODIAC, (zodiacId) => {
        return Array.from(state.players.entries())
          .filter(([id, e]) => e.alive && id !== zodiacId)
          .map(([id, e]) => ({ id, name: e.name }));
      }, t('chooseToShoot'), null, state.night.zodiacPending);
    }
    if(!state.night.zodiacPending.size){ advanceNight(); return; }
    showScreen('screen-host-night');
  }
  function checkZodiacPhaseComplete(){
    if(state.night.zodiacPending.size === 0) advanceNight();
  }

  // Sends one role's prompt into a given pending Set — but only if they're
  // alive, eligible (per an optional extra check like تفنگدار's remaining-guns
  // count), and actually have someone to act on. Adds them to pendingSet so
  // the phase knows to wait for their answer; a blocked actor gets a "you were
  // blocked" notice instead and is never added, since there's nothing left to
  // wait for from them. Shared by both the civilian-phase (civilianPending)
  // and زودیاک's solo zodiac-phase (zodiacPending).
  function promptCivilianRole(key, roleName, buildCandidates, title, eligible, pendingSet){
    const holders = findAliveByRoleName(roleName);
    if(!holders.length) return;
    const [actorId, actorEntry] = holders[0];
    if(eligible && !eligible(actorId)) return;
    // Blocked players are already told immediately when ماتادور's block is
    // decided (see the 'matador' branch in handleNightAction) — that fires
    // for anyone blocked, role or no role, so there's nothing more to send
    // here; just skip the prompt.
    if(isBlockedTonight(actorId)) return;
    const candidates = buildCandidates(actorId);
    if(!candidates.length) return;
    pendingSet.add(key);
    sendToPlayer(actorEntry, { type: 'phase', phase: 'night-action', day: state.day, role: key, title, candidates, allowSkip: true });
  }

  function startCivilianPhaseStep(){
    state.night.civilianPending = new Set();
    const pending = state.night.civilianPending;

    promptCivilianRole('doctor', ROLE_NAME_DOCTOR, (doctorId) => {
      return Array.from(state.players.entries())
        .filter(([id, e]) => e.alive && (id !== doctorId || !state.doctorSelfSaveUsed))
        .map(([id, e]) => ({ id, name: e.name }));
    }, t('chooseToSave'), null, pending);

    promptCivilianRole('constantine', ROLE_NAME_CONSTANTINE, () => {
      return Array.from(state.players.entries())
        .filter(([id, e]) => !e.alive)
        .map(([id, e]) => ({ id, name: e.name }));
    }, t('chooseToRevive'), () => !state.constantineReviveUsed, pending);

    promptCivilianRole('detective', ROLE_NAME_DETECTIVE, (detectiveId) => {
      return Array.from(state.players.entries())
        .filter(([id, e]) => e.alive && id !== detectiveId)
        .map(([id, e]) => ({ id, name: e.name }));
    }, t('chooseToInvestigate'), null, pending);

    // زودیاک stays targetable/selectable by حرفه‌ای and تفنگدار too — it just never
    // actually dies (see resolveNight / resolveDayGunAction).
    promptCivilianRole('professional', ROLE_NAME_PROFESSIONAL, (proId) => {
      return Array.from(state.players.entries())
        .filter(([id, e]) => e.alive && id !== proId)
        .map(([id, e]) => ({ id, name: e.name }));
    }, t('chooseToShoot'), null, pending);

    // تفنگدار may also hand the gun to زودیاک itself — nothing stops that handover.
    promptCivilianRole('gunner', ROLE_NAME_GUNNER, (gunnerId) => {
      return Array.from(state.players.entries())
        .filter(([id, e]) => e.alive && id !== gunnerId)
        .map(([id, e]) => ({ id, name: e.name }));
    }, t('chooseToHandGun'), () => state.gunsRemaining > 0 && !state.gunsCancelled && !state.pendingGun, pending);

    promptCivilianRole('ocean-recruit', ROLE_NAME_OCEAN, (oceanId) => {
      return Array.from(state.players.entries())
        .filter(([id, e]) => e.alive && id !== oceanId && !state.oceanTeam.has(id))
        .map(([id, e]) => ({ id, name: e.name }));
    }, t('chooseToAddGroup'), () => state.oceanTeam.size < state.numOceanSlots, pending);

    if(!state.night.civilianPending.size){ advanceNight(); return; }
    showScreen('screen-host-night');
  }
  function checkCivilianPhaseComplete(){
    if(state.night.civilianPending.size === 0) advanceNight();
  }

  function startOceanTalkStep(){
    const oceanEntries = findAliveByRoleName(ROLE_NAME_OCEAN);
    if(!oceanEntries.length){ advanceNight(); return; }
    const oceanId = oceanEntries[0][0];

    const teamIds = [oceanId];
    state.oceanTeam.forEach(id => {
      if(teamIds.indexOf(id) !== -1) return;
      const e = state.players.get(id);
      if(e && e.alive) teamIds.push(id);
    });
    if(teamIds.length < 2){ advanceNight(); return; }

    // Doubles as the "you've joined" notice for anyone recruited moments ago —
    // this step runs immediately after ocean-recruit, so it's their first message either way.
    teamIds.forEach(id => {
      const entry = state.players.get(id);
      if(entry) sendToPlayer(entry, { type: 'phase', phase: 'night-announcement', day: state.day, text: t('oceanGroupJoinTalk') });
    });
    $('ocean-talk-day').textContent = t('nightLabel', { n: state.day });
    showScreen('screen-host-ocean-talk');

    // Guarantee real talk time regardless of how quickly the host taps through —
    // the button is disabled for a few seconds before it can be used.
    const btn = $('ocean-talk-continue-btn');
    if(btn){
      btn.disabled = true;
      setTimeout(() => { btn.disabled = false; }, 4000);
    }
  }
  App.continueAfterOceanTalk = function(){
    advanceNight();
  };

  function startEyesClosedStep(){
    aliveEntries().forEach(([id, entry]) => {
      const text = entry.role === 'mafia'
        ? (state.day === 1 ? t('mafiaTalkNowNight1') : t('mafiaTalkNow'))
        : t('closeYourEyes');
      sendToPlayer(entry, { type: 'phase', phase: 'night-announcement', day: state.day, text });
    });
    $('night-eyes-closed-day').textContent = t('nightLabel', { n: state.day });
    showScreen('screen-host-night-eyes-closed');
  }
  App.continueAfterEyesClosed = function(){
    advanceNight();
  };

  // Mafia's kill/recruit decision and ماتادور's block are prompted at the same
  // time and resolved independently — the phase only advances once every
  // in-play mafia-aligned action has been decided (or the host force-continues).
  function startMafiaPhaseStep(){
    state.night.mafiaPending = new Set();

    const godfathers = findAliveByRoleName(ROLE_NAME_GODFATHER);
    let killDeciders;
    if(godfathers.length){
      killDeciders = godfathers;
    } else {
      // No پدرخوانده left to make the call — every other Mafia-aligned role
      // (ماتادور, ساول گودمن) still acts normally below, but the kill decision
      // itself goes to exactly one randomly-picked living Mafia member for
      // tonight, instead of prompting all of them (which used to turn into a
      // free-for-all where whoever answered first won). Re-rolled fresh each
      // night; the choice is still announced to the whole team afterward via
      // the shared Mafia activity log in resolveNight, same as always.
      const aliveMafia = Array.from(state.players.entries()).filter(([id, e]) => e.alive && e.role === 'mafia');
      killDeciders = aliveMafia.length ? [aliveMafia[Math.floor(Math.random() * aliveMafia.length)]] : [];
    }
    const killDeciderIds = new Set(killDeciders.map(([id]) => id));
    state.night.killDeciderIds = killDeciderIds; // so the God's live "who's still deciding" view can find them by id later — see renderNightStatus

    if(killDeciders.length){
      state.night.mafiaPending.add('kill');
      const saulAlive = findAliveByRoleName(ROLE_NAME_SAUL).length > 0;
      const mafiaHasDied = Array.from(state.players.values()).some(e => !e.alive && e.role === 'mafia');
      const canRecruit = saulAlive && mafiaHasDied;
      killDeciders.forEach(([id, entry]) => {
        // Mafia can target their own teammates too — only the decider
        // themselves is excluded. زودیاک stays a selectable target here even
        // though it can never actually die to this shot (see resolveNight) —
        // Mafia can still choose to "shoot" it, they just won't get a kill,
        // and won't be told why (shield / Doctor's save / زودیاک are all
        // indistinguishable from the group's perspective).
        const candidates = Array.from(state.players.entries())
          .filter(([cid, e]) => e.alive && cid !== id)
          .map(([cid, e]) => ({ id: cid, name: e.name }));
        sendToPlayer(entry, { type: 'phase', phase: 'night-action', day: state.day, role: 'mafia', title: t('chooseToShoot'), candidates, allowSkip: false, canRecruit });
      });
    }

    const matadors = findAliveByRoleName(ROLE_NAME_MATADOR);
    if(matadors.length){
      const [matadorId, matadorEntry] = matadors[0];
      const candidates = Array.from(state.players.entries())
        .filter(([id, e]) => e.alive && e.role === 'villager' && id !== matadorId)
        .map(([id, e]) => ({ id, name: e.name }));
      if(candidates.length){
        state.night.mafiaPending.add('matador');
        // If this same person is also tonight's kill-decider (only possible
        // when پدرخوانده is dead and the random fallback pick happens to be
        // ماتادور), they can't answer two 'night-action' prompts at once — the
        // second one silently overwrites the first on their single-prompt
        // screen before they can respond to it. Hold the block prompt back
        // and fire it right after their kill decision comes in instead (see
        // the 'mafia' branch in handleNightAction).
        if(killDeciderIds.has(matadorId)){
          state.night.deferredMatadorPrompt = { entry: matadorEntry, candidates };
        } else {
          sendToPlayer(matadorEntry, { type: 'phase', phase: 'night-action', day: state.day, role: 'matador', title: t('chooseToBlock'), candidates, allowSkip: true });
        }
      }
    }

    if(!state.night.mafiaPending.size){ advanceNight(); return; }
    showScreen('screen-host-night');
  }
  function checkMafiaPhaseComplete(){
    if(state.night.mafiaPending.size === 0) advanceNight();
  }

  // Personal history for one player (Doctor/Detective/Professional/Matador/Constantine/Ocean).
  function logActivity(entry, text){
    if(!entry.activityLog) entry.activityLog = [];
    entry.activityLog.push(text);
    sendToPlayer(entry, { type: 'activity-log', log: entry.activityLog });
  }
  // Shared history visible to every alive Mafia team member.
  function logMafiaActivity(text){
    state.mafiaActivityLog.push(text);
    Array.from(state.players.values()).filter(e => e.alive && e.role === 'mafia').forEach(e => {
      sendToPlayer(e, { type: 'activity-log', log: state.mafiaActivityLog });
    });
  }

  // Mafia's private night chat. Messages always relay through the host (no
  // direct player-to-player connections exist in this app's architecture) —
  // the full log is rebroadcast to every alive Mafia member on each new
  // message, same pattern as logMafiaActivity above.
  function logMafiaChat(senderName, text){
    state.mafiaChatLog.push({ name: senderName, text });
    Array.from(state.players.values()).filter(e => e.alive && e.role === 'mafia').forEach(e => {
      sendToPlayer(e, { type: 'mafia-chat-log', log: state.mafiaChatLog });
    });
  }

  function handleMafiaChat(voterId, text){
    const voter = state.players.get(voterId);
    if(!voter || !voter.alive || voter.role !== 'mafia') return;
    const trimmed = String(text || '').trim().slice(0, 300);
    if(!trimmed) return;
    logMafiaChat(voter.name, trimmed);
  }

  // اوشن's group is dynamic — it's اوشن itself plus whoever it's recruited
  // into state.oceanTeam so far (which only grows over the game) — so unlike
  // Mafia's fixed team, membership has to be recomputed on demand rather than
  // read off a static team field. Alive-only, since membership (and chat
  // access) ends the moment someone's eliminated.
  function getOceanGroupIds(){
    const ids = new Set();
    Array.from(state.players.entries()).forEach(([id, e]) => {
      if(!e.alive) return;
      if(e.roleName === ROLE_NAME_OCEAN || state.oceanTeam.has(id)) ids.add(id);
    });
    return ids;
  }

  function logOceanChat(senderName, text){
    state.oceanChatLog.push({ name: senderName, text });
    getOceanGroupIds().forEach(id => {
      const entry = state.players.get(id);
      if(entry) sendToPlayer(entry, { type: 'ocean-chat-log', log: state.oceanChatLog });
    });
  }

  function handleOceanChat(voterId, text){
    const voter = state.players.get(voterId);
    if(!voter || !voter.alive || !getOceanGroupIds().has(voterId)) return;
    const trimmed = String(text || '').trim().slice(0, 300);
    if(!trimmed) return;
    logOceanChat(voter.name, trimmed);
  }

  // زودیاک's little "family" chat — at most two people, ever: زودیاک and
  // زودیاک پسر. Unlike اوشن's group this never grows, and unlike Mafia's team
  // it isn't fixed by team either — it's whoever currently holds either of
  // these two specific role names. After succession (see transferZodiacLegacy)
  // the heir's roleName becomes ROLE_NAME_ZODIAC, so this naturally narrows
  // to just them once the original زودیاک is gone.
  function getZodiacGroupIds(){
    const ids = new Set();
    Array.from(state.players.entries()).forEach(([id, e]) => {
      if(!e.alive) return;
      if(e.roleName === ROLE_NAME_ZODIAC || e.roleName === ROLE_NAME_ZODIAC_SON) ids.add(id);
    });
    return ids;
  }

  function logZodiacChat(senderName, text){
    state.zodiacChatLog.push({ name: senderName, text });
    getZodiacGroupIds().forEach(id => {
      const entry = state.players.get(id);
      if(entry) sendToPlayer(entry, { type: 'zodiac-chat-log', log: state.zodiacChatLog });
    });
  }

  function handleZodiacChat(voterId, text){
    const voter = state.players.get(voterId);
    if(!voter || !voter.alive || !getZodiacGroupIds().has(voterId)) return;
    const trimmed = String(text || '').trim().slice(0, 300);
    if(!trimmed) return;
    logZodiacChat(voter.name, trimmed);
  }

  // Feeds the God's live "Tonight's Status" view (renderNightStatus) — one
  // line per role decision, as it happens, so the console shows who's acted
  // and what they chose without waiting for the night to fully resolve.
  function recordNightDecision(voter, text){
    state.night.decisionsLog.push({ role: voter.roleName || voter.role, player: voter.name, text });
    refreshDebugPanelIfOpen();
  }

  function handleNightAction(voterId, role, targetId, recruit){
    const voter = state.players.get(voterId);
    if(!voter || !voter.alive) return;
    const isMafiaPhaseRole = (role === 'mafia' || role === 'matador');
    const isCivilianPhaseRole = CIVILIAN_PHASE_ROLES.indexOf(role) !== -1;
    const expectedPhase = isMafiaPhaseRole ? 'night-mafia-phase'
      : isCivilianPhaseRole ? 'night-civilian-phase'
      : role === 'zodiac' ? 'night-zodiac-phase'
      : ('night-' + role);
    if(state.gamePhase !== expectedPhase) return;
    // One decision per role per night, full stop — reject a second
    // submission outright instead of reprocessing it (a reconnect replaying
    // a stale message, a browser-back then re-tapping Confirm on the still-
    // rendered candidate list, etc.). This is what كاراگاه investigating a
    // second person the same night actually was: nothing stopped a repeat
    // submission from being treated as a brand-new decision. The pending
    // key for a role is only ever removed once — the first time its
    // decision is processed, at the bottom of this function — so if it's
    // already gone, this actor already acted tonight.
    const pendingKey = role === 'mafia' ? 'kill' : role;
    const pendingSet = isMafiaPhaseRole ? state.night.mafiaPending
      : isCivilianPhaseRole ? state.night.civilianPending
      : role === 'zodiac' ? state.night.zodiacPending
      : null;
    if(pendingSet && !pendingSet.has(pendingKey)) return;
    const targetName = targetId && state.players.get(targetId) ? state.players.get(targetId).name : null;

    const prefix = t('nightLogPrefix', { day: state.day });

    if(role === 'matador'){
      state.night.blockedId = targetId || null;
      const text = prefix + (targetName ? t('actMatadorBlocked', { name: targetName }) : t('actMatadorNoBlock'));
      logActivity(voter, prefix + (targetName ? t('actYouBlocked', { name: targetName }) : t('actYouNoBlock')));
      logMafiaActivity(text);
      // Tell the blocked player right away, regardless of whether they hold a
      // role with an active ability tonight (or are even eligible to use it) —
      // previously they only learned anything if their own role's turn came up
      // during civilian-phase, so a blocked plain شهروند ساده, or e.g. a
      // تفنگدار blocked on a night they were already out of guns, never found
      // out anything happened to them at all.
      if(targetId){
        const blockedEntry = state.players.get(targetId);
        if(blockedEntry) sendToPlayer(blockedEntry, { type: 'phase', phase: 'night', day: state.day, note: t('youWereBlocked') });
      }
      recordNightDecision(voter, targetName ? t('actYouBlocked', { name: targetName }) : t('actYouNoBlock'));
      state.night.mafiaPending.delete('matador');
      checkMafiaPhaseComplete();
    } else if(role === 'doctor'){
      state.night.savedId = targetId || null;
      if(targetId && targetId === voterId) state.doctorSelfSaveUsed = true;
      logActivity(voter, prefix + (targetName ? t('actYouSaved', { name: targetName }) : t('actYouNoSave')));
      recordNightDecision(voter, targetName ? t('actYouSaved', { name: targetName }) : t('actYouNoSave'));
      state.night.civilianPending.delete('doctor');
      checkCivilianPhaseComplete();
    } else if(role === 'constantine'){
      state.night.revivedId = targetId || null;
      if(targetId) state.constantineReviveUsed = true; // whole-game limit — only one revival, ever
      logActivity(voter, prefix + (targetName ? t('actYouRevived', { name: targetName }) : t('actYouNoRevive')));
      recordNightDecision(voter, targetName ? t('actYouRevived', { name: targetName }) : t('actYouNoRevive'));
      state.night.civilianPending.delete('constantine');
      checkCivilianPhaseComplete();
    } else if(role === 'detective'){
      if(targetId){
        const target = state.players.get(targetId);
        if(target){
          // The read is deliberately just a hit/no-hit signal — never a
          // specific label like "Mafia" or "suspicious" — so a positive
          // result can never be pinned to one explanation. Two things can
          // trigger a positive:
          // - Genuine Mafia, EXCEPT پدرخوانده: detective immunity makes
          //   پدرخوانده always read negative, even though genuinely Mafia.
          //   Scoped ONLY to this one-on-one read — the morning inquiry's
          //   aggregate counts (see App.closeInquiryVote) still count
          //   پدرخوانده as Mafia, since that reflects ground truth, not a
          //   personal read.
          // - زودیاک پسر, while the main زودیاک is still alive: an
          //   intentional decoy, indistinguishable from a real Mafia hit,
          //   that stops applying once succession actually happens (see
          //   eliminatePlayer, where پسر inherits زودیاک's identity and this
          //   branch no longer matches their roleName).
          const isZodiacSonDecoy = target.roleName === ROLE_NAME_ZODIAC_SON && findAliveByRoleName(ROLE_NAME_ZODIAC).length;
          const isRealMafiaHit = target.role === 'mafia' && target.roleName !== ROLE_NAME_GODFATHER;
          const outcome = (isZodiacSonDecoy || isRealMafiaHit) ? 'positive' : 'negative';
          sendToPlayer(voter, { type: 'investigate-result', targetName: target.name, outcome });
          const resultLabel = outcome === 'positive' ? t('actInvestigatedPositive') : t('actInvestigatedNegative');
          logActivity(voter, prefix + t('actYouInvestigated', { name: target.name, result: resultLabel }));
          recordNightDecision(voter, t('actYouInvestigated', { name: target.name, result: resultLabel }));
        }
      } else {
        logActivity(voter, prefix + t('actYouNoInvestigate'));
        recordNightDecision(voter, t('actYouNoInvestigate'));
      }
      state.night.civilianPending.delete('detective');
      checkCivilianPhaseComplete();
    } else if(role === 'professional'){
      state.night.professionalTargetId = targetId || null;
      logActivity(voter, prefix + (targetName ? t('actYouShot', { name: targetName }) : t('actYouNoShot')));
      recordNightDecision(voter, targetName ? t('actYouShot', { name: targetName }) : t('actYouNoShot'));
      state.night.civilianPending.delete('professional');
      checkCivilianPhaseComplete();
    } else if(role === 'gunner'){
      if(targetId){
        state.gunsRemaining -= 1;
        // If ماتادور's block landed on the recipient this same night, the gun
        // still changes hands, but it's quietly a dud — see resolveDayGunAction.
        state.pendingGun = { holderId: targetId, neutralized: targetId === state.night.blockedId };
        logActivity(voter, prefix + t('actYouHandedGun', { name: targetName }));
        recordNightDecision(voter, t('actYouHandedGun', { name: targetName }));
      } else {
        logActivity(voter, prefix + t('actYouNoHandGun'));
        recordNightDecision(voter, t('actYouNoHandGun'));
      }
      state.night.civilianPending.delete('gunner');
      checkCivilianPhaseComplete();
    } else if(role === 'ocean-recruit'){
      if(targetId){
        state.oceanTeam.add(targetId);
        const target = state.players.get(targetId);
        // The "you may talk now" announcement happens in the very next step
        // (ocean-talk), not here — but the recruit's own activity record starts now.
        if(target){
          logActivity(target, prefix + t('actYouWereAddedToGroup'));
          sendToPlayer(target, { type: 'ocean-group-status', inGroup: true });
          if(state.oceanChatLog.length) sendToPlayer(target, { type: 'ocean-chat-log', log: state.oceanChatLog });
          if(target.role === 'mafia') state.night.extraDeathIds.push(voterId);
        }
        logActivity(voter, prefix + t('actYouAddedToGroup', { name: targetName }));
        recordNightDecision(voter, t('actYouAddedToGroup', { name: targetName }));
      } else {
        logActivity(voter, prefix + t('actYouNoAdd'));
        recordNightDecision(voter, t('actYouNoAdd'));
      }
      state.night.civilianPending.delete('ocean-recruit');
      checkCivilianPhaseComplete();
    } else if(role === 'zodiac'){
      state.night.zodiacTargetId = targetId || null;
      logActivity(voter, prefix + (targetName ? t('actYouShot', { name: targetName }) : t('actYouNoShot')));
      recordNightDecision(voter, targetName ? t('actYouShot', { name: targetName }) : t('actYouNoShot'));
      state.night.zodiacPending.delete('zodiac');
      checkZodiacPhaseComplete();
    } else if(role === 'mafia'){
      // (The single kill-decider double-submitting is now caught by the
      // pendingSet guard above, which also correctly covers the "first
      // decision was a skip" case this used to miss — both mafiaTargetId
      // and mafiaRecruitId stay falsy after a skip, so the old check here
      // couldn't tell a skip apart from "not decided yet".)
      if(recruit) state.night.mafiaRecruitId = targetId;
      else state.night.mafiaTargetId = targetId;
      // Unlike every other role, the actual outcome (shot / recruited /
      // backfired) isn't known yet — that's only decided once resolveNight()
      // runs — so this just records the raw DECISION for the God's live
      // view, not a result.
      recordNightDecision(voter, recruit
        ? t('actYouAddedToGroup', { name: targetName })
        : (targetName ? t('actYouShot', { name: targetName }) : t('actYouNoShot')));
      state.night.mafiaPending.delete('kill');
      // If this same player is also tonight's ماتادور, their block prompt was
      // held back (see startMafiaPhaseStep) so it wouldn't collide with the
      // kill prompt — send it now that they've answered the first one.
      const deferred = state.night.deferredMatadorPrompt;
      if(deferred && deferred.entry === voter){
        state.night.deferredMatadorPrompt = null;
        sendToPlayer(deferred.entry, { type: 'phase', phase: 'night-action', day: state.day, role: 'matador', title: t('chooseToBlock'), candidates: deferred.candidates, allowSkip: true });
      }
      checkMafiaPhaseComplete(); // outcome (shot / recruited / failed) is logged once it resolves, in resolveNight()
    }
  }

  App.forceContinueNight = function(){
    if(state.gamePhase === 'night-mafia-phase'){ state.night.mafiaPending.clear(); state.night.deferredMatadorPrompt = null; }
    else if(state.gamePhase === 'night-zodiac-phase') state.night.zodiacPending.clear();
    else if(state.gamePhase === 'night-civilian-phase') state.night.civilianPending.clear();
    advanceNight();
  };

  // Every role has decided (or been skipped) for the night, but nobody's fate is
  // computed or sent to any player yet — that only happens once the host taps
  // "Announce Morning" below, so a night with no remaining roles to prompt (e.g.
  // no اوشن in play) can't silently resolve and eliminate someone instantly.
  function showMorningReadyScreen(){
    state.gamePhase = 'night-morning';
    $('night-morning-day').textContent = t('nightLabel', { n: state.day });
    showScreen('screen-host-night-morning');
    refreshDebugPanelIfOpen();
  }
  App.announceMorning = function(){
    resolveNight();
  };

  function resolveNight(){
    const rawDeaths = new Set();       // may be blocked by the target's own shield, then by a Doctor's save
    const guaranteedDeaths = new Set(); // bypasses both the shield check and a Doctor's save entirely

    // حرفه‌ای's shot: kills a Mafia target (their shield can still absorb it) or backfires on
    // the shooter — the backfire is a truly unavoidable consequence, so neither the shooter's
    // own shield (even though they carry one by default) nor a Doctor's save can stop it.
    const professionalEntries = findAliveByRoleName(ROLE_NAME_PROFESSIONAL);
    const professional = professionalEntries.find(([id]) => id !== state.night.blockedId);
    if(state.night.professionalTargetId && professional){
      const target = state.players.get(state.night.professionalTargetId);
      if(target){
        if(target.role === 'mafia') rawDeaths.add(state.night.professionalTargetId);
        else guaranteedDeaths.add(professional[0]);
      }
    }

    // Mafia's shot, or ساول گودمن's recruit attempt instead of shooting.
    if(state.night.mafiaRecruitId){
      const target = state.players.get(state.night.mafiaRecruitId);
      if(target && target.roleName === ROLE_NAME_PLAIN_VILLAGER){
        target.role = 'mafia';
        target.roleId = null; // no fixed role def for this ad-hoc recruit — resync (see resyncPlayer) falls back to the plain description text
        target.roleName = t('recruitedMafiaName');
        target.roleDesc = t('recruitedMafiaDesc');
        target.roleShield = false;
        sendToPlayer(target, { type: 'role', role: 'mafia', name: target.roleName, description: target.roleDesc, shield: false });
        sendToPlayer(target, { type: 'activity-log', log: state.mafiaActivityLog });
        if(state.mafiaChatLog.length) sendToPlayer(target, { type: 'mafia-chat-log', log: state.mafiaChatLog });
        logMafiaActivity(t('nightLogPrefix', { day: state.day }) + t('actRecruited', { name: target.name }));
      } else {
        logMafiaActivity(t('nightLogPrefix', { day: state.day }) + t('actRecruitFailed', { name: target ? target.name : t('playerLabel') }));
      }
    } else if(state.night.mafiaTargetId){
      const target = state.players.get(state.night.mafiaTargetId);
      rawDeaths.add(state.night.mafiaTargetId);
      logMafiaActivity(t('nightLogPrefix', { day: state.day }) + (target ? t('actMafiaShot', { name: target.name }) : t('actMafiaShotNoOne')));
    }

    // زودیاک's shot — a plain kill attempt like Mafia's, no backfire mechanic.
    // Its target list already excludes independent roles, but since زودیاک is
    // the only one so far it can never target itself anyway.
    if(state.night.zodiacTargetId) rawDeaths.add(state.night.zodiacTargetId);

    // اوشن's fatal mistake: recruiting a Mafia member into the group.
    state.night.extraDeathIds.forEach(id => rawDeaths.add(id));

    // Shields absorb one death each (consumed), then a Doctor's save clears anyone
    // left. زودیاک (or any independent role) never actually dies here regardless —
    // it just stays alive, indistinguishable from a shield absorbing the hit or a
    // Doctor's save from the group's perspective (see gunHitNoEffect/resolveNight
    // callers for the same "don't reveal why" treatment on تفنگدار's gun).
    const finalDeaths = new Set();
    rawDeaths.forEach(id => {
      const entry = state.players.get(id);
      if(!entry) return;
      if(entry.independent) return;
      if(entry.roleShield){ entry.roleShield = false; return; }
      if(id === state.night.savedId) return;
      finalDeaths.add(id);
    });
    // Guaranteed deaths skip both the shield check and the Doctor's save — nothing stops them.
    guaranteedDeaths.forEach(id => {
      const entry = state.players.get(id);
      if(!entry) return;
      finalDeaths.add(id);
    });

    const deadNames = [];
    finalDeaths.forEach(id => {
      const entry = state.players.get(id);
      if(entry && entry.alive){
        entry.alive = false;
        deadNames.push(entry.name);
      }
    });

    // کنستانتین's revival, applied after this night's deaths so the same night's
    // kills can't immediately target someone who was just brought back.
    let revivedName = null;
    let revivedEntry = null;
    if(state.night.revivedId){
      const revived = state.players.get(state.night.revivedId);
      if(revived && !revived.alive){
        revived.alive = true;
        revivedEntry = revived;
        revivedName = revived.name;
      }
    }

    state.winner = checkWinner();
    state.gamePhase = 'night-result';

    finalDeaths.forEach(id => {
      const entry = state.players.get(id);
      if(entry) sendToPlayer(entry, { type: 'eliminated' });
    });
    if(revivedEntry) sendToPlayer(revivedEntry, { type: 'revived', deadNames });
    aliveEntries().forEach(([id, entry]) => {
      if(id === state.night.revivedId) return; // already got their own 'revived' message
      sendToPlayer(entry, { type: 'night-result', deadNames, revivedName, day: state.day });
    });

    $('night-result-day').textContent = t('nightResultLabel', { n: state.day });
    const parts = [];
    if(deadNames.length) parts.push(t('foundDead', { names: deadNames.join(', ') }));
    if(revivedName) parts.push(t('backAmongLiving', { name: revivedName }));
    $('night-result-title').textContent = parts.length ? parts.join(' ') : (state.day === 1 ? t('mafiaOnlyNightResult') : t('everyoneMadeIt'));
    $('night-result-continue-btn').textContent = state.winner ? t('seeResults') : t('continueToDay', { n: state.day + 1 });
    showScreen('screen-host-night-result');
  }

  App.proceedAfterNight = function(){
    if(state.winner) App.showGameOver();
    else App.continueToNextDay();
  };

  App.newGame = function(){
    for(const entry of state.players.values()){ try{ entry.pc && entry.pc.close(); }catch(e){} }
    state.players = new Map();
    state.room = null;
    state.rolesAssigned = false;
    state.pendingRoleSlots = [];
    state.currentPhaseSnapshot = null;
    state.day = 1;
    state.gamePhase = null;
    state.votesRound1 = new Map();
    state.votesRound2 = new Map();
    state.defendingIds = [];
    state.votesInquiry = new Map();
    state.voteHistory = [];
    state.inquiriesRemaining = 0;
    state.winner = null;
    state.night = { blockedId: null, savedId: null, professionalTargetId: null, mafiaTargetId: null, mafiaRecruitId: null, revivedId: null, zodiacTargetId: null, extraDeathIds: [], mafiaPending: new Set(), zodiacPending: new Set(), civilianPending: new Set(), deferredMatadorPrompt: null, killDeciderIds: new Set(), decisionsLog: [] };
    state.doctorSelfSaveUsed = false;
    state.constantineReviveUsed = false;
    state.mafiaActivityLog = [];
    state.mafiaChatLog = [];
    state.oceanChatLog = [];
    state.zodiacChatLog = [];
    state.oceanTeam = new Set();
    state.gunsRemaining = GUNNER_MAX_GUNS;
    state.gunsCancelled = false;
    state.pendingGun = null;
    App.goLanding();
  };

  /* ---------------- Player flow ---------------- */
  App.playerJoinByCode = function(){
    const code = $('input-room-code').value.trim().toUpperCase();
    if(code.length < 4){ toast(t('enterRoomCode')); return; }
    startPlayerJoin(code);
  };

  // A fresh navigation (page load, pasted link, typed code) is genuinely
  // ambiguous about who's arriving: it could be this same tab coming back
  // after being fully killed, or it could be a different tab/device/person
  // that happens to share this browser's localStorage (the exact bug this
  // screen exists to prevent — see the "join as someone else" escape hatch).
  // So instead of silently reconnecting, ask. attemptPlayerReconnect (below)
  // is the only path that skips this, since it only fires from a tab that's
  // already mid-session — there's no ambiguity about who that is.
  function startPlayerJoin(code){
    const session = loadPlayerSession(code);
    if(session && session.name){
      state.pendingRejoinSession = session;
      $('welcome-back-name').textContent = session.name;
      $('welcome-back-continue-btn').textContent = t('btnContinueAs', { name: session.name });
      showScreen('screen-player-welcome-back');
      return;
    }
    beginFreshPlayerJoin(code, generatePlayerToken(), null);
  }

  function beginFreshPlayerJoin(code, token, name){
    state.myPlayerToken = token;
    state.myPlayerName = name;
    state.isReconnecting = !!name;
    savePlayerSession({ room: code, token, name });
    showScreen('screen-player-connecting');
    $('connecting-title').textContent = t('joiningRoom', {code: code});
    $('connecting-hint').textContent = t('contactingHost');
    wsSend({ type: 'join-room', room: code, token });
  }

  // If the WebRTC handshake with the host never completes — no error, no
  // timeout of its own, just silence — a player used to be stuck on this
  // screen forever with zero feedback (the exact "waited forever, nothing
  // happened" failure). This surfaces something actionable instead once
  // enough time has passed without success. Cleared the moment the data
  // channel actually opens (setupPlayerDataChannel) or the flow moves on to
  // a terminal state (room-not-found / host-left).
  function startConnectingTimeout(){
    clearConnectingTimeout();
    state.connectingTimeoutId = setTimeout(() => {
      const hint = $('connecting-stuck-hint');
      const btn = $('connecting-retry-btn');
      if(hint) hint.style.display = 'block';
      if(btn) btn.style.display = 'flex';
    }, 18000);
  }
  function clearConnectingTimeout(){
    if(state.connectingTimeoutId){ clearTimeout(state.connectingTimeoutId); state.connectingTimeoutId = null; }
  }

  // Manual escape hatch once the stuck-hint appears (or the handshake itself
  // errors — see playerHandleSignal's .catch) — re-runs the same join from
  // scratch with the same persisted token, so the host gets a fresh
  // 'player-hello' and rebuilds the connection (hostBeginConnectionTo's
  // existing-entry branch already handles tearing down a stale attempt)
  // instead of leaving them stuck with no way out.
  App.retryJoin = function(){
    const hint = $('connecting-stuck-hint');
    const btn = $('connecting-retry-btn');
    if(hint) hint.style.display = 'none';
    if(btn) btn.style.display = 'none';
    if(!state.room || !state.myPlayerToken){ showScreen('screen-player-join'); return; }
    beginFreshPlayerJoin(state.room, state.myPlayerToken, state.myPlayerName);
  };

  App.continueAsReturningPlayer = function(){
    const session = state.pendingRejoinSession;
    state.pendingRejoinSession = null;
    if(!session) return;
    beginFreshPlayerJoin(session.room, session.token, session.name);
  };

  App.joinAsNewPlayer = function(){
    const session = state.pendingRejoinSession;
    const code = session ? session.room : state.room;
    state.pendingRejoinSession = null;
    clearPlayerSession();
    if(!code){ showScreen('screen-player-join'); return; }
    beginFreshPlayerJoin(code, generatePlayerToken(), null);
  };

  // Escape hatch for when this screen fired from the page-load auto-resume
  // (see peekPlayerSession at the bottom of this script) and it's simply the
  // wrong guess — e.g. this device previously played a DIFFERENT, unrelated
  // game and someone now wants to host, or just pick a room code manually,
  // not reconnect as whoever last played here. Deliberately does NOT clear
  // the persisted session (unlike App.joinAsNewPlayer, which is committing
  // to a specific room) — if they really are that returning player, it'll
  // simply offer this same confirmation again next time, harmless either way.
  App.declineWelcomeBack = function(){
    state.pendingRejoinSession = null;
    App.goLanding();
  };

  // Fires when the data channel dies (screen lock, dropped WiFi, killed tab)
  // or when the tab becomes visible again after being backgrounded and the
  // connection looks dead. Re-establishes the WebSocket if needed, then
  // rejoins with the SAME persisted token so the host reattaches us to our
  // existing seat (see hostBeginConnectionTo/resyncPlayer) instead of treating
  // us as a new player.
  function attemptPlayerReconnect(){
    if(state.role !== 'player' || !state.room || !state.myPlayerToken) return;
    if(state.reconnectInProgress) return;
    state.reconnectInProgress = true;
    state.isReconnecting = true;
    showScreen('screen-player-reconnecting');
    setTimeout(() => {
      if(state.ws && state.ws.readyState === WebSocket.OPEN){
        wsSend({ type: 'join-room', room: state.room, token: state.myPlayerToken });
      } else {
        connectWS(() => {
          wsSend({ type: 'join-room', room: state.room, token: state.myPlayerToken });
        });
      }
    }, 1500);
  }

  // Same idea as attemptPlayerReconnect, but for the HOST — the host's own
  // in-memory game state (state.players, roles, night/day progress) is
  // untouched by a dropped WebSocket, since none of it lives on this
  // connection; only the signaling relay itself needs reconnecting and the
  // room reclaiming (see server.js's HOST_GRACE_MS) before new joins and
  // player reconnects can work again. No screen change needed — the host
  // isn't blocked from anything locally while this runs.
  function attemptHostReconnect(){
    if(state.role !== 'host' || !state.room || !state.hostToken) return;
    if(state.hostReconnectInProgress) return;
    state.hostReconnectInProgress = true;
    const reclaim = () => { wsSend({ type: 'reclaim-room', room: state.room, hostToken: state.hostToken }); };
    if(state.ws && state.ws.readyState === WebSocket.OPEN) reclaim();
    else connectWS(reclaim);
  }

  // Shows the same "stuck" hint + retry button startConnectingTimeout would
  // eventually show, but immediately — for cases where WebRTC actually
  // TELLS us it failed (a rejected offer/answer promise, or ICE reaching
  // 'failed'/'disconnected') rather than just silently never finishing.
  // Common real-world cause: no TURN server is configured (only STUN, see
  // ICE_SERVERS), which works fine on typical WiFi but has no fallback when
  // direct peer-to-peer can't be established — iCloud Private Relay,
  // cellular data instead of WiFi, or a restrictive/guest network are the
  // usual culprits, and the hint text says so.
  function showConnectingStuck(){
    clearConnectingTimeout();
    const hint = $('connecting-stuck-hint');
    const btn = $('connecting-retry-btn');
    if(hint) hint.style.display = 'block';
    if(btn) btn.style.display = 'flex';
  }

  function playerHandleSignal(payload){
    if(payload.kind === 'offer'){
      if(state.playerPC){ try{ state.playerPC.close(); }catch(e){} }
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      state.playerPC = pc;
      pc.ondatachannel = (e) => setupPlayerDataChannel(e.channel);
      pc.onicecandidate = (e) => {
        if(e.candidate) wsSend({ type: 'signal', to: 'host', payload: { kind: 'candidate', candidate: e.candidate } });
      };
      pc.oniceconnectionstatechange = () => {
        if(pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') showConnectingStuck();
      };
      pc.setRemoteDescription(payload.sdp)
        .then(() => pc.createAnswer())
        .then(answer => pc.setLocalDescription(answer))
        .then(() => {
          wsSend({ type: 'signal', to: 'host', payload: { kind: 'answer', sdp: pc.localDescription } });
          $('connecting-title').textContent = t('almostThere');
          $('connecting-hint').textContent = t('finalizingConnection');
        })
        .catch((err) => {
          // Previously this silently died here forever with zero feedback —
          // an unhandled rejection anywhere in the chain above just stopped,
          // and the player never learned why.
          console.error('WebRTC handshake failed:', err);
          showConnectingStuck();
        });
    } else if(payload.kind === 'candidate'){
      if(state.playerPC) state.playerPC.addIceCandidate(payload.candidate).catch(()=>{});
    }
  }

  function setupPlayerDataChannel(dc){
    state.playerDC = dc;
    dc.onopen = () => {
      state.reconnectInProgress = false;
      clearConnectingTimeout();
      if(state.isReconnecting && state.myPlayerName){
        // Re-announce our name so the host's roster stays accurate, then just
        // wait — the host will resync us with whatever's happening right now
        // (role, activity log, current phase/eliminated/game-over).
        try{ state.playerDC.send(JSON.stringify({ type: 'name', name: state.myPlayerName })); }catch(e){}
        showScreen('screen-player-reconnecting');
      } else {
        showScreen('screen-player-name');
      }
    };
    dc.onmessage = (e) => {
      try{
        const msg = JSON.parse(e.data);
        if(msg.type === 'role'){
          state.myRole = msg;
          state.amAlive = true;
          // Only ever SET this true here (never false) — a later 'role'
          // message can arrive for an unrelated reason (getting recruited
          // into Mafia), and that shouldn't wipe out group membership اوشن
          // itself already granted earlier via 'ocean-group-status'.
          if(msg.name === ROLE_NAME_OCEAN) state.inOceanGroup = true;
          // Same "only ever set true" logic as اوشن above — a later 'role'
          // message (e.g. succession renaming پسر to ROLE_NAME_ZODIAC) should
          // never turn this off, and both names belong to the same 2-person
          // group anyway.
          if(msg.name === ROLE_NAME_ZODIAC || msg.name === ROLE_NAME_ZODIAC_SON) state.inZodiacGroup = true;
          state.hasActivityLog = msg.role === 'mafia' ||
            [ROLE_NAME_MATADOR, ROLE_NAME_DOCTOR, ROLE_NAME_DETECTIVE, ROLE_NAME_PROFESSIONAL, ROLE_NAME_CONSTANTINE, ROLE_NAME_OCEAN, ROLE_NAME_GUNNER, ROLE_NAME_ZODIAC, ROLE_NAME_ZODIAC_SON].includes(msg.name);
          document.querySelectorAll('.activity-link').forEach(el => { el.style.display = state.hasActivityLog ? 'block' : 'none'; });
          renderRole(msg);
          showScreen('screen-player-role');
          updateMafiaChatVisibility();
          updateOceanChatVisibility();
          updateZodiacChatVisibility();
        }
        else if(msg.type === 'phase'){ handlePhaseMessage(msg); }
        else if(msg.type === 'day-result'){ handleDayResult(msg); }
        else if(msg.type === 'eliminated'){ state.amAlive = false; updateMafiaChatVisibility(); updateOceanChatVisibility(); updateZodiacChatVisibility(); showScreen('screen-player-eliminated'); }
        else if(msg.type === 'inquiry-result'){ handleInquiryResult(msg); }
        else if(msg.type === 'game-over'){ handleGameOver(msg); }
        else if(msg.type === 'night-result'){ handleNightResult(msg); }
        else if(msg.type === 'investigate-result'){ handleInvestigateResult(msg); }
        else if(msg.type === 'activity-log'){
          state.myActivityLog = msg.log || [];
          // Receiving any activity log at all (e.g. just-recruited by اوشن, or
          // freshly converted to Mafia) means there's something to show — reveal
          // the link even if their original role never granted it up front.
          state.hasActivityLog = true;
          document.querySelectorAll('.activity-link').forEach(el => { el.style.display = 'block'; });
        }
        else if(msg.type === 'revived'){ handleRevived(msg); }
        else if(msg.type === 'day-gun-result'){ handleDayGunResult(msg); }
        else if(msg.type === 'mafia-chat-log'){
          state.mafiaChatLog = msg.log || [];
          renderMafiaChat();
        }
        else if(msg.type === 'ocean-group-status'){
          state.inOceanGroup = !!msg.inGroup;
          updateOceanChatVisibility();
        }
        else if(msg.type === 'ocean-chat-log'){
          state.oceanChatLog = msg.log || [];
          renderOceanChat();
        }
        else if(msg.type === 'zodiac-chat-log'){
          state.zodiacChatLog = msg.log || [];
          renderZodiacChat();
        }
        else if(msg.type === 'vote-history'){
          state.voteHistory = msg.history || [];
          updateVoteHistoryLinkVisibility();
          // Only redraw immediately if this screen happens to be open right
          // now (e.g. a live update while browsing it) — otherwise it's
          // just cached for whenever App.viewVoteHistory() is next opened.
          if(document.getElementById('screen-player-vote-history').classList.contains('active')) renderVoteHistory();
        }
        else if(msg.type === 'reclaimable-seats'){
          // Only relevant while we're still an unnamed brand-new connection
          // sitting on the name-entry screen — if we've already submitted a
          // name (or are mid-reconnect with one), this is stale/irrelevant.
          if(!state.myPlayerName) renderReclaimSeatScreen(msg.names || []);
        }
        else if(msg.type === 'claim-accepted'){
          // The host just handed our connection over to a specific existing
          // (disconnected) seat by name — adopt its real id as our own going
          // forward so a FUTURE drop reconnects us automatically via the
          // normal token-based flow instead of landing back on this same
          // reclaim screen every time.
          state.myPlayerToken = msg.playerId;
          state.myPlayerName = msg.name;
          savePlayerSession({ room: state.room, token: state.myPlayerToken, name: msg.name });
          setDebugBadge(msg.name);
        }
        else if(msg.type === 'claim-failed'){
          toast(t('claimSeatFailed'));
          showScreen('screen-player-name');
        }
        else if(msg.type === 'room-full'){
          // Only reachable via the rare edge case where this connection was
          // let through solely because SOME OTHER seat was disconnected
          // (see hostBeginConnectionTo/handleClaimSeat), and this device
          // then declined to claim it and tried to register as a genuinely
          // new player instead, with no free seat actually available.
          toast(t('roomFullCantJoin'));
        }
      }catch(err){}
    };
    dc.onclose = () => {
      toast(t('connectionToHostLost'));
      attemptPlayerReconnect();
    };
  }

  // Offered right after connecting, only when the host reports at least one
  // NAMED seat currently sitting disconnected (see the 'reclaimable-seats'
  // handler above) — lets someone who lost their persisted session (closed
  // the browser, switched devices) get straight back into their own seat by
  // tapping their name, instead of being funneled into "pick a name" and
  // ending up as a brand-new extra player.
  function renderReclaimSeatScreen(names){
    const box = $('reclaim-seat-list');
    box.innerHTML = '';
    names.forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'btn btn-ghost';
      btn.textContent = name;
      btn.onclick = () => App.claimSeat(name);
      box.appendChild(btn);
    });
    showScreen('screen-player-reclaim-seat');
  }

  App.claimSeat = function(name){
    try{ state.playerDC.send(JSON.stringify({ type: 'claim-seat', name })); }
    catch(e){ toast(t('lostHostConnection')); return; }
    $('connecting-title').textContent = t('almostThere');
    $('connecting-hint').textContent = t('finalizingConnection');
    showScreen('screen-player-connecting');
  };

  // "That's not me" escape hatch — falls through to the normal fresh-name
  // flow instead of claiming anyone else's seat.
  App.declineReclaim = function(){
    showScreen('screen-player-name');
  };

  App.playerSubmitName = function(){
    const val = $('input-player-name').value.trim();
    if(!val){ toast(t('enterNameFirst')); return; }
    try{ state.playerDC.send(JSON.stringify({ type: 'name', name: val })); }
    catch(e){ toast(t('lostHostConnection')); return; }
    state.myPlayerName = val;
    savePlayerSession({ room: state.room, token: state.myPlayerToken, name: val });
    $('wait-title').textContent = t('youreIn', {name: val});
    setDebugBadge(val);
    showScreen('screen-player-waiting');
  };

  function renderRole(msg){
    const front = $('role-front');
    front.classList.remove('is-mafia', 'is-villager');
    front.classList.add(msg.role === 'mafia' ? 'is-mafia' : 'is-villager');
    $('role-title').textContent = (msg.name || (msg.role === 'mafia' ? t('tagMafia') : t('tagVillage'))).toUpperCase();
    $('role-desc').textContent = (msg.roleId ? roleDescription({ id: msg.roleId, description: msg.description }) : msg.description) || '';
    $('role-shield').style.display = msg.shield ? 'inline-flex' : 'none';
    $('role-card').classList.remove('flipped');
  }
  App.flipRole = function(){ $('role-card').classList.toggle('flipped'); };

  /* ---------------- Player: Phase 2 game flow ---------------- */
  function handlePhaseMessage(msg){
    state.lastPhaseMsg = msg;
    if(msg.phase === 'day'){
      $('day-title-player').textContent = t('dayLabel', { n: msg.day });
      showScreen('screen-player-day');
    } else if(msg.phase === 'inquiry-vote'){
      $('inquiry-vote-day-player').textContent = t('dayLabel', { n: msg.day }) + ' · ' + t('morningInquiry');
      showScreen('screen-player-inquiry-vote');
    } else if(msg.phase === 'day-gun-action'){
      renderDayGunActionScreen(msg);
    } else if(msg.phase === 'voting1' || msg.phase === 'voting2'){
      state.voteRound = msg.phase === 'voting1' ? 1 : 2;
      state.voteCandidates = msg.candidates || [];
      state.selectedCandidateIds = new Set();
      renderVoteScreen();
    } else if(msg.phase === 'defense'){
      renderDefenseScreen(msg);
    } else if(msg.phase === 'night'){
      $('night-waiting-day').textContent = t('nightLabel', { n: msg.day });
      $('night-waiting-title').textContent = t('theTownSleeps');
      $('night-waiting-note').textContent = msg.note || '';
      $('night-waiting-note').style.display = msg.note ? 'block' : 'none';
      showScreen('screen-player-night-waiting');
    } else if(msg.phase === 'night-action'){
      renderNightActionScreen(msg);
    } else if(msg.phase === 'night-announcement'){
      $('night-announcement-day').textContent = t('nightLabel', { n: msg.day });
      $('night-announcement-title').textContent = msg.text;
      showScreen('screen-player-night-announcement');
    }
    updateMafiaChatVisibility();
    updateOceanChatVisibility();
    updateZodiacChatVisibility();
  }

  // The Mafia chat drawer (see #mafia-chat-panel) is a single global element,
  // not tied to any one screen — this decides whether it should be showing
  // at all right now, independent of whichever screen is underneath. Covers
  // every night phase, plus daytime conversation phases (talk, inquiry vote,
  // both voting rounds, defense) — so a member can post something for the
  // rest of the team to see and react to any time they're actually playing,
  // not just at night. It deliberately excludes brief transient reveal
  // screens (results, eliminated, game-over) — those aren't "conversation."
  const DAY_CHAT_PHASES = ['day', 'inquiry-vote', 'voting1', 'voting2', 'defense'];
  function isChatVisiblePhase(){
    if(!state.lastPhaseMsg) return false;
    const phase = state.lastPhaseMsg.phase;
    if(phase === 'night' || phase === 'night-announcement') return true;
    if(phase === 'night-action') return state.nightActionRole === 'mafia' || state.nightActionRole === 'matador';
    // Night 1 is the mafia's actual introduction to each other (see
    // mafiaTalkNowNight1) — before that's happened, i.e. still on Day 1,
    // teammates don't know who else is Mafia yet, so the chat must stay
    // closed even though 'day'/'voting1'/etc. are otherwise chat-visible
    // phases. state.lastPhaseMsg.day (not state.day — that field is never
    // updated on the player side, it only ever reflects the HOST's own
    // game) carries the day number of whichever phase this actually was.
    if(DAY_CHAT_PHASES.indexOf(phase) !== -1) return state.lastPhaseMsg.day > 1;
    return false;
  }

  function updateMafiaChatVisibility(){
    const panel = $('mafia-chat-panel');
    if(!panel) return;
    const isMafia = state.myRole && state.myRole.role === 'mafia';
    const show = !!(isMafia && state.amAlive && !state.gameEnded && isChatVisiblePhase());
    panel.classList.toggle('open', show);
    document.body.classList.toggle('mafia-chat-open', show);
    if(show) renderMafiaChat();
  }

  function renderMafiaChat(){
    const list = $('mafia-chat-messages');
    if(!list) return;
    list.innerHTML = '';
    (state.mafiaChatLog || []).forEach(m => {
      const row = document.createElement('div');
      row.className = 'mafia-chat-msg';
      row.innerHTML = '<span class="mafia-chat-sender">' + escapeHtml(m.name) + ':</span> ' + escapeHtml(m.text);
      list.appendChild(row);
    });
    list.scrollTop = list.scrollHeight;
  }

  App.sendMafiaChat = function(){
    const input = $('mafia-chat-input');
    if(!input) return;
    const text = input.value.trim();
    if(!text) return;
    try{ state.playerDC.send(JSON.stringify({ type: 'mafia-chat', text })); }catch(e){ toast(t('lostHostConnection')); return; }
    input.value = '';
  };

  // اوشن's chat has no phase restriction at all — unlike Mafia's, it's meant
  // to stay available the whole game, day or night, for as long as this
  // player is alive and actually in the group (either اوشن itself, or
  // someone it's recruited — see 'ocean-group-status' / the 'role' handler).
  function updateOceanChatVisibility(){
    const panel = $('ocean-chat-panel');
    if(!panel) return;
    const show = !!(state.inOceanGroup && state.amAlive && !state.gameEnded);
    panel.classList.toggle('open', show);
    document.body.classList.toggle('ocean-chat-open', show);
    if(show) renderOceanChat();
  }

  function renderOceanChat(){
    const list = $('ocean-chat-messages');
    if(!list) return;
    list.innerHTML = '';
    (state.oceanChatLog || []).forEach(m => {
      const row = document.createElement('div');
      row.className = 'ocean-chat-msg';
      row.innerHTML = '<span class="ocean-chat-sender">' + escapeHtml(m.name) + ':</span> ' + escapeHtml(m.text);
      list.appendChild(row);
    });
    list.scrollTop = list.scrollHeight;
  }

  App.sendOceanChat = function(){
    const input = $('ocean-chat-input');
    if(!input) return;
    const text = input.value.trim();
    if(!text) return;
    try{ state.playerDC.send(JSON.stringify({ type: 'ocean-chat', text })); }catch(e){ toast(t('lostHostConnection')); return; }
    input.value = '';

  // زودیاک's chat: same "no phase restriction" rule as اوشن's once the game

  /* ---------------- Dev/troubleshooting: God's debug console ---------------- */
  // Shows every player's real role + shield status and the complete activity
  // log (every night/day action, not just each player's own). Host-only,
  // never sent to or visible from a player's device — this reads state.players
  // directly, which only exists on the host's own browser tab.
  App.toggleDebugPanel = function(){
    const panel = $('debug-panel');
    if(!panel) return;
    if(panel.classList.contains('open')){ panel.classList.remove('open'); return; }
    renderDebugPanel();
    panel.classList.add('open');
  };

  // The God can remove any player from the game at any time — day or
  // night, mid-phase or not — for real-world situations no in-game rule
  // anticipates (someone has to leave, a phone is unrecoverable, they're
  // disrupting the game, etc.). This calls eliminatePlayer directly, so
  // unlike an in-game night kill or gun shot it's NOT blocked by a shield,
  // a Doctor's save, or زودیاک's independence — those protections exist to
  // resist another ROLE's attack, and a God kick isn't one; it should
  // always go through. If the kicked player still owed a pending night
  // decision, the existing "Force Continue" / "Force Skip Gun" controls
  // (App.forceContinueNight / App.forceSkipGunDecision) are what unstick
  // that step afterward — kicking doesn't try to auto-resolve it itself.
  App.kickPlayer = function(id){
    const entry = state.players.get(id);
    if(!entry || !entry.alive) return;
    if(!confirm(t('confirmKickPlayer', { name: entry.name }))) return;
    const prefix = (state.gamePhase && state.gamePhase.indexOf('night') === 0)
      ? t('nightLogPrefix', { day: state.day })
      : t('dayLogPrefix', { day: state.day });
    logActivity(entry, prefix + t('actKickedByGod'));
    eliminatePlayer(id);
    state.winner = checkWinner();
    toast(t('playerKicked', { name: entry.name }));
    if(state.winner){ App.showGameOver(); return; }
    renderDebugPanel();
    // The debug panel is an overlay — whatever host screen is underneath
    // (the day screen's alive/eliminated lists, most commonly) needs its
    // own separate refresh or the kicked player stays looking alive there
    // until the host happens to navigate away and back.
    refreshCurrentHostScreen();
  };

  // Undoes a kick (or any other death) in case it was a mistake — "just in
  // case" is the whole point, so this stays available for as long as the
  // player is dead, not just right after a kick. Drops them back into
  // whatever's actually happening right now (resyncPlayer), exactly like a
  // reconnect — not a "the night just ended" narrative message, since this
  // can happen any time, day or night. Note: if the death/kick being undone
  // is what already decided the game (state.winner got set and everyone's
  // seen the game-over screen), this does NOT retroactively un-end it for
  // them — there's no "actually, game's back on" message today. It's meant
  // for the common case: catching a mistake while the game is still going.
  App.revivePlayer = function(id){
    const entry = state.players.get(id);
    if(!entry || entry.alive) return;
    if(!confirm(t('confirmRevivePlayer', { name: entry.name }))) return;
    entry.alive = true;
    const prefix = (state.gamePhase && state.gamePhase.indexOf('night') === 0)
      ? t('nightLogPrefix', { day: state.day })
      : t('dayLogPrefix', { day: state.day });
    logActivity(entry, prefix + t('actRevivedByGod'));
    toast(t('playerRevived', { name: entry.name }));
    if(state.currentPhaseSnapshot) entry.lastPhase = state.currentPhaseSnapshot;
    resyncPlayer(entry, id);
    state.winner = checkWinner();
    renderDebugPanel();
    refreshCurrentHostScreen();
  };

  function refreshDebugPanelIfOpen(){

  // Whichever host screen actually has live game-state content that a
  // kick/revive could just have changed — the debug panel is an overlay,
  // so it never implicitly refreshes what's underneath on its own.
  function refreshCurrentHostScreen(){
    const active = document.querySelector('.screen.active');
    if(!active) return;
    if(active.id === 'screen-host-day') renderDayScreen();
    else if(active.id === 'screen-host-voting') renderVotingTally(state.gamePhase === 'voting1' ? 1 : 2);
    else if(active.id === 'screen-host-defense') renderDefenseList();
    else if(active.id === 'screen-host-lobby') renderLobby();
    else if(active.id === 'screen-host-summary') renderDossier();
  }

  // Live "who's still deciding, who's already decided, and what they
  // chose" for the CURRENT night — see recordNightDecision (pushed to as
  // decisions land) and killDeciderIds (the kill-decider is picked at
  // random each night, not a fixed role, so it can't be found the same way
  // ماتادور/دکتر/etc. can via findAliveByRoleName). Empty outside an active
  // night phase.
  function renderNightStatus(){
    const box = $('debug-night-status');
    if(!box) return;
    box.innerHTML = '';
    if(!state.gamePhase || state.gamePhase.indexOf('night-') !== 0){
      box.innerHTML = '<p class="hint">' + escapeHtml(t('debugNone')) + '</p>';
      return;
    }

    const CIVILIAN_ROLE_NAMES = {
      doctor: ROLE_NAME_DOCTOR, constantine: ROLE_NAME_CONSTANTINE, detective: ROLE_NAME_DETECTIVE,
      professional: ROLE_NAME_PROFESSIONAL, gunner: ROLE_NAME_GUNNER, 'ocean-recruit': ROLE_NAME_OCEAN,
    };
    const waitingLines = [];
    const collectWaiting = (pendingSet, roleNameFor) => {
      pendingSet.forEach(key => {
        if(key === 'kill'){
          state.night.killDeciderIds.forEach(id => {
            const p = state.players.get(id);
            if(p) waitingLines.push((p.roleName || p.role) + ' — ' + p.name);
          });
          return;
        }
        const roleName = roleNameFor(key);
        if(!roleName) return;
        findAliveByRoleName(roleName).forEach(([id, p]) => waitingLines.push(p.roleName + ' — ' + p.name));
      });
    };
    collectWaiting(state.night.mafiaPending, key => key === 'matador' ? ROLE_NAME_MATADOR : null);
    collectWaiting(state.night.zodiacPending, key => key === 'zodiac' ? ROLE_NAME_ZODIAC : null);
    collectWaiting(state.night.civilianPending, key => CIVILIAN_ROLE_NAMES[key] || null);

    if(waitingLines.length) box.appendChild(buildDebugLogSection(t('debugStillWaitingLabel'), waitingLines));

    const decidedLines = state.night.decisionsLog.map(d => d.role + ' — ' + d.player + ': ' + d.text);
    if(decidedLines.length) box.appendChild(buildDebugLogSection(t('debugDecidedLabel'), decidedLines));

    if(!waitingLines.length && !decidedLines.length){
      box.innerHTML = '<p class="hint">' + escapeHtml(t('debugNoActivity')) + '</p>';
    }
  }

  function renderDebugPanel(){
    const stateBox = $('debug-state');
    if(stateBox){
      const winnerText = state.winner ? winnerLabel(state.winner) : t('debugNone');
      const pendingHolder = state.pendingGun ? state.players.get(state.pendingGun.holderId) : null;
      const pendingRoles = state.pendingRoleSlots || [];
      stateBox.innerHTML =
        escapeHtml(t('dayLabel', { n: state.day })) + ' · ' + escapeHtml(t('debugPhaseLabel')) + ': ' + escapeHtml(state.gamePhase || '—') + '<br>' +
        escapeHtml(t('debugWinnerLabel')) + ': ' + escapeHtml(winnerText) + '<br>' +
        escapeHtml(t('debugGunsRemainingLabel')) + ': ' + state.gunsRemaining + ' · ' +
        escapeHtml(t('debugGunsCancelledLabel')) + ': ' + escapeHtml(state.gunsCancelled ? t('yes') : t('no')) + '<br>' +
        escapeHtml(t('debugPendingGunLabel')) + ': ' + (pendingHolder ? escapeHtml(pendingHolder.name) : escapeHtml(t('debugNone'))) + '<br>' +
        escapeHtml(t('debugPendingRolesLabel')) + ': ' + (pendingRoles.length ? (pendingRoles.length + ' — ' + escapeHtml(pendingRolesSummaryText())) : escapeHtml(t('debugNone')));
    }
    const inquiriesValue = $('debug-inquiries-value');
    if(inquiriesValue) inquiriesValue.textContent = state.inquiriesRemaining;

    renderNightStatus();

    const rolesBox = $('debug-roles');
    if(rolesBox){
      rolesBox.innerHTML = '';
      Array.from(state.players.entries()).forEach(([id, entry]) => {
        const row = document.createElement('div');
        row.className = 'debug-row';
        row.innerHTML =
          '<strong>' + escapeHtml(entry.name || '—') + '</strong> — ' + escapeHtml(entry.roleName || entry.role || '—') +
          ' (' + escapeHtml(entry.independent ? t('tagIndependent') : (entry.role === 'mafia' ? t('tagMafia') : t('tagVillage'))) + ') · ' +
          (entry.alive ? escapeHtml(t('debugAlive')) : escapeHtml(t('debugDead'))) + ' · ' +
          (entry.roleShield ? escapeHtml(t('debugShieldOn')) : escapeHtml(t('debugShieldOff'))) + ' · ' +
          (entry.connected ? escapeHtml(t('debugConnected')) : escapeHtml(t('debugDisconnected')));
        // The God can remove anyone still alive right from this row, any
        // time — see App.kickPlayer. Anyone already out can be brought back
        // just as easily — see App.revivePlayer — in case that kick (or an
        // in-game death) turns out to have been a mistake.
        if(entry.alive){
          const kickBtn = document.createElement('button');
          kickBtn.className = 'btn btn-ghost';
          kickBtn.style.cssText = 'margin-top:6px; padding:5px 12px; font-size:12px; color:var(--red-bright); border-color:var(--red-dim);';
          kickBtn.textContent = t('btnKickPlayer');
          kickBtn.onclick = () => App.kickPlayer(id);
          row.appendChild(kickBtn);
        } else {
          const reviveBtn = document.createElement('button');
          reviveBtn.className = 'btn btn-ghost';
          reviveBtn.style.cssText = 'margin-top:6px; padding:5px 12px; font-size:12px; color:var(--gold); border-color:var(--gold-dim);';
          reviveBtn.textContent = t('btnRevivePlayer');
          reviveBtn.onclick = () => App.revivePlayer(id);
          row.appendChild(reviveBtn);
        }
        rolesBox.appendChild(row);
      });
    }

    const activityBox = $('debug-activity');
    if(activityBox){
      activityBox.innerHTML = '';
      // Grouped by day/night instead of by player — every entry already
      // carries a "شب N:"/"روز N:" (or "Night N:"/"Day N:") prefix from
      // nightLogPrefix/dayLogPrefix, so pull that back out to sort and
      // bucket by when it happened, which is what actually matters when
      // troubleshooting ("what happened Night 3") rather than who did it.
      const allEntries = [];
      Array.from(state.players.values()).forEach(entry => {
        (entry.activityLog || []).forEach(text => allEntries.push({ name: entry.name, text }));
      });
      (state.mafiaActivityLog || []).forEach(text => allEntries.push({ name: t('debugMafiaSharedLog'), text }));

      const groups = new Map(); // sortKey -> { label, lines[] }
      allEntries.forEach(({ name, text }) => {
        const meta = extractDebugTimelineMeta(text);
        if(!groups.has(meta.sortKey)) groups.set(meta.sortKey, { label: meta.label, lines: [] });
        groups.get(meta.sortKey).lines.push(name + ': ' + meta.rest);
      });

      const sortedKeys = Array.from(groups.keys()).sort((a, b) => a - b);
      if(sortedKeys.length){
        sortedKeys.forEach(k => {
          const g = groups.get(k);
          activityBox.appendChild(buildDebugLogSection(g.label, g.lines));
        });
      } else {
        activityBox.innerHTML = '<p class="hint">' + escapeHtml(t('debugNoActivity')) + '</p>';
      }
    }

    const voteHistoryBox = $('debug-vote-history');
    if(voteHistoryBox){
      voteHistoryBox.innerHTML = '';
      if(state.voteHistory.length){
        state.voteHistory.forEach(entryLog => {
          const heading = t('dayVoteEyebrow', { day: entryLog.day, round: entryLog.round === 1 ? t('firstVote') : t('finalVote') });
          voteHistoryBox.appendChild(buildDebugLogSection(heading, entryLog.rows.map(voteHistoryRowText)));
        });
      } else {
        voteHistoryBox.innerHTML = '<p class="hint">' + escapeHtml(t('debugNoActivity')) + '</p>';
      }
    }

    const chatBox = $('debug-mafia-chat');
    if(chatBox){
      chatBox.innerHTML = '';
      if(state.mafiaChatLog.length){
        chatBox.appendChild(buildDebugLogSection(t('debugMafiaChatHeading'), state.mafiaChatLog.map(m => m.name + ': ' + m.text)));
      } else {
        chatBox.innerHTML = '<p class="hint">' + escapeHtml(t('debugNoActivity')) + '</p>';
      }
    }

    const oceanChatBox = $('debug-ocean-chat');
    if(oceanChatBox){
      oceanChatBox.innerHTML = '';
      if(state.oceanChatLog.length){
        oceanChatBox.appendChild(buildDebugLogSection(t('debugOceanChatHeading'), state.oceanChatLog.map(m => m.name + ': ' + m.text)));
      } else {
        oceanChatBox.innerHTML = '<p class="hint">' + escapeHtml(t('debugNoActivity')) + '</p>';
      }
    }

    const zodiacChatBox = $('debug-zodiac-chat');
    if(zodiacChatBox){
      zodiacChatBox.innerHTML = '';
      if(state.zodiacChatLog.length){
        zodiacChatBox.appendChild(buildDebugLogSection(t('debugZodiacChatHeading'), state.zodiacChatLog.map(m => m.name + ': ' + m.text)));
      } else {
        zodiacChatBox.innerHTML = '<p class="hint">' + escapeHtml(t('debugNoActivity')) + '</p>';
      }
    }
  }

  // Pulls the "شب N:"/"روز N:" (or "Night N:"/"Day N:") prefix back off an
  // activity-log line — entries can be in either language depending on what
  // state.lang was when they were logged, so both are matched. sortKey
  // orders Day N before Night N before Day N+1, matching actual game flow.
  function extractDebugTimelineMeta(text){
    const m = /^(شب|روز|Night|Day)\s+(\d+):\s*/.exec(text);
    if(!m) return { sortKey: 999999, label: t('debugOther'), rest: text };
    const isNight = (m[1] === 'شب' || m[1] === 'Night');
    const day = parseInt(m[2], 10) || 0;
    const label = isNight ? t('nightLabel', { n: day }) : t('dayLabel', { n: day });
    return { sortKey: day * 2 + (isNight ? 1 : 0), label, rest: text.slice(m[0].length) };
  }

  function buildDebugLogSection(heading, lines){
    const section = document.createElement('div');
    section.className = 'debug-row';
    section.innerHTML = '<strong>' + escapeHtml(heading) + '</strong>';
    lines.forEach(line => {
      const p = document.createElement('div');
      p.className = 'debug-log-entry';
      p.textContent = line;
      section.appendChild(p);
    });
    return section;
  }

  /* ---------------- Init ---------------- */
  window.App = App;
  applyTranslations();
  renderSetupValues();
  renderRoleChecklist();

  const params = new URLSearchParams(location.search);
  const joinCode = params.get('join');
  connectWS(() => {
    if(joinCode){
      state.role = 'player';
      setDebugBadge('PLAYER');
      startPlayerJoin(joinCode.toUpperCase());
    } else {
      // No room code in the URL to go on — but if this browser is holding a
      // persisted player session (see savePlayerSession), this is very
      // likely the SAME player's tab coming back after being killed outright
      // rather than a fresh visitor, and they shouldn't have to remember
      // their room code and rejoin as a brand-new player just because the
      // in-memory connection (and the URL's '?join=' param, if it even had
      // one) didn't survive. Route into the exact same ambiguity-safe
      // Welcome-Back confirmation a '?join=' link would have used — it still
      // asks before actually reconnecting (see startPlayerJoin), so a
      // different person sharing this browser is still asked, never
      // silently logged in as someone else.
      const resumable = peekPlayerSession();
      if(resumable){
        state.role = 'player';
        setDebugBadge('PLAYER');
        startPlayerJoin(resumable.room);
      }
    }
  });

  // Mobile browsers suspend background tabs (screen lock, app-switch) and
  // silently drop the WebRTC connection — this is the #1 way a player used to
  // get permanently kicked out. Whenever the tab becomes visible/usable
  // again (see the two listeners below, for the two different ways that
  // happens), check whether the connection actually survived, and reconnect
  // if not.
  function checkConnectionAfterResume(){
    if(state.role === 'host'){
      // Backup trigger for the same reason attemptPlayerReconnect needs
      // one below: a dead WebSocket doesn't always fire onclose promptly
      // (or at all) after a background suspension — checking readyState
      // directly the moment the tab is foregrounded again catches that.
      if(state.room && state.hostToken && (!state.ws || state.ws.readyState !== WebSocket.OPEN)) attemptHostReconnect();
      return;
    }
    if(state.role !== 'player' || !state.room || !state.myPlayerToken) return;
    const dcDead = !state.playerDC || state.playerDC.readyState !== 'open';
    const wsDead = !state.ws || state.ws.readyState !== WebSocket.OPEN;
    if(dcDead || wsDead) attemptPlayerReconnect();
  }
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') checkConnectionAfterResume();
  });
  // Safari (iOS especially) aggressively restores a tab from its
  // back-forward cache (bfcache) instead of re-running this script at all —
  // tapping the browser's back/forward gesture, or the OS just resuming a
  // suspended tab, can land here with `persisted: true`. Every live network
  // object (the WebSocket, the RTCPeerConnection) was force-killed the
  // moment the page froze into the cache, but NONE of their close/error
  // handlers fire to say so — visibilitychange alone doesn't reliably catch
  // this case since the page can already read as "visible" the instant it's
  // restored, before this listener even runs. Explicitly re-check here too.
  window.addEventListener('pageshow', (e) => {
    if(e.persisted) checkConnectionAfterResume();
  });
})();
</script>
</body>
</html>
