  App.startVoting = function(){
    state.gamePhase = 'voting1';
    state.votesRound1 = new Map();
    const alive = aliveEntries();
    alive.forEach(([id, entry]) => {
      const candidates = alive.filter(([cid]) => cid !== id).map(([cid, e]) => ({ id: cid, name: e.name }));
      sendToPlayer(entry, { type: 'phase', phase: 'voting1', day: state.day, candidates });
    });
    renderVotingTally(1);
    showScreen('screen-host-voting');
  };

  App.startFinalVote = function(){
    state.gamePhase = 'voting2';
    state.votesRound2 = new Map();
    aliveEntries().forEach(([id, entry]) => {
      const candidates = state.defendingIds.filter(cid => cid !== id).map(cid => ({ id: cid, name: state.players.get(cid).name }));
      sendToPlayer(entry, { type: 'phase', phase: 'voting2', day: state.day, candidates });
    });
    renderVotingTally(2);
    showScreen('screen-host-voting');
  };

  function handlePlayerVote(voterId, round, candidateIds){
    const voter = state.players.get(voterId);
    if(!voter || !voter.alive) return;
    const ids = Array.isArray(candidateIds) ? candidateIds : [];
    if(round === 1 && state.gamePhase === 'voting1'){
      state.votesRound1.set(voterId, ids);
      renderVotingTally(1);
    } else if(round === 2 && state.gamePhase === 'voting2'){
      state.votesRound2.set(voterId, ids.filter(id => state.defendingIds.includes(id)));
      renderVotingTally(2);
    }
  }

  function renderVotingTally(round){
    const votes = round === 1 ? state.votesRound1 : state.votesRound2;
    const candidateIds = round === 1 ? aliveEntries().map(([id]) => id) : state.defendingIds;

    const counts = new Map();
    candidateIds.forEach(id => counts.set(id, 0));
    votes.forEach(ids => { ids.forEach(id => { if(counts.has(id)) counts.set(id, counts.get(id) + 1); }); });

    const box = $('voting-tally');
    box.innerHTML = '';
    candidateIds
      .map(id => ({ id, name: state.players.get(id).name, count: counts.get(id) }))
      .sort((a, b) => b.count - a.count)
      .forEach(c => {
        const row = document.createElement('div');
        row.className = 'slot';
        row.innerHTML =
          '<div class="name">' + escapeHtml(c.name) + '</div>' +
          '<div class="status" style="flex:0; white-space:nowrap;">' + t('voteCount', { n: c.count }) + '</div>';
        box.appendChild(row);
      });

    const totalAlive = aliveEntries().length;
    $('voting-progress').textContent = t('votedProgress', { n: votes.size, total: totalAlive });
    $('voting-eyebrow').textContent = t('dayVoteEyebrow', { day: state.day, round: round === 1 ? t('firstVote') : t('finalVote') });
  }

  App.closeVoting = function(){
    if(state.gamePhase === 'voting1') closeVotingRound1();
    else if(state.gamePhase === 'voting2') closeVotingRound2();
  };

  function closeVotingRound1(){
    const counts = new Map();
    state.votesRound1.forEach(ids => ids.forEach(id => counts.set(id, (counts.get(id) || 0) + 1)));
    const threshold = Math.floor(state.votesRound1.size / 2);
    const defendingIds = Array.from(counts.entries()).filter(([id, c]) => c >= threshold).map(([id]) => id);

    if(!defendingIds.length){
      showRoundResult(null, t('noMajorityNoOneTrial'));
      return;
    }
    state.defendingIds = defendingIds;
    state.gamePhase = 'defense';
    broadcastDefensePhase();
  }

  function broadcastDefensePhase(){
    const names = state.defendingIds.map(id => state.players.get(id).name);
    aliveEntries().forEach(([id, entry]) => {
      sendToPlayer(entry, { type: 'phase', phase: 'defense', day: state.day, defendingNames: names, onTrial: state.defendingIds.includes(id) });
    });
    renderDefenseList();
    showScreen('screen-host-defense');
  }

  function renderDefenseList(){
    $('defense-day').textContent = t('dayLabel', { n: state.day });
    const box = $('defense-list');
    box.innerHTML = '';
    state.defendingIds.forEach(id => {
      const entry = state.players.get(id);
      const row = document.createElement('div');
      row.className = 'slot connected';
      row.innerHTML = '<div class="name">' + escapeHtml(entry.name) + '</div>';
      box.appendChild(row);
    });
  }

  function closeVotingRound2(){
    const counts = new Map();
    state.defendingIds.forEach(id => counts.set(id, 0));
    state.votesRound2.forEach(ids => {
      ids.forEach(id => { if(counts.has(id)) counts.set(id, counts.get(id) + 1); });
    });
    const threshold = Math.floor(state.votesRound2.size / 2);

    let eliminatedId = null;
    let note = '';

    if(state.defendingIds.length === 1){
      const onlyId = state.defendingIds[0];
      if(counts.get(onlyId) > 0 && counts.get(onlyId) >= threshold) eliminatedId = onlyId;
    } else {
      const maxCount = Math.max(...state.defendingIds.map(id => counts.get(id)));
      if(maxCount > 0){
        const topIds = state.defendingIds.filter(id => counts.get(id) === maxCount);
        if(topIds.length === 1){
          eliminatedId = topIds[0];
        } else {
          eliminatedId = topIds[Math.floor(Math.random() * topIds.length)];
          note = t('tiedRandomChosen', { n: maxCount, name: state.players.get(eliminatedId).name });
        }
      }
    }

    if(eliminatedId){
      eliminatePlayer(eliminatedId);
      state.winner = checkWinner();
      showRoundResult(eliminatedId, note);
    } else {
      showRoundResult(null, t('noMajorityNoOneLeaves'));
    }
  }

  function eliminatePlayer(id){
    const entry = state.players.get(id);
    entry.alive = false;
    sendToPlayer(entry, { type: 'eliminated' });
  }

  function checkWinner(){
    const alive = Array.from(state.players.values()).filter(e => e.alive);
    const aliveMafia = alive.filter(e => e.role === 'mafia').length;
    const aliveVillagers = alive.filter(e => e.role === 'villager').length;
    if(aliveMafia === 0) return 'village';
    if(aliveVillagers <= aliveMafia) return 'mafia';
    return null;
  }

  function showRoundResult(eliminatedId, note){
    state.gamePhase = 'result';
    const eliminatedEntry = eliminatedId ? state.players.get(eliminatedId) : null;

    aliveEntries().forEach(([id, entry]) => {
      sendToPlayer(entry, { type: 'day-result', eliminatedName: eliminatedEntry ? eliminatedEntry.name : null });
    });

    $('result-day').textContent = t('dayLabel', { n: state.day });
    if(eliminatedEntry){
      $('result-title').textContent = t('votedOut', { name: eliminatedEntry.name });
      $('result-detail').textContent = note || t('rolePrivate');
    } else {
      $('result-title').textContent = t('noOneEliminated');
      $('result-detail').textContent = note || t('didntReachMajority');
    }
    $('result-continue-btn').textContent = state.winner
      ? t('seeResults')
      : t('continueToNight');
    showScreen('screen-host-result');
  }

  App.proceedAfterResult = function(){
    if(state.winner) App.showGameOver();
    else startNight();
  };

  App.continueToNextDay = function(){
    state.day += 1;
    startDayOrInquiry();
  };

  App.showGameOver = function(){
    state.gamePhase = 'game-over';
    const roster = Array.from(state.players.values()).map(e => ({ name: e.name, team: e.role, roleName: e.roleName || e.role }));
    for(const entry of state.players.values()){
      sendToPlayer(entry, { type: 'game-over', winner: state.winner, roster });
    }

    $('game-over-title').textContent = state.winner === 'village' ? t('civiliansWin') : t('mafiaWins');
    const box = $('game-over-roster');
    box.innerHTML = '';
    Array.from(state.players.values()).forEach(entry => {
      const row = document.createElement('div');
      row.className = 'slot' + (entry.alive ? ' connected' : '');
      row.innerHTML =
        '<div class="name">' + escapeHtml(entry.name) + (entry.alive ? '' : ' <span class="hint" style="font-size:11px;">' + escapeHtml(t('outLabel')) + '</span>') + '</div>' +
        '<span class="tag ' + entry.role + '" style="flex-shrink:0;">' + escapeHtml(entry.roleName || entry.role) + '</span>';
      box.appendChild(row);
    });
    showScreen('screen-host-game-over');
  };

  /* ---------------- Night phase ---------------- */
  // Ordered list of night steps. To add a future role's night action, add a
  // 'night-<key>' branch in handleNightAction/forceContinueNight, write a
  // start<Key>Step() that either calls advanceNight() immediately (no eligible
  // actor) or messages the actor and waits, then insert its key here.
  // Mafia-aligned roles (the kill decision and ماتادور's block) act together, in
  // parallel, during one shared 'mafia-phase' step — nobody has to wait for
  // پدر خوانده to decide before ماتادور can decide. Civilian roles stay strictly
  // one-at-a-time, each getting their own sequential step.
  const NIGHT_STEP_ORDER = ['eyes-closed', 'mafia-phase', 'doctor', 'constantine', 'detective', 'professional', 'ocean-recruit', 'ocean-talk'];

  function findAliveByRoleName(name){
    return Array.from(state.players.entries()).filter(([id, e]) => e.alive && e.roleName === name);
  }
  function isBlockedTonight(id){
    return id === state.night.blockedId;
  }

  function startNight(){
    state.night = { blockedId: null, savedId: null, professionalTargetId: null, mafiaTargetId: null, mafiaRecruitId: null, revivedId: null, extraDeathIds: [], mafiaPending: new Set() };
    aliveEntries().forEach(([id, entry]) => sendToPlayer(entry, { type: 'phase', phase: 'night', day: state.day }));
    $('night-day').textContent = t('nightLabel', { n: state.day });
    showScreen('screen-host-night');
    runNightStep(0);
  }

  function runNightStep(index){
    if(index >= NIGHT_STEP_ORDER.length){ resolveNight(); return; }
    state.nightStepIndex = index;
    const step = NIGHT_STEP_ORDER[index];
    state.gamePhase = 'night-' + step;
    if(step === 'mafia-phase') startMafiaPhaseStep();
    else if(step === 'doctor') startDoctorStep();
    else if(step === 'constantine') startConstantineStep();
    else if(step === 'detective') startDetectiveStep();
    else if(step === 'professional') startProfessionalStep();
    else if(step === 'ocean-recruit') startOceanRecruitStep();
    else if(step === 'ocean-talk') startOceanTalkStep();
    else if(step === 'eyes-closed') startEyesClosedStep();
  }

  function advanceNight(){
    runNightStep(state.nightStepIndex + 1);
  }

  function startBlockableRoleStep(roleName, buildCandidates, promptRole, title){
    const holders = findAliveByRoleName(roleName);
    if(!holders.length){ advanceNight(); return; }
    const [actorId, actorEntry] = holders[0];
    if(isBlockedTonight(actorId)){
      sendToPlayer(actorEntry, { type: 'phase', phase: 'night', day: state.day, note: t('youWereBlocked') });
      advanceNight();
      return;
    }
    const candidates = buildCandidates(actorId);
    if(!candidates.length){ advanceNight(); return; }
    sendToPlayer(actorEntry, { type: 'phase', phase: 'night-action', day: state.day, role: promptRole, title, candidates, allowSkip: true });
  }


  function startDoctorStep(){
    startBlockableRoleStep(ROLE_NAME_DOCTOR, (doctorId) => {
      return Array.from(state.players.entries())
        .filter(([id, e]) => e.alive && (id !== doctorId || !state.doctorSelfSaveUsed))
        .map(([id, e]) => ({ id, name: e.name }));
    }, 'doctor', t('chooseToSave'));
  }

  function startConstantineStep(){
    startBlockableRoleStep(ROLE_NAME_CONSTANTINE, () => {
      return Array.from(state.players.entries())
        .filter(([id, e]) => !e.alive)
        .map(([id, e]) => ({ id, name: e.name }));
    }, 'constantine', t('chooseToRevive'));
  }

  function startDetectiveStep(){
    startBlockableRoleStep(ROLE_NAME_DETECTIVE, (detectiveId) => {
      return Array.from(state.players.entries())
        .filter(([id, e]) => e.alive && id !== detectiveId)
        .map(([id, e]) => ({ id, name: e.name }));
    }, 'detective', t('chooseToInvestigate'));
  }

  function startProfessionalStep(){
    startBlockableRoleStep(ROLE_NAME_PROFESSIONAL, (proId) => {
      return Array.from(state.players.entries())
        .filter(([id, e]) => e.alive && id !== proId)
        .map(([id, e]) => ({ id, name: e.name }));
    }, 'professional', t('chooseToShoot'));
  }

  function startOceanRecruitStep(){
    if(state.oceanTeam.size >= state.numOceanSlots){ advanceNight(); return; }
    startBlockableRoleStep(ROLE_NAME_OCEAN, (oceanId) => {
      return Array.from(state.players.entries())
        .filter(([id, e]) => e.alive && id !== oceanId && !state.oceanTeam.has(id))
        .map(([id, e]) => ({ id, name: e.name }));
    }, 'ocean-recruit', t('chooseToAddGroup'));
  }

  function startOceanTalkStep(){
    const oceanEntries = findAliveByRoleName(ROLE_NAME_OCEAN);
    if(!oceanEntries.length){ advanceNight(); return; }
    const oceanId = oceanEntries[0][0];

    const teamIds = [oceanId];
    state.oceanTeam.forEach(id => {
      if(teamIds.indexOf(id) !== -1) return;
      const e = state.players.get(id);
      if(e && e.alive) teamIds.push(id);
    });
    if(teamIds.length < 2){ advanceNight(); return; }

    // Doubles as the "you've joined" notice for anyone recruited moments ago —
    // this step runs immediately after ocean-recruit, so it's their first message either way.
    teamIds.forEach(id => {
      const entry = state.players.get(id);
      if(entry) sendToPlayer(entry, { type: 'phase', phase: 'night-announcement', day: state.day, text: t('oceanGroupJoinTalk') });
    });
    $('ocean-talk-day').textContent = t('nightLabel', { n: state.day });
    showScreen('screen-host-ocean-talk');

    // Guarantee real talk time regardless of how quickly the host taps through —
    // the button is disabled for a few seconds before it can be used.
    const btn = $('ocean-talk-continue-btn');
    if(btn){
      btn.disabled = true;
      setTimeout(() => { btn.disabled = false; }, 4000);
    }
  }
  App.continueAfterOceanTalk = function(){
    advanceNight();
  };

  function startEyesClosedStep(){
    aliveEntries().forEach(([id, entry]) => {
      const text = entry.role === 'mafia'
        ? t('mafiaTalkNow')
        : t('closeYourEyes');
      sendToPlayer(entry, { type: 'phase', phase: 'night-announcement', day: state.day, text });
    });
    $('night-eyes-closed-day').textContent = t('nightLabel', { n: state.day });
    showScreen('screen-host-night-eyes-closed');
  }
  App.continueAfterEyesClosed = function(){
    advanceNight();
  };

  // Mafia's kill/recruit decision and ماتادور's block are prompted at the same
  // time and resolved independently — the phase only advances once every
  // in-play mafia-aligned action has been decided (or the host force-continues).
  function startMafiaPhaseStep(){
    state.night.mafiaPending = new Set();

    const godfathers = findAliveByRoleName(ROLE_NAME_GODFATHER);
    const killDeciders = godfathers.length ? godfathers : Array.from(state.players.entries()).filter(([id, e]) => e.alive && e.role === 'mafia');
    if(killDeciders.length){
      state.night.mafiaPending.add('kill');
      const saulAlive = findAliveByRoleName(ROLE_NAME_SAUL).length > 0;
      const mafiaHasDied = Array.from(state.players.values()).some(e => !e.alive && e.role === 'mafia');
      const canRecruit = saulAlive && mafiaHasDied;
      killDeciders.forEach(([id, entry]) => {
        // Mafia can target their own teammates too — only the decider themselves is excluded.
        const candidates = Array.from(state.players.entries())
          .filter(([cid, e]) => e.alive && cid !== id)
          .map(([cid, e]) => ({ id: cid, name: e.name }));
        sendToPlayer(entry, { type: 'phase', phase: 'night-action', day: state.day, role: 'mafia', title: t('chooseToShoot'), candidates, allowSkip: false, canRecruit });
      });
    }

    const matadors = findAliveByRoleName(ROLE_NAME_MATADOR);
    if(matadors.length){
      const [matadorId, matadorEntry] = matadors[0];
      const candidates = Array.from(state.players.entries())
        .filter(([id, e]) => e.alive && e.role === 'villager' && id !== matadorId)
        .map(([id, e]) => ({ id, name: e.name }));
      if(candidates.length){
        state.night.mafiaPending.add('matador');
        sendToPlayer(matadorEntry, { type: 'phase', phase: 'night-action', day: state.day, role: 'matador', title: t('chooseToBlock'), candidates, allowSkip: true });
      }
    }

    if(!state.night.mafiaPending.size){ advanceNight(); return; }
    showScreen('screen-host-night');
  }
  function checkMafiaPhaseComplete(){
    if(state.night.mafiaPending.size === 0) advanceNight();
  }

  // Personal history for one player (Doctor/Detective/Professional/Matador/Constantine/Ocean).
  function logActivity(entry, text){
    if(!entry.activityLog) entry.activityLog = [];
    entry.activityLog.push(text);
    sendToPlayer(entry, { type: 'activity-log', log: entry.activityLog });
  }
  // Shared history visible to every alive Mafia team member.
  function logMafiaActivity(text){
    state.mafiaActivityLog.push(text);
    Array.from(state.players.values()).filter(e => e.alive && e.role === 'mafia').forEach(e => {
      sendToPlayer(e, { type: 'activity-log', log: state.mafiaActivityLog });
    });
  }

  function handleNightAction(voterId, role, targetId, recruit){
    const voter = state.players.get(voterId);
    if(!voter || !voter.alive) return;
    const isMafiaPhaseRole = (role === 'mafia' || role === 'matador');
    if(state.gamePhase !== (isMafiaPhaseRole ? 'night-mafia-phase' : ('night-' + role))) return;
    const targetName = targetId && state.players.get(targetId) ? state.players.get(targetId).name : null;

    const prefix = t('nightLogPrefix', { day: state.day });

    if(role === 'matador'){
      state.night.blockedId = targetId || null;
      const text = prefix + (targetName ? t('actMatadorBlocked', { name: targetName }) : t('actMatadorNoBlock'));
      logActivity(voter, prefix + (targetName ? t('actYouBlocked', { name: targetName }) : t('actYouNoBlock')));
      logMafiaActivity(text);
      state.night.mafiaPending.delete('matador');
      checkMafiaPhaseComplete();
    } else if(role === 'doctor'){
      state.night.savedId = targetId || null;
      if(targetId && targetId === voterId) state.doctorSelfSaveUsed = true;
      logActivity(voter, prefix + (targetName ? t('actYouSaved', { name: targetName }) : t('actYouNoSave')));
      advanceNight();
    } else if(role === 'constantine'){
      state.night.revivedId = targetId || null;
      logActivity(voter, prefix + (targetName ? t('actYouRevived', { name: targetName }) : t('actYouNoRevive')));
      advanceNight();
    } else if(role === 'detective'){
      if(targetId){
        const target = state.players.get(targetId);
        if(target){
          const isMafia = target.role === 'mafia';
          sendToPlayer(voter, { type: 'investigate-result', targetName: target.name, isMafia });
          logActivity(voter, prefix + t('actYouInvestigated', { name: target.name, result: isMafia ? t('actInvestigatedIsMafia') : t('actInvestigatedNotMafia') }));
        }
      } else {
        logActivity(voter, prefix + t('actYouNoInvestigate'));
      }
      advanceNight();
    } else if(role === 'professional'){
      state.night.professionalTargetId = targetId || null;
      logActivity(voter, prefix + (targetName ? t('actYouShot', { name: targetName }) : t('actYouNoShot')));
      advanceNight();
    } else if(role === 'ocean-recruit'){
      if(targetId){
        state.oceanTeam.add(targetId);
        const target = state.players.get(targetId);
        // The "you may talk now" announcement happens in the very next step
        // (ocean-talk), not here — but the recruit's own activity record starts now.
        if(target){
          logActivity(target, prefix + t('actYouWereAddedToGroup'));
          if(target.role === 'mafia') state.night.extraDeathIds.push(voterId);
        }
        logActivity(voter, prefix + t('actYouAddedToGroup', { name: targetName }));
      } else {
        logActivity(voter, prefix + t('actYouNoAdd'));
      }
      advanceNight();
    } else if(role === 'mafia'){
      if(state.night.mafiaTargetId || state.night.mafiaRecruitId) return; // another mafia member already decided
      if(recruit) state.night.mafiaRecruitId = targetId;
      else state.night.mafiaTargetId = targetId;
      state.night.mafiaPending.delete('kill');
      checkMafiaPhaseComplete(); // outcome (shot / recruited / failed) is logged once it resolves, in resolveNight()
    }
  }

  App.forceContinueNight = function(){
    if(state.gamePhase === 'night-mafia-phase') state.night.mafiaPending.clear();
    else if(state.gamePhase === 'night-doctor') state.night.savedId = null;
    else if(state.gamePhase === 'night-constantine') state.night.revivedId = null;
    else if(state.gamePhase === 'night-professional') state.night.professionalTargetId = null;
    advanceNight();
  };

  function resolveNight(){
    const rawDeaths = new Set();       // may be blocked by the target's own shield, then by a Doctor's save
    const guaranteedDeaths = new Set(); // bypasses both the shield check and a Doctor's save entirely

    // حرفه‌ای's shot: kills a Mafia target (their shield can still absorb it) or backfires on
    // the shooter — the backfire is a truly unavoidable consequence, so neither the shooter's
    // own shield (even though they carry one by default) nor a Doctor's save can stop it.
    const professionalEntries = findAliveByRoleName(ROLE_NAME_PROFESSIONAL);
    const professional = professionalEntries.find(([id]) => id !== state.night.blockedId);
    if(state.night.professionalTargetId && professional){
      const target = state.players.get(state.night.professionalTargetId);
      if(target){
        if(target.role === 'mafia') rawDeaths.add(state.night.professionalTargetId);
        else guaranteedDeaths.add(professional[0]);
      }
    }

    // Mafia's shot, or ساول گودمن's recruit attempt instead of shooting.
    if(state.night.mafiaRecruitId){
      const target = state.players.get(state.night.mafiaRecruitId);
      if(target && target.roleName === ROLE_NAME_PLAIN_VILLAGER){
        target.role = 'mafia';
        target.roleName = t('recruitedMafiaName');
        target.roleDesc = t('recruitedMafiaDesc');
        target.roleShield = false;
        sendToPlayer(target, { type: 'role', role: 'mafia', name: target.roleName, description: target.roleDesc, shield: false });
        sendToPlayer(target, { type: 'activity-log', log: state.mafiaActivityLog });
        logMafiaActivity(t('nightLogPrefix', { day: state.day }) + t('actRecruited', { name: target.name }));
      } else {
        logMafiaActivity(t('nightLogPrefix', { day: state.day }) + t('actRecruitFailed', { name: target ? target.name : t('playerLabel') }));
      }
    } else if(state.night.mafiaTargetId){
      const target = state.players.get(state.night.mafiaTargetId);
      rawDeaths.add(state.night.mafiaTargetId);
      logMafiaActivity(t('nightLogPrefix', { day: state.day }) + (target ? t('actMafiaShot', { name: target.name }) : t('actMafiaShotNoOne')));
    }

    // اوشن's fatal mistake: recruiting a Mafia member into the group.
    state.night.extraDeathIds.forEach(id => rawDeaths.add(id));

    // Shields absorb one death each (consumed), then a Doctor's save clears anyone left.
    const finalDeaths = new Set();
    rawDeaths.forEach(id => {
      const entry = state.players.get(id);
      if(!entry) return;
      if(entry.roleShield){ entry.roleShield = false; return; }
      if(id === state.night.savedId) return;
      finalDeaths.add(id);
    });
    // Guaranteed deaths skip both the shield check and the Doctor's save — nothing stops them.
    guaranteedDeaths.forEach(id => {
      const entry = state.players.get(id);
      if(!entry) return;
      finalDeaths.add(id);
    });

    const deadNames = [];
    finalDeaths.forEach(id => {
      const entry = state.players.get(id);
      if(entry && entry.alive){
        entry.alive = false;
        deadNames.push(entry.name);
      }
    });

    // کنستانتین's revival, applied after this night's deaths so the same night's
    // kills can't immediately target someone who was just brought back.
    let revivedName = null;
    let revivedEntry = null;
    if(state.night.revivedId){
      const revived = state.players.get(state.night.revivedId);
      if(revived && !revived.alive){
        revived.alive = true;
        revivedEntry = revived;
        revivedName = revived.name;
      }
    }

    state.winner = checkWinner();
    state.gamePhase = 'night-result';

    finalDeaths.forEach(id => {
      const entry = state.players.get(id);
      if(entry) sendToPlayer(entry, { type: 'eliminated' });
    });
    if(revivedEntry) sendToPlayer(revivedEntry, { type: 'revived', deadNames });
    aliveEntries().forEach(([id, entry]) => {
      if(id === state.night.revivedId) return; // already got their own 'revived' message
      sendToPlayer(entry, { type: 'night-result', deadNames, revivedName });
    });

    $('night-result-day').textContent = t('nightResultLabel', { n: state.day });
    const parts = [];
    if(deadNames.length) parts.push(t('foundDead', { names: deadNames.join(', ') }));
    if(revivedName) parts.push(t('backAmongLiving', { name: revivedName }));
    $('night-result-title').textContent = parts.length ? parts.join(' ') : t('everyoneMadeIt');
    $('night-result-continue-btn').textContent = state.winner ? t('seeResults') : t('continueToDay', { n: state.day + 1 });
    showScreen('screen-host-night-result');
  }

  App.proceedAfterNight = function(){
    if(state.winner) App.showGameOver();
    else App.continueToNextDay();
  };

  App.newGame = function(){
    for(const entry of state.players.values()){ try{ entry.pc && entry.pc.close(); }catch(e){} }
    state.players = new Map();
    state.room = null;
    state.day = 1;
    state.gamePhase = null;
    state.votesRound1 = new Map();
    state.votesRound2 = new Map();
    state.defendingIds = [];
    state.votesInquiry = new Map();
    state.inquiriesRemaining = 0;
    state.winner = null;
    state.night = { blockedId: null, savedId: null, professionalTargetId: null, mafiaTargetId: null, mafiaRecruitId: null, revivedId: null, extraDeathIds: [], mafiaPending: new Set() };
    state.doctorSelfSaveUsed = false;
    state.mafiaActivityLog = [];
    state.oceanTeam = new Set();
    App.goLanding();
  };

  /* ---------------- Player flow ---------------- */
  App.playerJoinByCode = function(){
    const code = $('input-room-code').value.trim().toUpperCase();
    if(code.length < 4){ toast(t('enterRoomCode')); return; }
    startPlayerJoin(code);
  };

  function startPlayerJoin(code){
    showScreen('screen-player-connecting');
    $('connecting-title').textContent = t('joiningRoom', {code: code});
    $('connecting-hint').textContent = t('contactingHost');
    wsSend({ type: 'join-room', room: code });
  }

  function playerHandleSignal(payload){
    if(payload.kind === 'offer'){
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      state.playerPC = pc;
      pc.ondatachannel = (e) => setupPlayerDataChannel(e.channel);
      pc.onicecandidate = (e) => {
        if(e.candidate) wsSend({ type: 'signal', to: 'host', payload: { kind: 'candidate', candidate: e.candidate } });
      };
      pc.setRemoteDescription(payload.sdp)
        .then(() => pc.createAnswer())
        .then(answer => pc.setLocalDescription(answer))
        .then(() => {
          wsSend({ type: 'signal', to: 'host', payload: { kind: 'answer', sdp: pc.localDescription } });
          $('connecting-title').textContent = t('almostThere');
          $('connecting-hint').textContent = t('finalizingConnection');
        });
    } else if(payload.kind === 'candidate'){
      if(state.playerPC) state.playerPC.addIceCandidate(payload.candidate).catch(()=>{});
    }
  }

  function setupPlayerDataChannel(dc){
    state.playerDC = dc;
    dc.onopen = () => { showScreen('screen-player-name'); };
    dc.onmessage = (e) => {
      try{
        const msg = JSON.parse(e.data);
        if(msg.type === 'role'){
          state.myRole = msg;
          state.hasActivityLog = msg.role === 'mafia' ||
            [ROLE_NAME_MATADOR, ROLE_NAME_DOCTOR, ROLE_NAME_DETECTIVE, ROLE_NAME_PROFESSIONAL, ROLE_NAME_CONSTANTINE, ROLE_NAME_OCEAN].includes(msg.name);
          document.querySelectorAll('.activity-link').forEach(el => { el.style.display = state.hasActivityLog ? 'block' : 'none'; });
          renderRole(msg);
          showScreen('screen-player-role');
        }
        else if(msg.type === 'phase'){ handlePhaseMessage(msg); }
        else if(msg.type === 'day-result'){ handleDayResult(msg); }
        else if(msg.type === 'eliminated'){ showScreen('screen-player-eliminated'); }
        else if(msg.type === 'inquiry-result'){ handleInquiryResult(msg); }
        else if(msg.type === 'game-over'){ handleGameOver(msg); }
        else if(msg.type === 'night-result'){ handleNightResult(msg); }
        else if(msg.type === 'investigate-result'){ handleInvestigateResult(msg); }
        else if(msg.type === 'activity-log'){
          state.myActivityLog = msg.log || [];
          // Receiving any activity log at all (e.g. just-recruited by اوشن, or
          // freshly converted to Mafia) means there's something to show — reveal
          // the link even if their original role never granted it up front.
          state.hasActivityLog = true;
          document.querySelectorAll('.activity-link').forEach(el => { el.style.display = 'block'; });
        }
        else if(msg.type === 'revived'){ handleRevived(msg); }
      }catch(err){}
    };
    dc.onclose = () => { toast(t('connectionToHostLost')); };
  }

  App.playerSubmitName = function(){
    const val = $('input-player-name').value.trim();
    if(!val){ toast(t('enterNameFirst')); return; }
    try{ state.playerDC.send(JSON.stringify({ type: 'name', name: val })); }
    catch(e){ toast(t('lostHostConnection')); return; }
    $('wait-title').textContent = t('youreIn', {name: val});
    setDebugBadge(val);
    showScreen('screen-player-waiting');
  };

  function renderRole(msg){
    const front = $('role-front');
    front.classList.remove('is-mafia', 'is-villager');
    front.classList.add(msg.role === 'mafia' ? 'is-mafia' : 'is-villager');
    $('role-title').textContent = (msg.name || (msg.role === 'mafia' ? t('tagMafia') : t('tagVillage'))).toUpperCase();
    $('role-desc').textContent = (msg.roleId ? roleDescription({ id: msg.roleId, description: msg.description }) : msg.description) || '';
    $('role-shield').style.display = msg.shield ? 'inline-flex' : 'none';
    $('role-card').classList.remove('flipped');
  }
  App.flipRole = function(){ $('role-card').classList.toggle('flipped'); };

  /* ---------------- Player: Phase 2 game flow ---------------- */
  function handlePhaseMessage(msg){
    state.lastPhaseMsg = msg;
    if(msg.phase === 'day'){
      $('day-title-player').textContent = t('dayLabel', { n: msg.day });
      showScreen('screen-player-day');
    } else if(msg.phase === 'inquiry-vote'){
      $('inquiry-vote-day-player').textContent = t('dayLabel', { n: msg.day }) + ' · ' + t('morningInquiry');
      showScreen('screen-player-inquiry-vote');
    } else if(msg.phase === 'voting1' || msg.phase === 'voting2'){
      state.voteRound = msg.phase === 'voting1' ? 1 : 2;
      state.voteCandidates = msg.candidates || [];
      state.selectedCandidateIds = new Set();
      renderVoteScreen();
    } else if(msg.phase === 'defense'){
      renderDefenseScreen(msg);
    } else if(msg.phase === 'night'){
      $('night-waiting-day').textContent = t('nightLabel', { n: msg.day });
      $('night-waiting-title').textContent = t('theTownSleeps');
      $('night-waiting-note').textContent = msg.note || '';
      $('night-waiting-note').style.display = msg.note ? 'block' : 'none';
      showScreen('screen-player-night-waiting');
    } else if(msg.phase === 'night-action'){
      renderNightActionScreen(msg);
    } else if(msg.phase === 'night-announcement'){
      $('night-announcement-day').textContent = t('nightLabel', { n: msg.day });
      $('night-announcement-title').textContent = msg.text;
      showScreen('screen-player-night-announcement');
    }
  }

  function renderVoteScreen(){
    $('vote-title').textContent = state.voteRound === 1 ? t('whoSuspect') : t('finalVoteTitle');
    const list = $('vote-candidate-list');
    list.innerHTML = '';
    const hasCandidates = state.voteCandidates.length > 0;
    $('vote-multi-hint').style.display = hasCandidates ? 'block' : 'none';
    $('vote-empty-hint').style.display = hasCandidates ? 'none' : 'block';
    $('vote-submit-btn').style.display = hasCandidates ? 'flex' : 'none';
    state.voteCandidates.forEach(c => {
      const row = document.createElement('label');
      row.className = 'role-row role-check-row';
      row.innerHTML =
        '<input type="checkbox"' + (state.selectedCandidateIds.has(c.id) ? ' checked' : '') + '>' +
        '<div class="role-info"><span class="role-name">' + escapeHtml(c.name) + '</span></div>';
      row.querySelector('input').onchange = (e) => {
        if(e.target.checked) state.selectedCandidateIds.add(c.id);
        else state.selectedCandidateIds.delete(c.id);
      };
      list.appendChild(row);
    });
    showScreen('screen-player-vote');
  }

  App.submitVote = function(){
    const candidateIds = Array.from(state.selectedCandidateIds);
    try{ state.playerDC.send(JSON.stringify({ type: 'vote', round: state.voteRound, candidateIds })); }
    catch(e){ toast(t('lostHostConnection')); return; }
    $('vote-waiting-text').textContent = candidateIds.length ? t('voteSubmittedWaiting') : t('voteSkippedWaiting');
    showScreen('screen-player-vote-waiting');
  };

  function renderDefenseScreen(msg){
    if(msg.onTrial){
      $('defense-player-title').textContent = t('defenseYouOnTrial');
      $('defense-player-hint').textContent = t('defenseYouHint');
    } else {
      $('defense-player-title').textContent = t('defenseOthersTitle', { names: msg.defendingNames.join(', ') });
      $('defense-player-hint').textContent = t('defenseOthersHint');
    }
    showScreen('screen-player-defense');
  }

  function handleDayResult(msg){
    $('day-result-title').textContent = msg.eliminatedName ? t('votedOutPlayer', { name: msg.eliminatedName }) : t('noOneEliminatedPlayer');
    showScreen('screen-player-day-result');
  }

  App.submitInquiryVote = function(choice){
    try{ state.playerDC.send(JSON.stringify({ type: 'inquiry-vote', choice })); }
    catch(e){ toast(t('lostHostConnection')); return; }
    showScreen('screen-player-inquiry-waiting');
  };

  function handleInquiryResult(msg){
    if(msg.granted){
      $('inquiry-result-title-player').textContent = t('inquiryGranted');
      $('inquiry-result-detail-player').textContent = t('inquiryDetailPlayer', { mafiaOut: msg.mafiaOut, villagerOut: msg.villagerOut });
    } else {
      $('inquiry-result-title-player').textContent = t('noInquiryToday');
      $('inquiry-result-detail-player').textContent = t('notEnoughVotes');
    }
    showScreen('screen-player-inquiry-result');
  }

  function handleGameOver(msg){
    $('game-over-title-player').textContent = msg.winner === 'village' ? t('civiliansWin') : t('mafiaWins');
    const box = $('game-over-roster-player');
    box.innerHTML = '';
    (msg.roster || []).forEach(p => {
      const row = document.createElement('div');
      row.className = 'slot';
      row.innerHTML =
        '<div class="name">' + escapeHtml(p.name) + '</div>' +
        '<span class="tag ' + p.team + '" style="flex-shrink:0;">' + escapeHtml(p.roleName || p.team) + '</span>';
      box.appendChild(row);
    });
    showScreen('screen-player-game-over');
  }

  function renderNightActionScreen(msg){
    state.nightActionRole = msg.role;
    state.selectedNightTargetId = null;
    $('night-action-day').textContent = t('nightLabel', { n: msg.day });
    $('night-action-title').textContent = msg.title || t('chooseSomeone');
    const recruitToggle = $('night-action-recruit-toggle');
    if(recruitToggle){
      recruitToggle.style.display = msg.canRecruit ? 'flex' : 'none';
      $('night-action-recruit-checkbox').checked = false;
    }
    const list = $('night-action-candidate-list');
    list.innerHTML = '';
    (msg.candidates || []).forEach(c => {
      const row = document.createElement('label');
      row.className = 'role-row role-check-row';
      row.innerHTML =
        '<input type="radio" name="night-target">' +
        '<div class="role-info"><span class="role-name">' + escapeHtml(c.name) + '</span></div>';
      row.querySelector('input').onchange = () => { state.selectedNightTargetId = c.id; };
      list.appendChild(row);
    });
    $('night-action-skip-btn').style.display = msg.allowSkip ? 'flex' : 'none';
    showScreen('screen-player-night-action');
  }

  function sendNightAction(targetId){
    const recruitEl = $('night-action-recruit-checkbox');
    const recruit = !!(recruitEl && recruitEl.checked);
    try{ state.playerDC.send(JSON.stringify({ type: 'night-action', role: state.nightActionRole, targetId, recruit })); }
    catch(e){ toast(t('lostHostConnection')); return; }
    $('night-waiting-note').style.display = 'none';
    showScreen('screen-player-night-waiting');
  }

  App.submitNightAction = function(){
    if(!state.selectedNightTargetId){ toast(t('pickSomeoneFirst')); return; }
    sendNightAction(state.selectedNightTargetId);
  };
  App.skipNightAction = function(){
    sendNightAction(null);
  };

  function nightResultText(deadNames, revivedName){
    const parts = [];
    if(deadNames && deadNames.length) parts.push(t('foundDead', { names: deadNames.join(', ') }));
    if(revivedName) parts.push(t('backAmongLiving', { name: revivedName }));
    return parts.length ? parts.join(' ') : t('everyoneMadeIt');
  }

  function handleNightResult(msg){
    $('night-waiting-title').textContent = t('morningHasCome');
    $('night-waiting-note').textContent = nightResultText(msg.deadNames, msg.revivedName);
    $('night-waiting-note').style.display = 'block';
    showScreen('screen-player-night-waiting');
  }

  function handleRevived(msg){
    toast(t('backInGame'));
    $('night-waiting-title').textContent = t('morningHasCome');
    $('night-waiting-note').textContent = nightResultText(msg.deadNames, null);
    $('night-waiting-note').style.display = 'block';
    showScreen('screen-player-night-waiting');
  }

  function handleInvestigateResult(msg){
    $('investigate-result-title').textContent = msg.isMafia ? t('isMafia', { name: msg.targetName }) : t('isNotMafia', { name: msg.targetName });
    showScreen('screen-player-investigate-result');
  }

  App.viewMyRole = function(){
    if(!state.myRole) return;
    const current = document.querySelector('.screen.active');
    state.roleReturnScreen = current ? current.id : 'screen-player-day';
    renderRole(state.myRole);
    $('role-back-btn').style.display = 'flex';
    showScreen('screen-player-role');
  };
  App.closeMyRole = function(){
    $('role-back-btn').style.display = 'none';
    showScreen(state.roleReturnScreen || 'screen-player-day');
  };

  App.viewMyActivity = function(){
    const current = document.querySelector('.screen.active');
    state.activityReturnScreen = current ? current.id : 'screen-player-day';
    renderActivityLog();
    showScreen('screen-player-activity-log');
  };
  App.closeMyActivity = function(){
    showScreen(state.activityReturnScreen || 'screen-player-day');
  };
  function renderActivityLog(){
    const box = $('activity-log-list');
    box.innerHTML = '';
    const log = state.myActivityLog || [];
    if(!log.length){
      box.innerHTML = '<p class="hint">' + escapeHtml(t('nothingYet')) + '</p>';
      return;
    }
    log.forEach(text => {
      const row = document.createElement('div');
      row.className = 'slot';
      row.innerHTML = '<div class="name" style="white-space:normal;">' + escapeHtml(text) + '</div>';
      box.appendChild(row);
    });
  }

  /* ---------------- Init ---------------- */
  window.App = App;
  applyTranslations();
  renderSetupValues();
  renderRoleChecklist();

  const params = new URLSearchParams(location.search);
  const joinCode = params.get('join');
  connectWS(() => {
    if(joinCode){
      state.role = 'player';
      setDebugBadge('PLAYER');
      startPlayerJoin(joinCode.toUpperCase());
    }
  });
})();
</script>
</body>
