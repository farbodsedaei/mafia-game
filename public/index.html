<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MAFIA — Night Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D13;
    --surface:#151A24;
    --surface-2:#1C2330;
    --line: rgba(237,239,244,0.09);
    --line-strong: rgba(237,239,244,0.16);
    --text:#EDEFF4;
    --text-muted:#8A93A6;
    --text-faint:#5B6478;
    --red:#C4364B;
    --red-bright:#E14C63;
    --red-dim:#3A1620;
    --gold:#D4A857;
    --gold-dim:#3A311D;
    --slate:#6E7A94;
    --slate-dim:#1E2634;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(196,54,75,0.08), transparent 60%),
      radial-gradient(80% 60% at 80% 100%, rgba(212,168,87,0.05), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  .eyebrow{font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-faint); font-weight:600;}
  h1,h2,h3{font-family:'Playfair Display', serif; margin:0; letter-spacing:-0.01em;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; position:relative;}
  .screen{display:none; flex-direction:column; flex:1; animation: rise .38s ease both;}
  .screen.active{display:flex;}
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .brandmark{display:flex; align-items:center; gap:10px; margin-bottom:auto;}
  .brandmark .dot{width:8px; height:8px; border-radius:50%; background:var(--red-bright); box-shadow:0 0 12px var(--red-bright);}
  .brandmark span{font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.2em; color:var(--text-faint); text-transform:uppercase;}
  .btn{appearance:none; border:none; cursor:pointer; font-family:'Inter', sans-serif; font-weight:700; font-size:16px; padding:17px 22px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:10px; transition: transform .15s ease, opacity .15s ease; width:100%;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--red-bright); color:#fff; box-shadow:0 8px 24px -8px rgba(225,76,99,0.55);}
  .btn-primary:disabled{background:var(--surface-2); color:var(--text-faint); box-shadow:none; cursor:not-allowed;}
  .btn-outline{background:transparent; color:var(--text); border:1.5px solid var(--line-strong);}
  .btn-ghost{background:var(--surface); color:var(--text-muted); font-weight:600; font-size:14px; padding:13px 18px;}
  .btn-gold{background:var(--gold); color:#20180A;}
  .stack{display:flex; flex-direction:column; gap:12px;}
  .grow{flex:1;}
  .center{display:flex; flex-direction:column; align-items:center; text-align:center; justify-content:center;}
  .field{display:flex; flex-direction:column; gap:8px; margin-bottom:18px;}
  .field label{font-size:13px; font-weight:600; color:var(--text-muted);}
  .field input{background:var(--surface); border:1.5px solid var(--line); color:var(--text); font-family:'Inter', sans-serif; font-size:17px; font-weight:600; padding:15px 16px; border-radius:12px; outline:none; width:100%;}
  .field input:focus{border-color:var(--red-bright);}
  .field input.code-input{text-align:center; letter-spacing:0.3em; text-transform:uppercase; font-family:'JetBrains Mono', monospace;}
  select.role-select{background:var(--surface); border:1.5px solid var(--line); color:var(--text); font-family:'Inter', sans-serif; font-size:16px; font-weight:600; padding:14px 16px; border-radius:12px; outline:none; width:100%; appearance:none;}
  select.role-select:focus{border-color:var(--red-bright);}
  .role-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px;}
  .role-row .role-info{flex:1; min-width:0;}
  .role-row .role-name{font-weight:700; font-size:15px;}
  .role-row .role-team-tag{margin-left:8px;}
  .role-row .role-desc-small{font-size:12px; color:var(--text-faint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .role-check-row{cursor:pointer;}
  .role-check-row input[type="checkbox"], .role-check-row input[type="radio"]{width:20px; height:20px; flex-shrink:0; accent-color:var(--gold);}
  label.shield-toggle{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-muted); font-weight:600; cursor:pointer;}
  label.shield-toggle input{width:18px; height:18px; accent-color:var(--gold);}
  .stepper{display:flex; align-items:center; gap:14px;}
  .stepper button{width:46px; height:46px; border-radius:12px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--text); font-size:20px; font-weight:700; cursor:pointer;}
  .stepper .val{flex:1; text-align:center; font-family:'Playfair Display', serif; font-size:28px; font-weight:800;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px;}
  .hint{font-size:13px; color:var(--text-muted); line-height:1.5;}
  .slot{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;}
  .slot.connected{border-color: rgba(212,168,87,0.35); background:linear-gradient(180deg, rgba(212,168,87,0.06), transparent);}
  .slot .num{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-faint); width:26px; height:26px; border-radius:50%; border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .slot.connected .num{color:var(--gold); border-color:var(--gold);}
  .slot .name{font-weight:700; font-size:15px; flex:1;}
  .slot .status{font-size:13px; color:var(--text-faint); flex:1;}
  .slot .check{color:var(--gold); font-size:18px;}
  .room-code-display{font-family:'JetBrains Mono',monospace; font-size:38px; font-weight:700; letter-spacing:0.15em; text-align:center; color:var(--gold); margin:6px 0;}
  .link-box{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:6px;}
  .link-box span{flex:1; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .link-box button{flex-shrink:0; background:var(--surface); border:1px solid var(--line-strong); color:var(--text); border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer;}
  .step-pill{display:inline-flex; align-items:center; gap:8px; background:var(--surface-2); padding:8px 14px; border-radius:999px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; color:var(--gold); text-transform:uppercase; margin:0 auto 18px;}
  .role-card{width:100%; max-width:300px; aspect-ratio:3/4.4; margin:0 auto; perspective:1400px; cursor:pointer;}
  .role-card-inner{position:relative; width:100%; height:100%; transition:transform .7s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d;}
  .role-card.flipped .role-card-inner{transform:rotateY(180deg);}
  .role-face{position:absolute; inset:0; border-radius:22px; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; border:1px solid var(--line-strong);}
  .role-back{background: repeating-linear-gradient(135deg, rgba(196,54,75,0.10) 0 2px, transparent 2px 22px), var(--surface);}
  .role-back .moon{width:54px; height:54px; border-radius:50%; background:var(--gold); box-shadow: -14px 0 0 -6px var(--bg) inset, 0 0 30px rgba(212,168,87,0.35); margin-bottom:18px;}
  .role-front{transform:rotateY(180deg); text-align:center;}
  .role-front.is-mafia{background:linear-gradient(180deg, var(--red-dim), var(--surface));}
  .role-front.is-villager{background:linear-gradient(180deg, var(--slate-dim), var(--surface));}
  .role-title{font-size:34px; font-weight:900; margin:14px 0 10px; letter-spacing:0.01em;}
  .is-mafia .role-title{color:var(--red-bright);}
  .is-villager .role-title{color:#C9D2E3;}
  .role-desc{font-size:14px; color:var(--text-muted); line-height:1.55;}
  table.dossier{width:100%; border-collapse:collapse;}
  table.dossier td{padding:13px 6px; border-bottom:1px solid var(--line); font-size:15px;}
  table.dossier tr:last-child td{border-bottom:none;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:0.08em; padding:5px 10px; border-radius:6px; text-transform:uppercase;}
  .tag.mafia{background:var(--red-dim); color:var(--red-bright);}
  .tag.villager{background:var(--slate-dim); color:var(--slate);}
  .tag.shield{background:var(--gold-dim); color:var(--gold);}
  .tag.independent{background:rgba(237,239,244,0.08); color:var(--text-muted); border:1px solid var(--line-strong);}
  .spinner{width:20px; height:20px; border-radius:50%; border:2.5px solid rgba(255,255,255,0.25); border-top-color:#fff; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .pulse-dot{width:8px; height:8px; border-radius:50%; background:var(--gold); animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:0.3;} 50%{opacity:1;}}
  .toast{position:fixed; left:50%; bottom:32px; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--line-strong); color:var(--text); padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600; z-index:100; max-width:85%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.4);}
  .banner{background:var(--gold-dim); border:1px solid rgba(212,168,87,0.3); color:var(--gold); font-size:13px; padding:12px 14px; border-radius:12px; margin-bottom:16px; line-height:1.5;}
  .banner.warning{background:var(--red-dim); border-color:rgba(196,54,75,0.35); color:var(--red-bright); margin-bottom:0;}
  .link-btn{appearance:none; background:none; border:none; color:var(--gold); font-family:'Inter', sans-serif; font-weight:700; font-size:13px; cursor:pointer; padding:8px 0;}
  .lang-switch{position:fixed; top:6px; right:8px; z-index:1000; display:flex; gap:2px; background:rgba(0,0,0,0.55); border-radius:8px; padding:3px;}
  .lang-switch button{appearance:none; background:none; border:none; color:var(--text-faint); font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; padding:4px 8px; border-radius:6px; cursor:pointer;}
  .lang-switch button.active{background:var(--gold-dim); color:var(--gold);}
</style>
</head>
<body>
<div id="app">

  <!-- LANDING -->
  <div class="screen active" id="screen-landing">
    <div class="brandmark"><div class="dot"></div><span id="conn-indicator" data-i18n="connConnecting"></span></div>
    <div class="grow center">
      <div class="eyebrow" style="margin-bottom:14px;" data-i18n="landingEyebrow"></div>
      <h1 style="font-size:56px; line-height:0.95;" data-i18n="landingTitle"></h1>
      <p class="hint" style="max-width:280px; margin-top:16px;" data-i18n="landingTagline"></p>
    </div>
    <div class="stack" style="margin-top:24px;">
      <button class="btn btn-primary" onclick="App.goLanding('host')"><span data-i18n="btnHost"></span> <span style="opacity:.7" data-i18n="btnHostGod"></span></button>
      <button class="btn btn-outline" onclick="App.goLanding('player')" data-i18n="btnPlayer"></button>
      <button class="link-btn" style="margin:0 auto;" onclick="App.openManageRoles('landing')" data-i18n="btnRolesShields"></button>
    </div>
  </div>

  <!-- HOST SETUP -->
  <div class="screen" id="screen-host-setup">
    <div class="eyebrow" data-i18n="hostSetupEyebrow"></div>
    <h2 style="font-size:28px; margin:10px 0 26px;" data-i18n="hostSetupTitle"></h2>
    <div class="field">
      <label data-i18n="labelNumPlayers"></label>
      <div class="stepper">
        <button onclick="App.stepPlayers(-1)">&minus;</button>
        <div class="val" id="val-players">6</div>
        <button onclick="App.stepPlayers(1)">&plus;</button>
      </div>
    </div>
    <div class="field">
      <label data-i18n="labelNumMafia"></label>
      <div class="stepper">
        <button onclick="App.stepMafia(-1)">&minus;</button>
        <div class="val" id="val-mafia">2</div>
        <button onclick="App.stepMafia(1)">&plus;</button>
      </div>
      <div class="hint" id="mafia-hint"></div>
    </div>
    <div class="field">
      <label data-i18n="labelNumInquiries"></label>
      <div class="stepper">
        <button onclick="App.stepInquiries(-1)">&minus;</button>
        <div class="val" id="val-inquiries">1</div>
        <button onclick="App.stepInquiries(1)">&plus;</button>
      </div>
      <div class="hint" data-i18n="hintInquiries"></div>
    </div>
    <div class="field">
      <label data-i18n="labelOceanSlots"></label>
      <div class="stepper">
        <button onclick="App.stepOceanSlots(-1)">&minus;</button>
        <div class="val" id="val-ocean-slots">2</div>
        <button onclick="App.stepOceanSlots(1)">&plus;</button>
      </div>
      <div class="hint" data-i18n="hintOceanSlots"></div>
    </div>
    <div class="field">
      <label data-i18n="labelRolesInPlay"></label>
      <div class="hint" dir="rtl" style="margin-bottom:10px; text-align:right;" data-i18n="hintRolesInPlay"></div>
      <div id="role-checklist" class="stack"></div>
      <div id="role-summary" class="hint" dir="rtl" style="margin-top:12px; text-align:right;"></div>
      <div id="role-warning" class="banner warning" dir="rtl" style="display:none; margin-top:12px; text-align:right;"></div>
    </div>
    <button class="link-btn" style="align-self:flex-start; padding-left:0;" onclick="App.openManageRoles('host-setup')" data-i18n="linkAdjustShields"></button>
    <div class="grow"></div>
    <div class="stack">
      <button class="btn btn-primary" id="btn-create-lobby" onclick="App.createLobby()" data-i18n="btnCreateLobby"></button>
      <button class="btn btn-ghost" onclick="App.goLanding()" data-i18n="btnBack"></button>
    </div>
  </div>

  <!-- MANAGE ROLES -->
  <div class="screen" id="screen-manage-roles">
    <div class="eyebrow" data-i18n="roleLibraryEyebrow"></div>
    <h2 style="font-size:26px; margin:10px 0 20px;" data-i18n="rolesShieldsTitle"></h2>
    <p class="hint" style="margin-bottom:16px;" data-i18n="rolesShieldsHint"></p>
    <div id="role-list" class="stack" style="margin-bottom:22px;"></div>
    <div class="grow"></div>
    <button class="btn btn-ghost" onclick="App.closeManageRoles()" data-i18n="btnDone"></button>
  </div>

  <!-- HOST LOBBY -->
  <div class="screen" id="screen-host-lobby">
    <div class="eyebrow" id="lobby-eyebrow" data-i18n="lobbyEyebrow"></div>
    <h2 style="font-size:24px; margin:10px 0 16px;" data-i18n="lobbyTitle"></h2>
    <div class="card" style="margin-bottom:20px;">
      <div class="hint" style="text-align:center;" data-i18n="labelRoomCode"></div>
      <div class="room-code-display" id="room-code-display">&mdash;&mdash;&mdash;&mdash;&mdash;</div>
      <div class="link-box">
        <span id="room-link-text" data-i18n="generatingLink"></span>
        <button onclick="App.copyLink()" data-i18n="btnCopy"></button>
      </div>
      <button class="btn btn-gold" style="margin-top:14px;" onclick="App.shareLink()" data-i18n="btnShareInvite"></button>
    </div>
    <div id="slot-list"></div>
    <div class="grow"></div>
    <button class="btn btn-primary" id="btn-assign" onclick="App.assignRoles()" disabled data-i18n="btnAssignRoles"></button>
  </div>

  <!-- HOST SUMMARY -->
  <div class="screen" id="screen-host-summary">
    <div class="eyebrow" data-i18n="rolesAssignedEyebrow"></div>
    <h2 style="font-size:26px; margin:10px 0 20px;" data-i18n="rolesDealtTitle"></h2>
    <div class="card"><table class="dossier" id="dossier-table"></table></div>
    <p class="hint" style="margin-top:16px;" data-i18n="rolesDealtHint"></p>
    <div class="grow"></div>
    <div class="stack">
      <button class="btn btn-primary" onclick="App.beginGame()" data-i18n="btnBeginGame"></button>
      <button class="btn btn-ghost" onclick="App.newGame()" data-i18n="btnStartOverInstead"></button>
    </div>
  </div>

  <!-- HOST: DAY -->
  <div class="screen" id="screen-host-day">
    <div class="eyebrow" id="day-eyebrow"></div>
    <h2 style="font-size:26px; margin:10px 0 16px;" data-i18n="dayTitle"></h2>
    <p class="hint" style="margin-bottom:18px;" data-i18n="dayHint"></p>
    <div class="card">
      <div class="eyebrow" style="margin-bottom:12px;" data-i18n="stillInGame"></div>
      <div id="alive-list" class="stack"></div>
    </div>
    <div class="card" id="eliminated-card" style="margin-top:16px; display:none;">
      <div class="eyebrow" style="margin-bottom:12px;" data-i18n="eliminatedLabel"></div>
      <div id="eliminated-list" class="stack"></div>
    </div>
    <div class="grow"></div>
    <button class="btn btn-primary" onclick="App.startVoting()" data-i18n="btnStartVoting"></button>
  </div>

  <!-- HOST: INQUIRY VOTE -->
  <div class="screen" id="screen-host-inquiry-vote">
    <div class="eyebrow" id="inquiry-vote-day"></div>
    <h2 style="font-size:26px; margin:10px 0 16px;" data-i18n="inquiryVoteTitle"></h2>
    <div class="card">
      <div class="stack">
        <div class="slot"><div class="name" data-i18n="yes"></div><div class="status" id="inquiry-yes-count" style="flex:0;">0</div></div>
        <div class="slot"><div class="name" data-i18n="no"></div><div class="status" id="inquiry-no-count" style="flex:0;">0</div></div>
      </div>
    </div>
    <p class="hint" id="inquiry-vote-progress" style="margin-top:12px;"></p>
    <div class="grow"></div>
    <button class="btn btn-primary" onclick="App.closeInquiryVote()" data-i18n="btnCloseInquiryVote"></button>
  </div>

  <!-- HOST: INQUIRY RESULT -->
  <div class="screen" id="screen-host-inquiry-result">
    <div class="eyebrow" id="inquiry-result-day"></div>
    <h2 style="font-size:26px; margin:10px 0 16px;" id="inquiry-result-title">&mdash;</h2>
    <div class="card"><p class="hint" id="inquiry-result-detail" style="margin:0;"></p></div>
    <div class="grow"></div>
    <button class="btn btn-primary" onclick="App.continueAfterInquiry()" data-i18n="btnContinue"></button>
  </div>

  <!-- HOST: VOTING (round 1 or 2) -->
  <div class="screen" id="screen-host-voting">
    <div class="eyebrow" id="voting-eyebrow"></div>
    <h2 style="font-size:26px; margin:10px 0 16px;" data-i18n="votingInProgress"></h2>
    <div class="card"><div id="voting-tally" class="stack"></div></div>
    <p class="hint" id="voting-progress" style="margin-top:12px;"></p>
    <div class="grow"></div>
    <button class="btn btn-primary" onclick="App.closeVoting()" data-i18n="btnCloseVoting"></button>
  </div>

  <!-- HOST: DEFENSE -->
  <div class="screen" id="screen-host-defense">
    <div class="eyebrow" id="defense-day"></div>
    <h2 style="font-size:26px; margin:10px 0 16px;" data-i18n="timeToDefend"></h2>
    <div class="card"><div id="defense-list" class="stack"></div></div>
    <p class="hint" style="margin-top:14px;" data-i18n="defenseHint"></p>
    <div class="grow"></div>
    <button class="btn btn-primary" onclick="App.startFinalVote()" data-i18n="btnStartFinalVote"></button>
  </div>

  <!-- HOST: RESULT -->
  <div class="screen" id="screen-host-result">
    <div class="eyebrow" id="result-day"></div>
    <h2 style="font-size:26px; margin:10px 0 16px;" id="result-title">&mdash;</h2>
    <div class="card"><p class="hint" id="result-detail" style="margin:0;"></p></div>
    <div class="grow"></div>
    <button class="btn btn-primary" id="result-continue-btn" onclick="App.proceedAfterResult()"></button>
  </div>

  <!-- HOST: NIGHT -->
  <div class="screen" id="screen-host-night">
    <div class="eyebrow" id="night-day"></div>
    <h2 style="font-size:26px; margin:10px 0 16px;" data-i18n="nightInProgress"></h2>
    <p class="hint" data-i18n="nightHint"></p>
    <div class="grow"></div>
    <button class="btn btn-primary" onclick="App.forceContinueNight()" data-i18n="btnForceContinue"></button>
  </div>

  <!-- HOST: NIGHT EYES CLOSED -->
  <div class="screen" id="screen-host-night-eyes-closed">
    <div class="eyebrow" id="night-eyes-closed-day"></div>
    <h2 style="font-size:26px; margin:10px 0 16px;" data-i18n="eyesClosedTitle"></h2>
    <p class="hint" data-i18n="eyesClosedHint"></p>
    <div class="grow"></div>
    <button class="btn btn-primary" onclick="App.continueAfterEyesClosed()" data-i18n="btnContinue"></button>
  </div>

  <!-- HOST: OCEAN TALK -->
  <div class="screen" id="screen-host-ocean-talk">
    <div class="eyebrow" id="ocean-talk-day"></div>
    <h2 style="font-size:26px; margin:10px 0 16px;" data-i18n="oceanTalkTitle"></h2>
    <p class="hint" data-i18n="oceanTalkHint"></p>
    <div class="grow"></div>
    <button class="btn btn-primary" id="ocean-talk-continue-btn" onclick="App.continueAfterOceanTalk()" data-i18n="btnContinue"></button>
  </div>

    room: null,
    players: new Map(),   // playerId -> {name, connected, pc, dc, role}
    ws: null,
    playerPC: null,
    playerDC: null,
    playerId: null,
    pendingJoinCode: null,
    roles: HARDCODED_ROLES.map(r => Object.assign({}, r)), // per-session copy; only .shield is ever mutated
    selectedRoleIds: new Set(['builtin-mafia', 'builtin-villager']), // roles in play this game
    manageRolesReturnTo: 'landing',

    // Phase 2: running the game after roles are assigned
    day: 1,
    gamePhase: null,        // 'day' | 'inquiry-vote' | 'voting1' | 'defense' | 'voting2' | 'result' | 'game-over'
    votesRound1: new Map(), // (host) voterId -> candidateId[] (empty array = abstained)
    votesRound2: new Map(), // (host) voterId -> candidateId[] (empty array = abstained)
    defendingIds: [],       // (host) player ids on trial this round
    inquiriesRemaining: 0,  // (host) inquiries left to spend this game
    votesInquiry: new Map(),// (host) voterId -> 'yes' | 'no'
    winner: null,           // (host) 'village' | 'mafia' | null once the game has ended
    night: { blockedId: null, savedId: null, professionalTargetId: null, mafiaTargetId: null, mafiaRecruitId: null, revivedId: null, extraDeathIds: [] }, // (host) this night's decisions
    nightStepIndex: 0,      // (host) index into NIGHT_STEP_ORDER for the current night
    doctorSelfSaveUsed: false, // (host) whole-game limit on the Doctor saving themselves
    mafiaActivityLog: [],   // (host) shared night-by-night log of mafia shots + blocks, sent to every mafia member
    oceanTeam: new Set(),   // (host) player ids اوشن has recruited so far (not including اوشن themselves)
    myRole: null,           // (player) last role payload received, for the "View My Role" peek
    roleReturnScreen: null, // (player) screen to return to after peeking at role
    voteRound: null,        // (player) 1 or 2, which round the current vote screen is for
    voteCandidates: [],     // (player) candidates offered for the current vote
    selectedCandidateIds: new Set(), // (player) chosen candidates before submit; may be empty
    nightActionRole: null,       // (player) which role this night-action prompt is for
    selectedNightTargetId: null, // (player) chosen target before submit
    myActivityLog: [],           // (player) night-by-night history of this player's (or their mafia team's) actions
    hasActivityLog: false,       // (player) whether to show the "My Activity" link at all
    activityReturnScreen: null,  // (player) screen to return to after viewing activity log
    lastPhaseMsg: null           // (player) most recent 'phase' message, for re-rendering on language switch
  };

  function $(id){ return document.getElementById(id); }
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  }
  function toast(msg, ms){
    ms = ms || 2800;
    const host = $('toast-host');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    host.innerHTML = '';
    host.appendChild(el);
    setTimeout(()=>{ if(el.parentNode) el.remove(); }, ms);
  }
  // Testing/troubleshooting aid: a persistent corner badge showing who this
  // browser tab is, so multiple tabs open at once (host + several players)
  // are easy to tell apart. Never shows role, only host/player + name.
  function setDebugBadge(text){
    const el = $('debug-badge');
    if(!el) return;
    el.textContent = text || '';
    el.style.display = text ? 'block' : 'none';
  }
  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------------- WebSocket signaling ---------------- */
  function connectWS(onOpen){
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/ws');
    state.ws = ws;
    ws.onopen = () => { $('conn-indicator').textContent = t('connConnected'); if(onOpen) onOpen(); };
    ws.onclose = () => { $('conn-indicator').textContent = t('connDisconnected'); toast(t('lostServerConnection')); };
    ws.onerror = () => { $('conn-indicator').textContent = t('connError'); };
    ws.onmessage = (evt) => {
      let msg;
      try{ msg = JSON.parse(evt.data); }catch(e){ return; }
      handleWSMessage(msg);
    };
  }
  function wsSend(obj){
    if(state.ws && state.ws.readyState === 1) state.ws.send(JSON.stringify(obj));
  }

  function handleWSMessage(msg){
    if(msg.type === 'room-created'){
      state.room = msg.room;
      renderLobbyHeader();
      return;
    }
    if(msg.type === 'player-hello'){
      hostBeginConnectionTo(msg.playerId);
      return;
    }
    if(msg.type === 'player-left'){
      const p = state.players.get(msg.playerId);
      if(p){ p.connected = false; renderLobby(); }
      return;
    }
    if(msg.type === 'signal'){
      if(state.role === 'host') hostHandleSignal(msg.from, msg.payload);
      else playerHandleSignal(msg.payload);
      return;
    }
    if(msg.type === 'joined'){
      state.playerId = msg.playerId;
      state.room = msg.room;
      $('connecting-title').textContent = t('waitingForHost');
      $('connecting-hint').textContent = t('hostWillConnect');
      return;
    }
    if(msg.type === 'room-not-found'){
      toast(t('roomNotFound'));
      showScreen('screen-player-join');
      return;
    }
    if(msg.type === 'host-left'){
      toast(t('hostEndedSession'));
      showScreen('screen-player-join');
      return;
    }
  }

  /* ---------------- Role library ---------------- */
  function roleTeamTagHtml(r){
    if(r.independent) return '<span class="tag independent role-team-tag">' + escapeHtml(t('tagIndependent')) + '</span>';
    return '<span class="tag ' + (r.team === 'mafia' ? 'mafia' : 'villager') + ' role-team-tag">' + escapeHtml(r.team === 'mafia' ? t('tagMafia') : t('tagVillage')) + '</span>';
  }

  // Mafia first, then Independent, then regular civilians — for the God's role checklist.
  function roleGroupRank(r){
    if(r.team === 'mafia') return 0;
    if(r.independent) return 1;
    return 2;
  }

  function renderRoleChecklist(){
    const box = $('role-checklist');
    if(!box) return;
    box.innerHTML = '';
    const sortedRoles = state.roles.slice().sort((a, b) => roleGroupRank(a) - roleGroupRank(b));
    sortedRoles.forEach(r => {
      const row = document.createElement('label');
      row.className = 'role-row role-check-row';
      row.innerHTML =
        '<input type="checkbox" ' + (state.selectedRoleIds.has(r.id) ? 'checked' : '') + '>' +
        '<div class="role-info">' +
          '<span class="role-name">' + escapeHtml(r.name) + '</span>' +
          roleTeamTagHtml(r) +
          (r.shield ? '<span class="tag shield role-team-tag">' + escapeHtml(t('labelShield')) + '</span>' : '') +
          (r.description ? '<div class="role-desc-small">' + escapeHtml(roleDescription(r)) + '</div>' : '') +
        '</div>';
      row.querySelector('input').onchange = (e) => {
        if(e.target.checked) state.selectedRoleIds.add(r.id);
        else state.selectedRoleIds.delete(r.id);
        renderRoleSummary();
      };
      box.appendChild(row);
    });
    renderRoleSummary();
  }

  function roleSummaryForTeam(team){
    const slotCount = team === 'mafia' ? state.numMafia : (state.numPlayers - state.numMafia);
    const customCount = state.roles.filter(r => r.team === team && !r.builtin && state.selectedRoleIds.has(r.id)).length;
    const defaultRole = state.roles.find(r => r.team === team && r.builtin);
    return {
      slotCount,
      customCount,
      defaultCount: Math.max(0, slotCount - customCount),
      overflow: Math.max(0, customCount - slotCount),
      defaultName: defaultRole ? defaultRole.name : (team === 'mafia' ? t('tagMafia') : t('tagVillage'))
    };
  }

  function renderRoleSummary(){
    const summaryBox = $('role-summary');
    const warnBox = $('role-warning');
    if(!summaryBox || !warnBox) return;

    const mafia = roleSummaryForTeam('mafia');
    const village = roleSummaryForTeam('villager');

    const lines = [];
    [[t('tagMafia'), mafia], [t('tagVillage'), village]].forEach(([label, s]) => {
      if(s.customCount === 0) return;
      lines.push(s.defaultCount > 0
        ? t('roleSummaryDefault', { count: s.defaultCount, slotCount: s.slotCount, label: label, defaultName: s.defaultName })
        : t('roleSummaryAllCustom', { slotCount: s.slotCount, label: label }));
    });
    summaryBox.textContent = lines.join(' ');

    const warnings = [];
    if(mafia.overflow > 0) warnings.push(t('roleOverflowWarning', { customCount: mafia.customCount, slotCount: mafia.slotCount, label: t('tagMafia'), overflow: mafia.overflow }));
    if(village.overflow > 0) warnings.push(t('roleOverflowWarning', { customCount: village.customCount, slotCount: village.slotCount, label: t('tagVillage'), overflow: village.overflow }));
    warnBox.style.display = warnings.length ? 'block' : 'none';
    warnBox.textContent = warnings.join(' ');

    const btn = $('btn-create-lobby');
    if(btn) btn.disabled = warnings.length > 0;
  }

  function renderRoleList(){
    const list = $('role-list');
    if(!list) return;
    list.innerHTML = '';
    state.roles.forEach(r => {
      const row = document.createElement('div');
      row.className = 'role-row';
      row.innerHTML =
        '<div class="role-info">' +
          '<span class="role-name">' + escapeHtml(r.name) + '</span>' +
          roleTeamTagHtml(r) +
          (r.description ? '<div class="role-desc-small">' + escapeHtml(roleDescription(r)) + '</div>' : '') +
        '</div>' +
        '<label class="shield-toggle" style="flex-shrink:0;"><input type="checkbox" id="shield-' + r.id + '"' + (r.shield ? ' checked' : '') + '> ' + escapeHtml(t('labelShield')) + '</label>';
      row.querySelector('#shield-' + r.id).onchange = (e) => { App.toggleShield(r.id, e.target.checked); };
      list.appendChild(row);
    });
  }

  /* ---------------- App / Landing ---------------- */
  const App = {};

  App.setLanguage = function(lang){
    if(lang !== 'fa' && lang !== 'en') return;
    state.lang = lang;
    try{ localStorage.setItem('mafia-lang', lang); }catch(e){}
    applyTranslations();
  };

  function applyTranslations(){
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === 'fa' ? 'rtl' : 'ltr';
    const btnFa = $('lang-btn-fa'), btnEn = $('lang-btn-en');
    if(btnFa) btnFa.classList.toggle('active', state.lang === 'fa');
    if(btnEn) btnEn.classList.toggle('active', state.lang === 'en');

    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });

    refreshDynamicScreenText();
  }

  // Re-render whatever dynamic content the currently visible screen holds, so
  // switching languages mid-session updates more than just static labels.
  function refreshDynamicScreenText(){
    const active = document.querySelector('.screen.active');
    if(!active) return;
    const id = active.id;
    if(id === 'screen-host-setup'){ renderSetupValues(); renderRoleChecklist(); }
    else if(id === 'screen-manage-roles') renderRoleList();
    else if(id === 'screen-host-lobby'){ renderLobbyHeader(); renderLobby(); }
    else if(id === 'screen-host-day') renderDayScreen();
    else if(id === 'screen-host-inquiry-vote') renderInquiryTally();
    else if(id === 'screen-host-voting') renderVotingTally(state.gamePhase === 'voting1' ? 1 : 2);
    else if(id === 'screen-host-defense') renderDefenseList();
    else if(id === 'screen-player-role' && state.myRole) renderRole(state.myRole);
    else if(id === 'screen-player-day' && state.lastPhaseMsg) $('day-title-player').textContent = t('dayLabel', { n: state.lastPhaseMsg.day });
    else if(id === 'screen-player-inquiry-vote' && state.lastPhaseMsg) $('inquiry-vote-day-player').textContent = t('dayLabel', { n: state.lastPhaseMsg.day }) + ' · ' + t('morningInquiry');
    else if(id === 'screen-player-vote') renderVoteScreen();
    else if(id === 'screen-player-defense' && state.lastPhaseMsg) renderDefenseScreen(state.lastPhaseMsg);
    else if(id === 'screen-player-activity-log') renderActivityLog();
  }

  App.goLanding = function(role){
    if(role === 'host'){ state.role = 'host'; showScreen('screen-host-setup'); renderRoleChecklist(); setDebugBadge('HOST'); }
    else if(role === 'player'){ state.role = 'player'; showScreen('screen-player-join'); setDebugBadge('PLAYER'); }
    else { state.role = null; showScreen('screen-landing'); setDebugBadge(''); }
  };

  App.openManageRoles = function(returnTo){
    state.manageRolesReturnTo = returnTo || 'landing';
    showScreen('screen-manage-roles');
    renderRoleList();
  };
  App.closeManageRoles = function(){
    renderRoleChecklist();
    if(state.manageRolesReturnTo === 'host-setup') showScreen('screen-host-setup');
    else showScreen('screen-landing');
  };
  App.toggleShield = function(id, checked){
    const role = state.roles.find(r => r.id === id);
    if(!role) return;
    role.shield = checked;
    renderRoleChecklist();
  };

  App.stepPlayers = function(delta){
    state.numPlayers = Math.max(3, Math.min(20, state.numPlayers + delta));
    if(state.numMafia >= state.numPlayers) state.numMafia = Math.max(1, state.numPlayers - 2);
    renderSetupValues();
  };
  App.stepMafia = function(delta){
    state.numMafia = Math.max(1, Math.min(state.numPlayers - 1, state.numMafia + delta));
    renderSetupValues();
  };
  App.stepInquiries = function(delta){
    state.numInquiries = Math.max(0, Math.min(10, state.numInquiries + delta));
    renderSetupValues();
  };
  App.stepOceanSlots = function(delta){
    state.numOceanSlots = Math.max(1, Math.min(10, state.numOceanSlots + delta));
    renderSetupValues();
  };
  function renderSetupValues(){
    $('val-players').textContent = state.numPlayers;
    $('val-mafia').textContent = state.numMafia;
    $('mafia-hint').textContent = t('villagersWillBe', { n: state.numPlayers - state.numMafia });
    $('val-inquiries').textContent = state.numInquiries;
    $('val-ocean-slots').textContent = state.numOceanSlots;
    renderRoleSummary();
  }

  App.createLobby = function(){
    state.players = new Map();
    wsSend({ type: 'create-room' });
    showScreen('screen-host-lobby');
    renderLobby();
  };

  function inviteURL(){
    return location.origin + '/?join=' + state.room;
  }
  function renderLobbyHeader(){
    $('room-code-display').textContent = state.room ? state.room.split('').join(' ') : '\u2014\u2014\u2014\u2014\u2014';
    $('room-link-text').textContent = state.room ? inviteURL() : t('generatingLink');
  }
  App.copyLink = function(){
    if(!state.room) return;
    navigator.clipboard.writeText(inviteURL()).then(()=> toast(t('linkCopied')));
  };
  App.shareLink = function(){
    if(!state.room) return;
    const url = inviteURL();
    if(navigator.share){
      navigator.share({ title: t('shareTitle'), text: t('joinInviteText', { room: state.room }), url: url }).catch(()=>{});
    } else {
      navigator.clipboard.writeText(url).then(()=> toast(t('linkCopiedPaste')));
    }
  };

  function renderLobby(){
    const connectedCount = Array.from(state.players.values()).filter(p => p.connected && p.name).length;
    $('lobby-eyebrow').textContent = t('lobbyJoinedCount', { n: connectedCount, total: state.numPlayers });
    const list = $('slot-list');
    list.innerHTML = '';
    let i = 0;
    for(const [id, p] of state.players.entries()){
      i++;
      const ready = p.connected && p.name;
      const row = document.createElement('div');
      row.className = 'slot' + (ready ? ' connected' : '');
      row.innerHTML =
        '<div class="num">' + i + '</div>' +
        (ready
          ? '<div class="name">' + escapeHtml(p.name) + '</div><div class="check">&#10003;</div>'
          : '<div class="status">' + escapeHtml(t('statusConnecting')) + '</div>');
      list.appendChild(row);
    }
    const remaining = state.numPlayers - state.players.size;
    for(let r = 0; r < remaining; r++){
      i++;
      const row = document.createElement('div');
      row.className = 'slot';
      row.innerHTML = '<div class="num">' + i + '</div><div class="status">' + escapeHtml(t('statusWaitingForPlayer')) + '</div>';
      list.appendChild(row);
    }
    $('btn-assign').disabled = connectedCount < state.numPlayers;
  }

  /* ---------------- Host: WebRTC per player ---------------- */
  function hostBeginConnectionTo(playerId){
    if(state.players.size >= state.numPlayers && !state.players.has(playerId)){
      // Room already full; ignore additional joiners.
      return;
    }
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    const dc = pc.createDataChannel('mafia');
    const entry = { name: null, connected: false, pc, dc, role: null, alive: true };
    state.players.set(playerId, entry);
    renderLobby();

    setupHostDataChannel(dc, playerId);

    pc.onicecandidate = (e) => {
      if(e.candidate){
        wsSend({ type: 'signal', to: playerId, payload: { kind: 'candidate', candidate: e.candidate } });
      }
    };

    pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
      wsSend({ type: 'signal', to: playerId, payload: { kind: 'offer', sdp: pc.localDescription } });
    });
  }

  function hostHandleSignal(playerId, payload){
    const entry = state.players.get(playerId);
    if(!entry) return;
    if(payload.kind === 'answer'){
      entry.pc.setRemoteDescription(payload.sdp).catch(()=>{});
    } else if(payload.kind === 'candidate'){
      entry.pc.addIceCandidate(payload.candidate).catch(()=>{});
    }
  }

  function setupHostDataChannel(dc, playerId){
    dc.onopen = () => {
      const entry = state.players.get(playerId);
      if(entry){ entry.connected = true; renderLobby(); }
    };
    dc.onmessage = (e) => {
      try{
        const msg = JSON.parse(e.data);
        if(msg.type === 'name'){
          const entry = state.players.get(playerId);
          if(entry){ entry.name = msg.name; renderLobby(); toast(t('toastPlayerJoined', {name: msg.name})); }
        } else if(msg.type === 'vote'){
          handlePlayerVote(playerId, msg.round, msg.candidateIds);
        } else if(msg.type === 'inquiry-vote'){
          handlePlayerInquiryVote(playerId, msg.choice);
        } else if(msg.type === 'night-action'){
          handleNightAction(playerId, msg.role, msg.targetId, msg.recruit);
        }
      }catch(err){}
    };
    dc.onclose = () => {
      const entry = state.players.get(playerId);
      if(entry){ entry.connected = false; renderLobby(); }
    };
  }

  /* ---------------- Role assignment ---------------- */
  App.assignRoles = function(){
    const ids = Array.from(state.players.keys());
    shuffle(ids);
    const idsByTeam = { mafia: ids.slice(0, state.numMafia), villager: ids.slice(state.numMafia) };

    ['mafia', 'villager'].forEach(team => {
      const customRoles = state.roles.filter(r => r.team === team && !r.builtin && state.selectedRoleIds.has(r.id));
      const defaultRole = state.roles.find(r => r.team === team && r.builtin) ||
        { team, name: team === 'mafia' ? t('tagMafia') : t('tagVillage'), description: '', shield: false };

      idsByTeam[team].forEach((id, idx) => {
        const roleDef = idx < customRoles.length ? customRoles[idx] : defaultRole;
        const entry = state.players.get(id);
        entry.role = roleDef.team;
        entry.roleName = roleDef.name;
        entry.roleDesc = roleDef.description;
        entry.roleShield = !!roleDef.shield;
        try{
          entry.dc.send(JSON.stringify({ type: 'role', role: roleDef.team, roleId: roleDef.id, name: roleDef.name, description: roleDef.description, shield: !!roleDef.shield }));
        }catch(e){}
      });
    });

    renderDossier();
    showScreen('screen-host-summary');
  };

  function renderDossier(){
    const table = $('dossier-table');
    table.innerHTML = '';
    for(const entry of state.players.values()){
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + escapeHtml(entry.name) + '</td>' +
        '<td style="text-align:right;" class="hint">' + escapeHtml(t('roleSentPrivately')) + '</td>';
      table.appendChild(tr);
    }
  }

  /* ---------------- Phase 2: running the game ---------------- */
  function aliveEntries(){
    return Array.from(state.players.entries()).filter(([id, e]) => e.alive);
  }
  function sendToPlayer(entry, obj){
    try{ entry.dc.send(JSON.stringify(obj)); }catch(e){}
  }

  App.beginGame = function(){
    state.day = 1;
    state.inquiriesRemaining = state.numInquiries;
    for(const entry of state.players.values()){ entry.alive = true; }
    state.winner = checkWinner();
    if(state.winner){ App.showGameOver(); return; }
    startDayOrInquiry();
  };

  function startDayOrInquiry(){
    const anyoneEliminatedYet = Array.from(state.players.values()).some(e => !e.alive);
    if(state.inquiriesRemaining > 0 && anyoneEliminatedYet) startInquiryVote();
    else goToDayScreen();
  }

  function goToDayScreen(){
    state.gamePhase = 'day';
    broadcastDayPhase();
    renderDayScreen();
    showScreen('screen-host-day');
  }

  function broadcastDayPhase(){
    aliveEntries().forEach(([id, entry]) => sendToPlayer(entry, { type: 'phase', phase: 'day', day: state.day }));
  }

  function startInquiryVote(){
    state.gamePhase = 'inquiry-vote';
    state.votesInquiry = new Map();
    aliveEntries().forEach(([id, entry]) => sendToPlayer(entry, { type: 'phase', phase: 'inquiry-vote', day: state.day }));
    renderInquiryTally();
    showScreen('screen-host-inquiry-vote');
  }

  function renderInquiryTally(){
    $('inquiry-vote-day').textContent = t('dayLabel', { n: state.day }) + ' · ' + t('morningInquiry');
    let yes = 0, no = 0;
    state.votesInquiry.forEach(choice => { if(choice === 'yes') yes++; else no++; });
    $('inquiry-yes-count').textContent = yes;
    $('inquiry-no-count').textContent = no;
    $('inquiry-vote-progress').textContent = t('votedProgress', { n: state.votesInquiry.size, total: aliveEntries().length });
  }

  function handlePlayerInquiryVote(voterId, choice){
    const voter = state.players.get(voterId);
    if(!voter || !voter.alive || state.gamePhase !== 'inquiry-vote') return;
    state.votesInquiry.set(voterId, choice === 'yes' ? 'yes' : 'no');
    renderInquiryTally();
  }

  App.closeInquiryVote = function(){
    const threshold = Math.floor(aliveEntries().length / 2);
    let yes = 0;
    state.votesInquiry.forEach(choice => { if(choice === 'yes') yes++; });
    const granted = yes > 0 && yes >= threshold;

    $('inquiry-result-day').textContent = t('dayLabel', { n: state.day }) + ' · ' + t('inquiryResultLabel');
    if(granted){
      state.inquiriesRemaining -= 1;
      const eliminated = Array.from(state.players.values()).filter(e => !e.alive);
      const mafiaOut = eliminated.filter(e => e.role === 'mafia').length;
      const villagerOut = eliminated.filter(e => e.role === 'villager').length;
      aliveEntries().forEach(([id, entry]) => sendToPlayer(entry, { type: 'inquiry-result', granted: true, mafiaOut, villagerOut }));
      $('inquiry-result-title').textContent = t('inquiryGranted');
      $('inquiry-result-detail').textContent = t('inquiryDetail', { mafiaOut, villagerOut, remaining: state.inquiriesRemaining });
    } else {
      aliveEntries().forEach(([id, entry]) => sendToPlayer(entry, { type: 'inquiry-result', granted: false }));
      $('inquiry-result-title').textContent = t('noInquiryToday');
      $('inquiry-result-detail').textContent = t('notEnoughVotes');
    }
    showScreen('screen-host-inquiry-result');
  };

  App.continueAfterInquiry = function(){
    goToDayScreen();
  };

  function renderDayScreen(){
    $('day-eyebrow').textContent = t('dayLabel', { n: state.day });

    const aliveBox = $('alive-list');
    aliveBox.innerHTML = '';
    aliveEntries().forEach(([id, entry]) => {
      const row = document.createElement('div');
      row.className = 'slot connected';
      row.innerHTML = '<div class="name">' + escapeHtml(entry.name) + '</div>';
      aliveBox.appendChild(row);
    });

    const eliminated = Array.from(state.players.entries()).filter(([id, e]) => !e.alive);
    const elimCard = $('eliminated-card');
    if(eliminated.length){
      elimCard.style.display = 'block';
      const box = $('eliminated-list');
      box.innerHTML = '';
      eliminated.forEach(([id, entry]) => {
        const row = document.createElement('div');

        box.appendChild(row);

      elimCard.style.display = 'none';
