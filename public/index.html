<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MAFIA — Night Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D13;
    --surface:#151A24;
    --surface-2:#1C2330;
    --line: rgba(237,239,244,0.09);
    --line-strong: rgba(237,239,244,0.16);
    --text:#EDEFF4;
    --text-muted:#8A93A6;
    --text-faint:#5B6478;
    --red:#C4364B;
    --red-bright:#E14C63;
    --red-dim:#3A1620;
    --gold:#D4A857;
    --gold-dim:#3A311D;
    --slate:#6E7A94;
    --slate-dim:#1E2634;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(196,54,75,0.08), transparent 60%),
      radial-gradient(80% 60% at 80% 100%, rgba(212,168,87,0.05), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  .eyebrow{font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-faint); font-weight:600;}
  h1,h2,h3{font-family:'Playfair Display', serif; margin:0; letter-spacing:-0.01em;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; position:relative;}
  .screen{display:none; flex-direction:column; flex:1; animation: rise .38s ease both;}
  .screen.active{display:flex;}
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .brandmark{display:flex; align-items:center; gap:10px; margin-bottom:auto;}
  .brandmark .dot{width:8px; height:8px; border-radius:50%; background:var(--red-bright); box-shadow:0 0 12px var(--red-bright);}
  .brandmark span{font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.2em; color:var(--text-faint); text-transform:uppercase;}
  .btn{appearance:none; border:none; cursor:pointer; font-family:'Inter', sans-serif; font-weight:700; font-size:16px; padding:17px 22px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:10px; transition: transform .15s ease, opacity .15s ease; width:100%;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--red-bright); color:#fff; box-shadow:0 8px 24px -8px rgba(225,76,99,0.55);}
  .btn-primary:disabled{background:var(--surface-2); color:var(--text-faint); box-shadow:none; cursor:not-allowed;}
  .btn-outline{background:transparent; color:var(--text); border:1.5px solid var(--line-strong);}
  .btn-ghost{background:var(--surface); color:var(--text-muted); font-weight:600; font-size:14px; padding:13px 18px;}
  .btn-gold{background:var(--gold); color:#20180A;}
  .stack{display:flex; flex-direction:column; gap:12px;}
  .grow{flex:1;}
  .center{display:flex; flex-direction:column; align-items:center; text-align:center; justify-content:center;}
  .field{display:flex; flex-direction:column; gap:8px; margin-bottom:18px;}
  .field label{font-size:13px; font-weight:600; color:var(--text-muted);}
  .field input{background:var(--surface); border:1.5px solid var(--line); color:var(--text); font-family:'Inter', sans-serif; font-size:17px; font-weight:600; padding:15px 16px; border-radius:12px; outline:none; width:100%;}
  .field input:focus{border-color:var(--red-bright);}
  .field input.code-input{text-align:center; letter-spacing:0.3em; text-transform:uppercase; font-family:'JetBrains Mono', monospace;}
  select.role-select{background:var(--surface); border:1.5px solid var(--line); color:var(--text); font-family:'Inter', sans-serif; font-size:16px; font-weight:600; padding:14px 16px; border-radius:12px; outline:none; width:100%; appearance:none;}
  select.role-select:focus{border-color:var(--red-bright);}
  .role-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px;}
  .role-row .role-info{flex:1; min-width:0;}
  .role-row .role-name{font-weight:700; font-size:15px;}
  .role-row .role-team-tag{margin-left:8px;}
  .role-row .role-desc-small{font-size:12px; color:var(--text-faint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .role-check-row{cursor:pointer;}
  .role-check-row input[type="checkbox"], .role-check-row input[type="radio"]{width:20px; height:20px; flex-shrink:0; accent-color:var(--gold);}
  label.shield-toggle{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-muted); font-weight:600; cursor:pointer;}
  label.shield-toggle input{width:18px; height:18px; accent-color:var(--gold);}
  .stepper{display:flex; align-items:center; gap:14px;}
  .stepper button{width:46px; height:46px; border-radius:12px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--text); font-size:20px; font-weight:700; cursor:pointer;}
  .stepper .val{flex:1; text-align:center; font-family:'Playfair Display', serif; font-size:28px; font-weight:800;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px;}
  .hint{font-size:13px; color:var(--text-muted); line-height:1.5;}
  .slot{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;}
  .slot.connected{border-color: rgba(212,168,87,0.35); background:linear-gradient(180deg, rgba(212,168,87,0.06), transparent);}
  .slot .num{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-faint); width:26px; height:26px; border-radius:50%; border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .slot.connected .num{color:var(--gold); border-color:var(--gold);}
  .slot .name{font-weight:700; font-size:15px; flex:1;}
  .slot .status{font-size:13px; color:var(--text-faint); flex:1;}
  .slot .check{color:var(--gold); font-size:18px;}
  .room-code-display{font-family:'JetBrains Mono',monospace; font-size:38px; font-weight:700; letter-spacing:0.15em; text-align:center; color:var(--gold); margin:6px 0;}
  .link-box{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:6px;}
  .link-box span{flex:1; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .link-box button{flex-shrink:0; background:var(--surface); border:1px solid var(--line-strong); color:var(--text); border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer;}
  .step-pill{display:inline-flex; align-items:center; gap:8px; background:var(--surface-2); padding:8px 14px; border-radius:999px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; color:var(--gold); text-transform:uppercase; margin:0 auto 18px;}
  .role-card{width:100%; max-width:300px; aspect-ratio:3/4.4; margin:0 auto; perspective:1400px; cursor:pointer;}
  .role-card-inner{position:relative; width:100%; height:100%; transition:transform .7s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d;}
  .role-card.flipped .role-card-inner{transform:rotateY(180deg);}
  .role-face{position:absolute; inset:0; border-radius:22px; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; border:1px solid var(--line-strong);}
  .role-back{background: repeating-linear-gradient(135deg, rgba(196,54,75,0.10) 0 2px, transparent 2px 22px), var(--surface);}
  .role-back .moon{width:54px; height:54px; border-radius:50%; background:var(--gold); box-shadow: -14px 0 0 -6px var(--bg) inset, 0 0 30px rgba(212,168,87,0.35); margin-bottom:18px;}
  .role-front{transform:rotateY(180deg); text-align:center;}
  .role-front.is-mafia{background:linear-gradient(180deg, var(--red-dim), var(--surface));}
  .role-front.is-villager{background:linear-gradient(180deg, var(--slate-dim), var(--surface));}
  .role-title{font-size:34px; font-weight:900; margin:14px 0 10px; letter-spacing:0.01em;}
  .is-mafia .role-title{color:var(--red-bright);}
  .is-villager .role-title{color:#C9D2E3;}
  .role-desc{font-size:14px; color:var(--text-muted); line-height:1.55;}
  table.dossier{width:100%; border-collapse:collapse;}
  table.dossier td{padding:13px 6px; border-bottom:1px solid var(--line); font-size:15px;}
  table.dossier tr:last-child td{border-bottom:none;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:0.08em; padding:5px 10px; border-radius:6px; text-transform:uppercase;}
  .tag.mafia{background:var(--red-dim); color:var(--red-bright);}
  .tag.villager{background:var(--slate-dim); color:var(--slate);}
  .tag.shield{background:var(--gold-dim); color:var(--gold);}
  .tag.independent{background:rgba(237,239,244,0.08); color:var(--text-muted); border:1px solid var(--line-strong);}
  .spinner{width:20px; height:20px; border-radius:50%; border:2.5px solid rgba(255,255,255,0.25); border-top-color:#fff; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .pulse-dot{width:8px; height:8px; border-radius:50%; background:var(--gold); animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:0.3;} 50%{opacity:1;}}
  .toast{position:fixed; left:50%; bottom:32px; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--line-strong); color:var(--text); padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600; z-index:100; max-width:85%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.4);}
  .banner{background:var(--gold-dim); border:1px solid rgba(212,168,87,0.3); color:var(--gold); font-size:13px; padding:12px 14px; border-radius:12px; margin-bottom:16px; line-height:1.5;}
  .banner.warning{background:var(--red-dim); border-color:rgba(196,54,75,0.35); color:var(--red-bright); margin-bottom:0;}
  .link-btn{appearance:none; background:none; border:none; color:var(--gold); font-family:'Inter', sans-serif; font-weight:700; font-size:13px; cursor:pointer; padding:8px 0;}
  .lang-switch{position:fixed; top:6px; right:8px; z-index:1000; display:flex; gap:2px; background:rgba(0,0,0,0.55); border-radius:8px; padding:3px;}
  .lang-switch button{appearance:none; background:none; border:none; color:var(--text-faint); font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; padding:4px 8px; border-radius:6px; cursor:pointer;}
  .lang-switch button.active{background:var(--gold-dim); color:var(--gold);}

  /* Dev/troubleshooting only — lets the God see every role and the full
     activity log at a glance. Never shown to players. */
  .debug-toggle-btn{display:none; position:fixed; top:34px; left:8px; z-index:1000; appearance:none; border:none; background:rgba(0,0,0,0.55); color:#EDEFF4; font-size:13px; line-height:1; padding:5px 8px; border-radius:6px; cursor:pointer;}
  .debug-panel{display:none; position:fixed; inset:0; z-index:2000; background:rgba(6,7,10,0.97); overflow-y:auto; padding:18px 18px 40px;}
  .debug-panel.open{display:block;}
  .debug-panel h3{font-size:15px; margin:18px 0 8px; color:var(--gold);}
  .debug-panel .debug-row{padding:8px 10px; border-radius:8px; background:rgba(255,255,255,0.04); margin-bottom:6px; font-size:13px; line-height:1.5;}
  .debug-panel .debug-log-entry{padding:4px 0 4px 10px; border-left:2px solid rgba(255,255,255,0.12); font-size:12px; color:var(--text-faint);}

  /* Mafia-only chat — a fixed bottom drawer, present on every night and
     daytime-conversation screen a living Mafia member sees, so they can
     coordinate without leaving whatever they're doing. */
  .mafia-chat-panel{display:none; position:fixed; left:0; right:0; bottom:0; z-index:1500; flex-direction:column; height:32vh; background:rgba(10,7,8,0.97); border-top:1px solid var(--red-dim); box-shadow:0 -6px 24px rgba(0,0,0,0.45); padding-bottom:env(safe-area-inset-bottom);}
  .mafia-chat-panel.open{display:flex;}
  .mafia-chat-header{padding:8px 14px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--red-bright); border-bottom:1px solid rgba(255,255,255,0.08); flex-shrink:0;}
  .mafia-chat-messages{flex:1; overflow-y:auto; padding:8px 14px; display:flex; flex-direction:column; gap:6px;}
  .mafia-chat-msg{font-size:13px; line-height:1.4; color:var(--text-muted); word-break:break-word;}
  .mafia-chat-sender{color:var(--gold); font-weight:700;}
  .mafia-chat-input-row{display:flex; gap:8px; padding:10px 14px; border-top:1px solid rgba(255,255,255,0.08); flex-shrink:0;}
  .mafia-chat-input-row input{flex:1; min-width:0; background:rgba(255,255,255,0.06); border:1px solid var(--line-strong); border-radius:8px; padding:9px 11px; color:var(--text); font-family:inherit; font-size:13px; outline:none;}
  .mafia-chat-input-row input:focus{border-color:var(--red-bright);}
  .mafia-chat-input-row button{flex-shrink:0; appearance:none; border:none; background:var(--red-dim); color:var(--red-bright); font-weight:700; padding:9px 16px; border-radius:8px; cursor:pointer; font-size:13px;}

  /* اوشن's group chat — same fixed-drawer pattern as Mafia's, but with no
     phase restriction at all: visible any time a living group member (اوشن
     itself, or anyone it's recruited) is on any screen, day or night, until
     they're eliminated or the game ends. Gold-accented instead of red so the
     two are visually distinct in the rare case a player is somehow in both
     (اوشن mistakenly recruiting a Mafia member). */
  .ocean-chat-panel{display:none; position:fixed; left:0; right:0; bottom:0; z-index:1500; flex-direction:column; height:32vh; background:rgba(9,8,4,0.97); border-top:1px solid var(--gold-dim); box-shadow:0 -6px 24px rgba(0,0,0,0.45); padding-bottom:env(safe-area-inset-bottom);}
  .ocean-chat-panel.open{display:flex;}
  .ocean-chat-header{padding:8px 14px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); border-bottom:1px solid rgba(255,255,255,0.08); flex-shrink:0;}
  .ocean-chat-messages{flex:1; overflow-y:auto; padding:8px 14px; display:flex; flex-direction:column; gap:6px;}
  .ocean-chat-msg{font-size:13px; line-height:1.4; color:var(--text-muted); word-break:break-word;}
  .ocean-chat-sender{color:var(--gold); font-weight:700;}
  .ocean-chat-input-row{display:flex; gap:8px; padding:10px 14px; border-top:1px solid rgba(255,255,255,0.08); flex-shrink:0;}
  .ocean-chat-input-row input{flex:1; min-width:0; background:rgba(255,255,255,0.06); border:1px solid var(--line-strong); border-radius:8px; padding:9px 11px; color:var(--text); font-family:inherit; font-size:13px; outline:none;}
  .ocean-chat-input-row input:focus{border-color:var(--gold);}
  .ocean-chat-input-row button{flex-shrink:0; appearance:none; border:none; background:var(--gold-dim); color:var(--gold); font-weight:700; padding:9px 16px; border-radius:8px; cursor:pointer; font-size:13px;}

  /* زودیاک + زودیاک پسر's private chat — same pattern again, no phase
     restriction, slate-accented (villager-tag color) to stay distinct from
     both Mafia (red) and اوشن (gold), since اوشن could in principle recruit
     either of them into ITS group too, stacking all three at once. */
  .zodiac-chat-panel{display:none; position:fixed; left:0; right:0; bottom:0; z-index:1500; flex-direction:column; height:32vh; background:rgba(7,9,10,0.97); border-top:1px solid var(--slate-dim); box-shadow:0 -6px 24px rgba(0,0,0,0.45); padding-bottom:env(safe-area-inset-bottom);}
  .zodiac-chat-panel.open{display:flex;}
  .zodiac-chat-header{padding:8px 14px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--slate); border-bottom:1px solid rgba(255,255,255,0.08); flex-shrink:0;}
  .zodiac-chat-messages{flex:1; overflow-y:auto; padding:8px 14px; display:flex; flex-direction:column; gap:6px;}
  .zodiac-chat-msg{font-size:13px; line-height:1.4; color:var(--text-muted); word-break:break-word;}
  .zodiac-chat-sender{color:var(--slate); font-weight:700;}
  .zodiac-chat-input-row{display:flex; gap:8px; padding:10px 14px; border-top:1px solid rgba(255,255,255,0.08); flex-shrink:0;}
  .zodiac-chat-input-row input{flex:1; min-width:0; background:rgba(255,255,255,0.06); border:1px solid var(--line-strong); border-radius:8px; padding:9px 11px; color:var(--text); font-family:inherit; font-size:13px; outline:none;}
  .zodiac-chat-input-row input:focus{border-color:var(--slate);}
  .zodiac-chat-input-row button{flex-shrink:0; appearance:none; border:none; background:var(--slate-dim); color:var(--slate); font-weight:700; padding:9px 16px; border-radius:8px; cursor:pointer; font-size:13px;}

  /* Stacking for however many of the three drawers are open at once, in a
     fixed priority order — Mafia lowest, then اوشن, then زودیاک — so any
     combination lands cleanly with no overlap. Overlap between all three is
     realistically only Mafia+اوشن or اوشن+زودیاک (a Mafia player can never
     also be زودیاک/زودیاک پسر — they're mutually exclusive role slots — but
     اوشن could recruit either into its own group), yet every combination is
     covered here regardless. */
  body.mafia-chat-open:not(.ocean-chat-open):not(.zodiac-chat-open) #app,
  body.ocean-chat-open:not(.mafia-chat-open):not(.zodiac-chat-open) #app,
  body.zodiac-chat-open:not(.mafia-chat-open):not(.ocean-chat-open) #app
  { padding-bottom: calc(32vh + 12px + max(28px, env(safe-area-inset-bottom))); }

  body.mafia-chat-open.ocean-chat-open:not(.zodiac-chat-open) #app,
  body.mafia-chat-open.zodiac-chat-open:not(.ocean-chat-open) #app,
  body.ocean-chat-open.zodiac-chat-open:not(.mafia-chat-open) #app
  { padding-bottom: calc(64vh + 12px + max(28px, env(safe-area-inset-bottom))); }

  body.mafia-chat-open.ocean-chat-open.zodiac-chat-open #app
  { padding-bottom: calc(96vh + 12px + max(28px, env(safe-area-inset-bottom))); }

  body.mafia-chat-open.ocean-chat-open .ocean-chat-panel{ bottom:32vh; box-shadow:none; }
  body.mafia-chat-open:not(.ocean-chat-open) .zodiac-chat-panel{ bottom:32vh; box-shadow:none; }
  body.ocean-chat-open:not(.mafia-chat-open) .zodiac-chat-panel{ bottom:32vh; box-shadow:none; }
  body.mafia-chat-open.ocean-chat-open .zodiac-chat-panel{ bottom:64vh; box-shadow:none; }
</style>
</head>
<body>
<div id="app">

  <!-- LANDING -->
  <div class="screen active" id="screen-landing">
    <div class="brandmark"><div class="dot"></div><span id="conn-indicator" data-i18n="connConnecting"></span></div>
    <div class="grow center">
      <div class="eyebrow" style="margin-bottom:14px;" data-i18n="landingEyebrow"></div>
      <h1 style="font-size:56px; line-height:0.95;" data-i18n="landingTitle"></h1>
      <p class="hint" style="max-width:280px; margin-top:16px;" data-i18n="landingTagline"></p>
    </div>
    <div class="stack" style="margin-top:24px;">
      <button class="btn btn-primary" onclick="App.goLanding('host')"><span data-i18n="btnHost"></span> <span style="opacity:.7" data-i18n="btnHostGod"></span></button>
      <button class="btn btn-outline" onclick="App.goLanding('player')" data-i18n="btnPlayer"></button>
      <button class="link-btn" style="margin:0 auto;" onclick="App.openManageRoles('landing')" data-i18n="btnRolesShields"></button>
    </div>
  </div>

  <!-- HOST SETUP -->
  <div class="screen" id="screen-host-setup">
    <div class="eyebrow" data-i18n="hostSetupEyebrow"></div>
    <h2 style="font-size:28px; margin:10px 0 26px;" data-i18n="hostSetupTitle"></h2>
    <div class="field">
      <label data-i18n="labelNumPlayers"></label>
      <div class="stepper">
        <button onclick="App.stepPlayers(-1)">&minus;</button>
        <div class="val" id="val-players">6</div>
        <button onclick="App.stepPlayers(1)">&plus;</button>
      </div>
    </div>
    <div class="field">
      <label data-i18n="labelNumMafia"></label>
      <div class="stepper">
        <button onclick="App.stepMafia(-1)">&minus;</button>
        <div class="val" id="val-mafia">2</div>
        <button onclick="App.stepMafia(1)">&plus;</button>
      </div>
      <div class="hint" id="mafia-hint"></div>
    </div>
    <div class="field">
      <label data-i18n="labelNumInquiries"></label>
      <div class="stepper">
        <button onclick="App.stepInquiries(-1)">&minus;</button>
        <div class="val" id="val-inquiries">1</div>
        <button onclick="App.stepInquiries(1)">&plus;</button>
      </div>
      <div class="hint" data-i18n="hintInquiries"></div>
    </div>
    <div class="field">
      <label data-i18n="labelOceanSlots"></label>
      <div class="stepper">
        <button onclick="App.stepOceanSlots(-1)">&minus;</button>
        <div class="val" id="val-ocean-slots">2</div>

    let str = dict[key] !== undefined ? dict[key] : (STRINGS.fa[key] !== undefined ? STRINGS.fa[key] : key);
    if(vars){
      Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
    }
    return str;
  }

    oceanChatLog: [],       // (host: authoritative log; player: local copy) {name, text}[] — اوشن group chat
    zodiacChatLog: [],      // (host: authoritative log; player: local copy) {name, text}[] — زودیاک + زودیاک پسر chat
    oceanTeam: new Set(),   // (host) player ids اوشن has recruited so far (not including اوشن themselves)
    gunsRemaining: GUNNER_MAX_GUNS, // (host) how many more times تفنگدار may hand over the gun this game
    gunsCancelled: false,   // (host) true once the gun has been fired at a civilian — no more handovers
    pendingGun: null,       // (host) { holderId } once تفنگدار hands the gun over, until it's fired/declined the next day
    myRole: null,           // (player) last role payload received, for the "View My Role" peek
    roleReturnScreen: null, // (player) screen to return to after peeking at role
    voteRound: null,        // (player) 1 or 2, which round the current vote screen is for

    selectedNightTargetId: null, // (player) chosen target before submit
    selectedDayGunTargetId: null, // (player) chosen target for the day-gun decision before submit
    myActivityLog: [],           // (player) night-by-night history of this player's (or their mafia team's) actions
    hasActivityLog: false,       // (player) whether to show the "My Activity" link at all
    activityReturnScreen: null,  // (player) screen to return to after viewing activity log
    voteHistoryReturnScreen: null, // (player) screen to return to after viewing vote history
    lastPhaseMsg: null,          // (player) most recent 'phase' message, for re-rendering on language switch
    amAlive: true,                // (player) tracks eliminated/revived so the mafia chat drawer hides once out
    gameEnded: false,            // (player) true once game-over arrives, so a stale night phase can't keep the chat drawer open
    inOceanGroup: false,         // (player) true if I'm اوشن or someone it's recruited — gates the اوشن chat drawer
    inZodiacGroup: false         // (player) true if I'm زودیاک or زودیاک پسر — gates the زودیاک chat drawer
  };

  function $(id){ return document.getElementById(id); }
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

  }
  function toast(msg, ms){
    ms = ms || 2800;
    const host = $('toast-host');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    host.innerHTML = '';
    host.appendChild(el);
    setTimeout(()=>{ if(el.parentNode) el.remove(); }, ms);
  }
  // Testing/troubleshooting aid: a persistent corner badge showing who this
  // browser tab is, so multiple tabs open at once (host + several players)
  // are easy to tell apart. Never shows role, only host/player + name.
  function setDebugBadge(text){
    const el = $('debug-badge');
    if(!el) return;
    el.textContent = text || '';
    el.style.display = text ? 'block' : 'none';
  }
  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------------- Player session persistence (reconnect support) ----------------
     A player's identity (token + name) is saved to localStorage the moment they
     join, keyed to the room code. Reopening the same room — after a phone screen
     lock, a killed tab, or any dropped connection — reuses that same token instead
     of looking like a brand-new joiner, so the host can reattach them to their
     existing seat (role, alive status, activity log all intact) rather than
     rejecting them once the room's full or handing them a blank slate. */
  function generatePlayerToken(){
    try{ if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID(); }catch(e){}
    return 'p-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
  function loadPlayerSession(room){
    try{
      const raw = localStorage.getItem('mafia-player-session');
      if(!raw) return null;
      const s = JSON.parse(raw);
      if(s && s.room === room && s.token) return s;
    }catch(e){}
    return null;
  }
  // Same idea as loadPlayerSession, but without needing to already know
  // which room to check — used at page-load time (see the bottom of this
  // script) when there's no '?join=' URL param to supply one, e.g. a
  // reload/relaunch after the tab itself got killed (iOS Safari does this
  // aggressively — backgrounding, low memory, or just a cold app-switcher
  // relaunch), not just the WebRTC connection dropping.
  function peekPlayerSession(){
    try{
      const raw = localStorage.getItem('mafia-player-session');
      if(!raw) return null;
      const s = JSON.parse(raw);
      if(s && s.room && s.token) return s;
    }catch(e){}
    return null;
  }
  function savePlayerSession(session){
    try{ localStorage.setItem('mafia-player-session', JSON.stringify(session)); }catch(e){}
  }
  function clearPlayerSession(){
    try{ localStorage.removeItem('mafia-player-session'); }catch(e){}
  }

  /* ---------------- WebSocket signaling ---------------- */
  function connectWS(onOpen){
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/ws');
    state.ws = ws;
    ws.onopen = () => { $('conn-indicator').textContent = t('connConnected'); if(onOpen) onOpen(); };
    ws.onclose = () => {
      $('conn-indicator').textContent = t('connDisconnected');
      toast(t('lostServerConnection'));
      // The host relies on this socket for every future signal (new joins,
      // player reconnects) — try to get it back and reclaim the room. See
      // attemptHostReconnect / server.js's HOST_GRACE_MS.
      if(state.role === 'host') attemptHostReconnect();
    };
    ws.onerror = () => { $('conn-indicator').textContent = t('connError'); };
    ws.onmessage = (evt) => {
      let msg;
      try{ msg = JSON.parse(evt.data); }catch(e){ return; }
      handleWSMessage(msg);
    };
  }
  function wsSend(obj){
    if(state.ws && state.ws.readyState === 1) state.ws.send(JSON.stringify(obj));
  }

  function handleWSMessage(msg){
    if(msg.type === 'room-created'){
      state.room = msg.room;
      renderLobbyHeader();
      return;
    }
    if(msg.type === 'player-hello'){
      hostBeginConnectionTo(msg.playerId);
      return;
    }
    if(msg.type === 'player-left'){
      const p = state.players.get(msg.playerId);
      if(p){ p.connected = false; renderLobby(); }
      return;
    }
    if(msg.type === 'signal'){
      if(state.role === 'host') hostHandleSignal(msg.from, msg.payload);
      else playerHandleSignal(msg.payload);
      return;
    }
    if(msg.type === 'joined'){
      state.playerId = msg.playerId;
      state.room = msg.room;
      $('connecting-title').textContent = t('waitingForHost');
      $('connecting-hint').textContent = t('hostWillConnect');
      startConnectingTimeout();
      return;
    }
    if(msg.type === 'room-not-found'){
      // A host whose reclaim attempt (see attemptHostReconnect) arrived
      // after the server's grace window already expired gets this too —
      // the room is genuinely gone, not just this player's join attempt.
      if(state.role === 'host'){
        state.hostReconnectInProgress = false;
        toast(t('hostSessionLost'));
        return;
      }
      clearConnectingTimeout();
      clearPlayerSession();
      state.reconnectInProgress = false;
      state.pendingRejoinSession = null;
      toast(t('roomNotFound'));
      showScreen('screen-player-join');
      return;
    }
    if(msg.type === 'host-left'){
      clearConnectingTimeout();
      clearPlayerSession();
      state.reconnectInProgress = false;
      state.pendingRejoinSession = null;
      toast(t('hostEndedSession'));
      showScreen('screen-player-join');
      return;
    }
    if(msg.type === 'room-reclaimed'){
      state.hostReconnectInProgress = false;
      toast(t('hostReconnected'));
      // Anyone who joined (or reconnected) while this host's socket was
      // down never got their 'player-hello' — the server replays the full
      // roster it knows about here so none of them are left stranded.
      // Players already in state.players are left alone: if THEIR own
      // connection also needs fixing, their own reconnect path (dc.onclose
      // / visibilitychange) handles that independently.
      (msg.playerIds || []).forEach(pid => {
        if(!state.players.has(pid)) hostBeginConnectionTo(pid);
      });
      return;
    }
  }

  /* ---------------- Role library ---------------- */
  function roleTeamTagHtml(r){
    if(r.independent) return '<span class="tag independent role-team-tag">' + escapeHtml(t('tagIndependent')) + '</span>';
    return '<span class="tag ' + (r.team === 'mafia' ? 'mafia' : 'villager') + ' role-team-tag">' + escapeHtml(r.team === 'mafia' ? t('tagMafia') : t('tagVillage')) + '</span>';
  }

  // Mafia first, then Independent, then regular civilians — for the God's role checklist.
  function roleGroupRank(r){
    if(r.team === 'mafia') return 0;
    if(r.independent) return 1;
    return 2;
  }

  function renderRoleChecklist(){
    const box = $('role-checklist');
    if(!box) return;
    box.innerHTML = '';
    const sortedRoles = state.roles.slice().sort((a, b) => roleGroupRank(a) - roleGroupRank(b));
    sortedRoles.forEach(r => {
      const row = document.createElement('label');
      row.className = 'role-row role-check-row';
      row.innerHTML =
        '<input type="checkbox" ' + (state.selectedRoleIds.has(r.id) ? 'checked' : '') + '>' +
        '<div class="role-info">' +
          '<span class="role-name">' + escapeHtml(r.name) + '</span>' +
          roleTeamTagHtml(r) +
          (r.shield ? '<span class="tag shield role-team-tag">' + escapeHtml(t('labelShield')) + '</span>' : '') +
          (r.description ? '<div class="role-desc-small">' + escapeHtml(roleDescription(r)) + '</div>' : '') +
        '</div>';
      row.querySelector('input').onchange = (e) => {
        if(e.target.checked) state.selectedRoleIds.add(r.id);

  function roleSummaryForTeam(team){
    const slotCount = team === 'mafia' ? state.numMafia : (state.numPlayers - state.numMafia);
    const customCount = state.roles.filter(r => r.team === team && !r.builtin && state.selectedRoleIds.has(r.id)).length;
    const defaultRole = state.roles.find(r => r.team === team && r.builtin);
    return {
      slotCount,
      customCount,
      defaultCount: Math.max(0, slotCount - customCount),
      overflow: Math.max(0, customCount - slotCount),
      defaultName: defaultRole ? defaultRole.name : (team === 'mafia' ? t('tagMafia') : t('tagVillage'))
    };
  }

  function renderRoleSummary(){
    const summaryBox = $('role-summary');
    const warnBox = $('role-warning');
    if(!summaryBox || !warnBox) return;

    const mafia = roleSummaryForTeam('mafia');
    const village = roleSummaryForTeam('villager');

    const lines = [];
    [[t('tagMafia'), mafia], [t('tagVillage'), village]].forEach(([label, s]) => {
      if(s.customCount === 0) return;
      lines.push(s.defaultCount > 0
        ? t('roleSummaryDefault', { count: s.defaultCount, slotCount: s.slotCount, label: label, defaultName: s.defaultName })
        : t('roleSummaryAllCustom', { slotCount: s.slotCount, label: label }));
    });
    summaryBox.textContent = lines.join(' ');

    const warnings = [];
    if(mafia.overflow > 0) warnings.push(t('roleOverflowWarning', { customCount: mafia.customCount, slotCount: mafia.slotCount, label: t('tagMafia'), overflow: mafia.overflow }));
    if(village.overflow > 0) warnings.push(t('roleOverflowWarning', { customCount: village.customCount, slotCount: village.slotCount, label: t('tagVillage'), overflow: village.overflow }));
    warnBox.style.display = warnings.length ? 'block' : 'none';

  function renderLobby(){
    const connectedCount = Array.from(state.players.values()).filter(p => p.connected && p.name).length;
    $('lobby-eyebrow').textContent = t('lobbyJoinedCount', { n: connectedCount, total: state.numPlayers });
    const list = $('slot-list');
    list.innerHTML = '';
    let i = 0;
    for(const [id, p] of state.players.entries()){
      i++;

      row.className = 'slot' + (ready ? ' connected' : '');
      row.innerHTML =
        '<div class="num">' + i + '</div>' +

          : '<div class="status">' + escapeHtml(t('statusConnecting')) + '</div>');
      list.appendChild(row);
    }
    const remaining = state.numPlayers - state.players.size;
    for(let r = 0; r < remaining; r++){
      i++;
      const row = document.createElement('div');
      row.className = 'slot';
      row.innerHTML = '<div class="num">' + i + '</div><div class="status">' + escapeHtml(t('statusWaitingForPlayer')) + '</div>';
      list.appendChild(row);
    }
    // Don't force the host to wait for every declared seat to fill — that
    // left the game unstartable if even one invited player couldn't get
    // online. The only real requirement is enough people for at least one
    // Mafia and one villager to actually exist; anyone still joining after
    // that gets folded in automatically once they do (see App.assignRoles'
    // state.pendingRoleSlots and the 'name' handler in setupHostDataChannel).
    const minToStart = Math.max(2, state.numMafia + 1);
    $('btn-assign').disabled = connectedCount < minToStart;
    $('lobby-min-hint').textContent = connectedCount < minToStart
      ? t('lobbyNeedMoreHint', { n: minToStart })
      : (connectedCount < state.numPlayers ? t('lobbyMinReadyHint') : '');

  /* ---------------- Host: WebRTC per player ---------------- */
  function hostBeginConnectionTo(playerId){
    // An existing entry for this id means it's a reconnect (same persisted
    // token as before) — reattach the fresh connection to it instead of
    // treating them as a new joiner, and let them back in even if the room
    // is otherwise "full" (they already have a seat).
    const existing = state.players.get(playerId);
    // Reject brand-new joiners only once every declared seat is actually
    // filled AND there's no one currently disconnected — a full-looking
    // room might just have a seat sitting disconnected (phone died, browser
    // closed) that a fresh connection is about to reclaim by name (see the
    // 'reclaimable-seats' offer in setupHostDataChannel and handleClaimSeat)
    // instead of taking a NEW seat, so it shouldn't be turned away just
    // because the declared headcount is nominally reached. Assigning roles
    // does NOT close the room either way — App.assignRoles reserves a role
    // for every seat up front (state.pendingRoleSlots), so a brand-new
    // joiner arriving after that point still gets dealt a real role the
    // moment they pick a name (see the 'name' handler below), the same as
    // everyone who was already in. An existing entry (same persisted token
    // reconnecting) is always let back in regardless — they already have a
    // seat.
    const anyDisconnected = Array.from(state.players.values()).some(e => !e.connected);
    const overCapacity = !existing && state.players.size >= state.numPlayers;
    if(overCapacity && !anyDisconnected){
      return;
    }
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    const dc = pc.createDataChannel('mafia');
    let entry;
    if(existing){
      try{ existing.dc && existing.dc.close(); }catch(e){}
      try{ existing.pc && existing.pc.close(); }catch(e){}
      existing.pc = pc;
      existing.dc = dc;
      existing.connected = false;
      entry = existing;
    } else {
      entry = { name: null, connected: false, pc, dc, role: null, roleId: null, alive: true, independent: false, activityLog: [] };
      // This connection only got past the check above because SOME OTHER
      // seat is disconnected, not because there's genuine free capacity —
      // it must either claim that disconnected seat by name (handleClaimSeat
      // clears this flag by deleting the entry outright) or get turned away
      // once it tries to register as a brand-new name instead (see the
      // 'name' handler), so the room never silently grows past the God's
      // declared player count.
      entry.overCapacityTemp = overCapacity;
      state.players.set(playerId, entry);
    }
    renderLobby();

    setupHostDataChannel(dc, playerId, !!existing);

    pc.onicecandidate = (e) => {
      if(e.candidate){
        wsSend({ type: 'signal', to: playerId, payload: { kind: 'candidate', candidate: e.candidate } });
      }
    };

    pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
      wsSend({ type: 'signal', to: playerId, payload: { kind: 'offer', sdp: pc.localDescription } });
    }).catch((err) => {
      // Previously silent — a player stuck waiting for an offer that never
      // got created has no way to know it's the HOST side that failed.
      console.error('Failed to create WebRTC offer for player', playerId, err);
    });
  }

  function hostHandleSignal(playerId, payload){
    const entry = state.players.get(playerId);
    if(!entry) return;
    if(payload.kind === 'answer'){
      entry.pc.setRemoteDescription(payload.sdp).catch(()=>{});
    } else if(payload.kind === 'candidate'){
      entry.pc.addIceCandidate(payload.candidate).catch(()=>{});
    }
  }

  function setupHostDataChannel(dc, playerId, isReconnect){
    dc.onopen = () => {
      const entry = state.players.get(playerId);
      if(entry){
        entry.connected = true;
        renderLobby();
        if(isReconnect){
          resyncPlayer(entry, playerId);
        } else {
          // A genuinely fresh connection (new token — the player closed
          // their browser and lost the persisted one that would have made
          // this an automatic reconnect above). If any NAMED seat is
          // currently sitting disconnected, offer them a chance to claim it
          // by name before falling through to the normal "pick a name" flow
          // — see handleClaimSeat and the 'claim-seat' branch below.
          const reclaimable = Array.from(state.players.entries())
            .filter(([pid, e]) => pid !== playerId && e.name && !e.connected)
            .map(([, e]) => e.name);
          if(reclaimable.length) sendToPlayer(entry, { type: 'reclaimable-seats', names: reclaimable });
        }
      }
    };
    dc.onmessage = (e) => {
      try{
        const msg = JSON.parse(e.data);
        if(msg.type === 'name'){
          const entry = state.players.get(playerId);
          if(entry){
            // This connection was only admitted because some OTHER seat was
            // disconnected (see hostBeginConnectionTo), not genuine free
            // capacity — picking a brand-new name here instead of claiming
            // that seat would silently exceed the declared player count.
            // Re-check against the CURRENT roster (not the moment-of-
            // connection snapshot) in case a slot has genuinely freed up
            // since (the God kicked someone, say) before turning it away.
            if(entry.overCapacityTemp && !entry.name){
              const othersCount = Array.from(state.players.keys()).filter(pid => pid !== playerId).length;
              if(othersCount >= state.numPlayers){
                sendToPlayer(entry, { type: 'room-full' });
                return;
              }
              entry.overCapacityTemp = false;
            }
            const wasReconnect = entry.name === msg.name;
            entry.name = msg.name;
            // Roles were already handed out, but this is someone who wasn't
            // connected yet at the time — draw their reserved role now (see
            // App.assignRoles' state.pendingRoleSlots) instead of leaving
            // them stuck with no role forever. Then fold them into whatever
            // the group is currently doing, exactly like a reconnect would
            // (resyncPlayer) — they have no lastPhase of their own yet, so
            // borrow the last broadcast-style phase everyone else got.
            if(state.rolesAssigned && !entry.role && state.pendingRoleSlots && state.pendingRoleSlots.length){
              const roleDef = state.pendingRoleSlots.shift();
              applyRoleToEntry(entry, roleDef);
              if(!entry.lastPhase && state.currentPhaseSnapshot) entry.lastPhase = state.currentPhaseSnapshot;
              resyncPlayer(entry, playerId);
              renderDossier();
            }
            renderLobby();
            toast(t(wasReconnect ? 'toastPlayerReconnected' : 'toastPlayerJoined', {name: msg.name}));
          }
        } else if(msg.type === 'vote'){
          handlePlayerVote(playerId, msg.round, msg.candidateIds);
        } else if(msg.type === 'inquiry-vote'){
          handlePlayerInquiryVote(playerId, msg.choice);
        } else if(msg.type === 'night-action'){
          handleNightAction(playerId, msg.role, msg.targetId, msg.recruit);
        } else if(msg.type === 'day-gun-action'){
          handleDayGunAction(playerId, msg.targetId);
        } else if(msg.type === 'mafia-chat'){
          handleMafiaChat(playerId, msg.text);
        } else if(msg.type === 'ocean-chat'){
          handleOceanChat(playerId, msg.text);
        } else if(msg.type === 'zodiac-chat'){
          handleZodiacChat(playerId, msg.text);
        } else if(msg.type === 'claim-seat'){
          handleClaimSeat(playerId, msg.name);
        }
      }catch(err){}
    };
    dc.onclose = () => {
      const entry = state.players.get(playerId);
      if(entry){ entry.connected = false; renderLobby(); }
    };
  }

  // A brand-new connection (fresh id/token — the player lost whatever would
  // normally let them reconnect automatically, e.g. they closed the browser
  // or switched devices) asking to take over a specific named seat that's
  // currently disconnected. Deliberately no host-confirmation gate: if a
  // disconnected entry with that exact name exists, hand it the live
  // connection outright. This is a casual in-person party game — everyone's
  // in the same room and the God can see who's claiming what — so the
  // low-friction reattach is worth more than guarding against someone
  // typing a name that isn't theirs.
  function handleClaimSeat(tempPlayerId, name){
    const tempEntry = state.players.get(tempPlayerId);
    if(!tempEntry) return;
    const match = Array.from(state.players.entries())
      .find(([pid, e]) => pid !== tempPlayerId && e.name === name && !e.connected);
    if(!match){
      sendToPlayer(tempEntry, { type: 'claim-failed' });
      return;
    }
    const [targetId, targetEntry] = match;
    // Move the live pc/dc off the throwaway temp entry onto the real one,
    // closing out whatever stale connection the real entry still had first
    // (shouldn't be an open one — it's marked disconnected — but be safe).
    try{ targetEntry.dc && targetEntry.dc.close(); }catch(e){}
    try{ targetEntry.pc && targetEntry.pc.close(); }catch(e){}
    targetEntry.pc = tempEntry.pc;
    targetEntry.dc = tempEntry.dc;
    targetEntry.connected = true;
    state.players.delete(tempPlayerId);
    // Rebind the channel's handlers to close over targetId instead of
    // tempPlayerId — every message from here on must be attributed to the
    // real seat, not the throwaway one. The channel is already open, so
    // its onopen won't refire; do what it would have done by hand below.
    setupHostDataChannel(targetEntry.dc, targetId, true);
    // Tell the player their real seat id, BEFORE anything else — they were
    // signaling under the throwaway temp id this whole time (that's how the
    // WebRTC handshake found its way to them at all), and need to switch
    // their persisted session over to the real one so a FUTURE disconnect
    // reconnects them automatically instead of landing back on this same
    // reclaim screen every time (see the 'claim-accepted' handler).
    sendToPlayer(targetEntry, { type: 'claim-accepted', playerId: targetId, name });
    if(!targetEntry.lastPhase && state.currentPhaseSnapshot) targetEntry.lastPhase = state.currentPhaseSnapshot;
    resyncPlayer(targetEntry, targetId);
    renderLobby();
    toast(t('toastPlayerReconnected', { name }));
  }

  /* ---------------- Role assignment ---------------- */
  // One team's worth of role definitions, sized to that team's full slot
  // count regardless of how many people have actually joined yet — custom
  // roles land on a random subset of the slots, everyone else gets the
  // team's default role, and the whole thing is shuffled so which SPECIFIC
  // slot gets a custom role is random. Building this at full size (instead
  // of only as many as are currently connected) is what lets latecomers
  // draw a real, already-decided role later instead of the game "running
  // out" of roles once assignRoles() has been clicked once — see
  // state.pendingRoleSlots below.
  function buildTeamRoleDeck(team, slotCount){
    const customRoles = state.roles.filter(r => r.team === team && !r.builtin && state.selectedRoleIds.has(r.id));
    const defaultRole = state.roles.find(r => r.team === team && r.builtin) ||
      { team, name: team === 'mafia' ? t('tagMafia') : t('tagVillage'), description: '', shield: false };
    const deck = [];
    for(let i = 0; i < slotCount; i++) deck.push(i < customRoles.length ? customRoles[i] : defaultRole);
    return shuffle(deck);
  }

  function applyRoleToEntry(entry, roleDef){
    entry.role = roleDef.team;
    entry.roleId = roleDef.id;
    entry.roleName = roleDef.name;
    entry.roleDesc = roleDef.description;
    entry.roleShield = !!roleDef.shield;
    entry.independent = !!roleDef.independent;
  }

  App.assignRoles = function(){
    state.rolesAssigned = true;

    // A full numPlayers-sized deck: numMafia mafia-team slots plus the rest
    // villager-team, in a randomly interleaved order — so team membership
    // AND which slot gets a custom role are both decided right now for
    // EVERY declared seat, not just the ones filled so far.
    const mafiaDeck = buildTeamRoleDeck('mafia', state.numMafia);
    const villagerDeck = buildTeamRoleDeck('villager', state.numPlayers - state.numMafia);
    const teamOrder = shuffle(
      Array(state.numMafia).fill('mafia').concat(Array(state.numPlayers - state.numMafia).fill('villager'))
    );
    let mafiaIdx = 0, villagerIdx = 0;
    const fullDeck = teamOrder.map(team => team === 'mafia' ? mafiaDeck[mafiaIdx++] : villagerDeck[villagerIdx++]);

    // Deal to whoever's already picked a name right now...
    const joinedIds = shuffle(Array.from(state.players.entries()).filter(([id, e]) => !!e.name).map(([id]) => id));
    joinedIds.forEach((id, idx) => {
      const entry = state.players.get(id);
      const roleDef = fullDeck[idx];
      applyRoleToEntry(entry, roleDef);
      sendToPlayer(entry, { type: 'role', role: roleDef.team, roleId: roleDef.id, name: roleDef.name, description: roleDef.description, shield: !!roleDef.shield });
    });

    // ...and reserve the rest for anyone who's still fumbling with their
    // phone — they draw from this the moment they actually join (see the
    // 'name' handler in setupHostDataChannel), instead of being turned away
    // just because they were slower to connect than everyone else.
    state.pendingRoleSlots = fullDeck.slice(joinedIds.length);

    renderDossier();
    showScreen('screen-host-summary');
  };

  // While we're still building/testing the game, the God's own screen shows
  // real roles too instead of hiding them — see renderDossier below and the
  // full debug panel (App.toggleDebugPanel) for the same reasoning.
  function renderDossier(){
    const table = $('dossier-table');
    table.innerHTML = '';
    for(const entry of state.players.values()){
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + escapeHtml(entry.name) + '</td>' +
        '<td style="text-align:right;" class="hint">' + escapeHtml(entry.roleName || entry.role) + '</td>';
      table.appendChild(tr);
    }
    renderPendingRolesSummary();
  }

  // Groups state.pendingRoleSlots by role name ("شهروند ساده ×3، کاراگاه")
  // for display — shared by the summary screen and the God's debug console
  // so both read the exact same reserved pool the exact same way.
  function pendingRolesSummaryText(){
    const pending = state.pendingRoleSlots || [];
    if(!pending.length) return '';
    const counts = new Map();
    pending.forEach(r => counts.set(r.name, (counts.get(r.name) || 0) + 1));
    const sep = state.lang === 'en' ? ', ' : '، ';
    return Array.from(counts.entries())
      .map(([name, n]) => n > 1 ? name + ' ×' + n : name)
      .join(sep);
  }

  // Lets the God see, at a glance, whether everyone declared at setup has
  // actually joined yet — and if not, exactly which roles are still sitting
  // in the reserved pool, waiting for a latecomer to draw them. Called from
  // renderDossier, which already re-runs both at App.assignRoles() time and
  // every time a latecomer joins and draws one (see the 'name' handler in
  // setupHostDataChannel), so this count is always live on this screen —
  // see renderDebugPanel for the same info surfaced persistently, since the
  // host is usually long past this screen by the time someone's still missing.
  function renderPendingRolesSummary(){
    const card = $('pending-roles-card');
    const heading = $('pending-roles-heading');
    const list = $('pending-roles-list');
    if(!card || !heading || !list) return;
    const pending = state.pendingRoleSlots || [];
    if(!pending.length){
      card.style.display = 'none';
      return;
    }
    card.style.display = 'block';
    heading.textContent = t('pendingRolesCount', { n: pending.length });
    list.textContent = pendingRolesSummaryText();
  }

  /* ---------------- Phase 2: running the game ---------------- */
  function aliveEntries(){
    return Array.from(state.players.entries()).filter(([id, e]) => e.alive);
  }
  // Broadcast-style phases only — every recipient gets the identical
  // payload, unlike 'night-action' (role-specific candidate lists) or
  // 'day-gun-action' (aimed at one specific gun holder), which must NEVER
  // be handed to someone else. Used to resync a brand-new latecomer (see
  // the 'name' handler) to whatever the group is currently doing, since
  // they have no lastPhase of their own yet.
  const GLOBAL_SNAPSHOT_PHASES = ['day', 'inquiry-vote', 'voting1', 'voting2', 'defense', 'night'];
  function sendToPlayer(entry, obj){
    // Cache the most recent 'phase' message per player — this is what lets a
    // reconnecting player pick up exactly where they left off (see
    // resyncPlayer), including any role-specific night-action prompt they
    // hadn't answered yet, without having to special-case every phase kind.
    if(obj && obj.type === 'phase'){
      entry.lastPhase = obj;
      if(GLOBAL_SNAPSHOT_PHASES.indexOf(obj.phase) !== -1) state.currentPhaseSnapshot = obj;
    }
    try{ entry.dc.send(JSON.stringify(obj)); }catch(e){}
  }

  // Called once a reconnecting player's fresh data channel opens. Their
  // browser has zero client-side state after a reload, so everything that
  // matters gets replayed: their role (if assigned), their personal activity
  // log, and — most importantly — whatever they're currently supposed to be
  // looking at (game-over, eliminated, or their last cached phase/prompt).
  function resyncPlayer(entry, playerId){
    if(entry.role){
      sendToPlayer(entry, { type: 'role', role: entry.role, roleId: entry.roleId, name: entry.roleName, description: entry.roleDesc, shield: !!entry.roleShield });
    }
    if(entry.activityLog && entry.activityLog.length){
      sendToPlayer(entry, { type: 'activity-log', log: entry.activityLog });
    }
    if(entry.role === 'mafia' && state.mafiaChatLog.length){
      sendToPlayer(entry, { type: 'mafia-chat-log', log: state.mafiaChatLog });
    }
    if(getOceanGroupIds().has(playerId)){
      sendToPlayer(entry, { type: 'ocean-group-status', inGroup: true });
      if(state.oceanChatLog.length) sendToPlayer(entry, { type: 'ocean-chat-log', log: state.oceanChatLog });
    }
    if(getZodiacGroupIds().has(playerId) && state.zodiacChatLog.length){
      sendToPlayer(entry, { type: 'zodiac-chat-log', log: state.zodiacChatLog });
    }
    if(state.voteHistory.length){
      sendToPlayer(entry, { type: 'vote-history', history: state.voteHistory });
    }
    if(state.winner){
      const roster = Array.from(state.players.values()).map(e => ({ name: e.name, team: e.role, roleName: e.roleName || e.role, independent: !!e.independent }));
      sendToPlayer(entry, { type: 'game-over', winner: state.winner, roster });
    } else if(!entry.alive){
      sendToPlayer(entry, { type: 'eliminated' });
    } else if(entry.lastPhase){
      sendToPlayer(entry, entry.lastPhase);
    }
  }

  App.beginGame = function(){
    state.day = 1;
    state.inquiriesRemaining = state.numInquiries;
    for(const entry of state.players.values()){ entry.alive = true; }
    state.winner = checkWinner();
    if(state.winner){ App.showGameOver(); return; }
    startDayOrInquiry();
  };

  function startDayOrInquiry(){
    const anyoneEliminatedYet = Array.from(state.players.values()).some(e => !e.alive);
    if(state.inquiriesRemaining > 0 && anyoneEliminatedYet) startInquiryVote();
    else goToDayScreen();
  }

  // تفنگدار handed the gun over last night — the recipient must decide whether
  // to fire it after the day's conversation, once the host taps "Start Voting"
  // (see App.startVoting), and before voting actually opens. Resolved via
  // App.forceSkipGunDecision (host) or a 'day-gun-action' message (player),
  // both of which call resolveDayGunAction. If the recipient didn't survive
  // the night, the gun returns to تفنگدار instead — see startGunReturnedStep.
  function startDayGunStep(){
    const holder = state.players.get(state.pendingGun.holderId);
    if(!holder || !holder.alive){
      startGunReturnedStep(holder ? holder.name : null);
      return;
    }
    promptGunHolder(state.pendingGun.holderId, holder, false, null);
  }

  // The gun's original recipient died overnight before they could use it — it
  // comes back to تفنگدار (if they're still alive) to decide instead.
  function startGunReturnedStep(diedName){
    const gunnerEntries = findAliveByRoleName(ROLE_NAME_GUNNER);
    if(!gunnerEntries.length){
      state.pendingGun = null;
      announceDayGunOutcome(t('gunLost'));
      return;
    }
    const [gunnerId, gunnerEntry] = gunnerEntries[0];
    state.pendingGun = { holderId: gunnerId };
    if(diedName) logActivity(gunnerEntry, t('dayLogPrefix', { day: state.day }) + t('actGunReturned', { name: diedName }));
    promptGunHolder(gunnerId, gunnerEntry, true, diedName);
  }

  function promptGunHolder(holderId, holderEntry, returned, diedName){
    const candidates = aliveEntries().filter(([id]) => id !== holderId).map(([id, e]) => ({ id, name: e.name }));
    if(!candidates.length){
      resolveDayGunAction(holderId, null);
      return;
    }
    state.gamePhase = 'day-gun';
    sendToPlayer(holderEntry, { type: 'phase', phase: 'day-gun-action', day: state.day, candidates, returned, diedName });
    $('day-gun-wait-day').textContent = t('dayLabel', { n: state.day });
    $('day-gun-wait-hint').textContent = returned ? t('dayGunReturnedWaitHint', { name: diedName }) : t('dayGunWaitHint');
    showScreen('screen-host-day-gun-wait');
  }

  function handleDayGunAction(voterId, targetId){
    if(state.gamePhase !== 'day-gun' || !state.pendingGun || state.pendingGun.holderId !== voterId) return;
    resolveDayGunAction(voterId, targetId);
  }

  App.forceSkipGunDecision = function(){
    if(state.gamePhase !== 'day-gun' || !state.pendingGun) return;
    resolveDayGunAction(state.pendingGun.holderId, null);
  };

  // If ماتادور blocked the gun's holder on the night تفنگدار handed it to them
  // (state.pendingGun.neutralized), the shot fires but never does anything —
  // no shield drop, no death, no civilian-miss cancellation — and the public
  // reveal doesn't distinguish this from any other "nothing happened" case
  // (see gunHitNoEffect). A returned gun (تفنگدار shooting it themselves) is
  // never neutralized this way — only the original blocked handover is.
  function resolveDayGunAction(shooterId, targetId){
    const shooter = state.players.get(shooterId);
    const target = targetId ? state.players.get(targetId) : null;
    const neutralized = !!(state.pendingGun && state.pendingGun.neutralized);
    const prefix = t('dayLogPrefix', { day: state.day });
    if(shooter) logActivity(shooter, prefix + (target ? t('actYouFiredGun', { name: target.name }) : t('actYouDidNotFireGun')));

    let outcome = target ? 'no-effect' : 'not-fired';
    if(target && !neutralized){
      if(target.role !== 'mafia') state.gunsCancelled = true; // wrong target (civilian or زودیاک) — no more handovers, ever
      // زودیاک never actually dies to the gun either — same "nothing happened",
      // no shield consumed, indistinguishable from any other no-effect case.
      if(!target.independent){
        if(target.roleShield){
          target.roleShield = false;
        } else if(target.alive){
          target.alive = false;
          outcome = 'died';
          sendToPlayer(target, { type: 'eliminated' });
        }
      }
    }

    state.pendingGun = null;
    state.winner = checkWinner();

    const text = outcome === 'died' ? t(target.role === 'mafia' ? 'gunHitDiedMafia' : 'gunHitDiedCivilian', { name: target.name })
      : outcome === 'no-effect' ? t('gunHitNoEffect', { name: target.name })
      : t('gunNotFired');
    announceDayGunOutcome(text);
  }

  function announceDayGunOutcome(text){
    aliveEntries().forEach(([id, entry]) => sendToPlayer(entry, { type: 'day-gun-result', text }));

    $('day-gun-result-day').textContent = t('dayLabel', { n: state.day });
    $('day-gun-result-title').textContent = text;
    showScreen('screen-host-day-gun-result');
  }

  App.continueAfterDayGunResult = function(){
    if(state.winner) App.showGameOver();
    else beginVotingRound1();
  };

  function goToDayScreen(){
    state.gamePhase = 'day';
    broadcastDayPhase();
    renderDayScreen();
    showScreen('screen-host-day');
  }

  function broadcastDayPhase(){
    aliveEntries().forEach(([id, entry]) => sendToPlayer(entry, { type: 'phase', phase: 'day', day: state.day }));
  }

  function startInquiryVote(){
    state.gamePhase = 'inquiry-vote';
    state.votesInquiry = new Map();
    aliveEntries().forEach(([id, entry]) => sendToPlayer(entry, { type: 'phase', phase: 'inquiry-vote', day: state.day }));
    renderInquiryTally();
    showScreen('screen-host-inquiry-vote');
  }

  function renderInquiryTally(){
    $('inquiry-vote-day').textContent = t('dayLabel', { n: state.day }) + ' · ' + t('morningInquiry');
    let yes = 0, no = 0;
    state.votesInquiry.forEach(choice => { if(choice === 'yes') yes++; else no++; });
    $('inquiry-yes-count').textContent = yes;
    $('inquiry-no-count').textContent = no;
    $('inquiry-vote-progress').textContent = t('votedProgress', { n: state.votesInquiry.size, total: aliveEntries().length });
  }

  function handlePlayerInquiryVote(voterId, choice){
    const voter = state.players.get(voterId);
    if(!voter || !voter.alive || state.gamePhase !== 'inquiry-vote') return;
    state.votesInquiry.set(voterId, choice === 'yes' ? 'yes' : 'no');
    renderInquiryTally();
    // Same reasoning as maybeAutoCloseVoting for the day vote — once every
    // alive player has actually voted, there's nothing left to wait for.
    if(state.votesInquiry.size >= aliveEntries().length) App.closeInquiryVote();
  }

  App.closeInquiryVote = function(){
    const threshold = Math.floor(aliveEntries().length / 2);
    let yes = 0;
    state.votesInquiry.forEach(choice => { if(choice === 'yes') yes++; });
    const granted = yes > 0 && yes >= threshold;
    // زودیاک is its own team of one — mentioning "0 زودیاک eliminated" in a
    // game that never had that role in play reads as "there IS a زودیاک,
    // and they're still alive", not "this count doesn't apply here". Only
    // ever mention it when the God actually put it in play this game.
    const zodiacInPlay = state.selectedRoleIds.has('role-zodiac');

    $('inquiry-result-day').textContent = t('dayLabel', { n: state.day }) + ' · ' + t('inquiryResultLabel');
    if(granted){
      state.inquiriesRemaining -= 1;
      const eliminated = Array.from(state.players.values()).filter(e => !e.alive);
      const mafiaOut = eliminated.filter(e => e.role === 'mafia').length;
      const villagerOut = eliminated.filter(e => e.role === 'villager' && !e.independent).length;
      const independentOut = eliminated.filter(e => e.independent).length;
      aliveEntries().forEach(([id, entry]) => sendToPlayer(entry, { type: 'inquiry-result', granted: true, mafiaOut, villagerOut, independentOut, zodiacInPlay }));
      $('inquiry-result-title').textContent = t('inquiryGranted');
      $('inquiry-result-detail').textContent = t(zodiacInPlay ? 'inquiryDetail' : 'inquiryDetailNoZodiac', { mafiaOut, villagerOut, independentOut, remaining: state.inquiriesRemaining });
    } else {
      aliveEntries().forEach(([id, entry]) => sendToPlayer(entry, { type: 'inquiry-result', granted: false }));
      $('inquiry-result-title').textContent = t('noInquiryToday');
      $('inquiry-result-detail').textContent = t('notEnoughVotes');
    }
    showScreen('screen-host-inquiry-result');
  };

  App.continueAfterInquiry = function(){
    goToDayScreen();
  };

  function renderDayScreen(){
    $('day-eyebrow').textContent = t('dayLabel', { n: state.day });

    const aliveBox = $('alive-list');
    aliveBox.innerHTML = '';
    aliveEntries().forEach(([id, entry]) => {
      const row = document.createElement('div');
      row.className = 'slot connected';
      row.innerHTML = '<div class="name">' + escapeHtml(entry.name) + '</div>';
      aliveBox.appendChild(row);
    });

    const eliminated = Array.from(state.players.entries()).filter(([id, e]) => !e.alive);
    const elimCard = $('eliminated-card');
    if(eliminated.length){
      elimCard.style.display = 'block';
      const box = $('eliminated-list');
      box.innerHTML = '';
      eliminated.forEach(([id, entry]) => {
        const row = document.createElement('div');
        row.className = 'slot';
        row.innerHTML = '<div class="name" style="opacity:.5; text-decoration:line-through;">' + escapeHtml(entry.name) + '</div>';
        box.appendChild(row);
      });
    } else {
      elimCard.style.display = 'none';
    }
  }

  // If تفنگدار's gun is still pending, it fires (or is declined) right here —
  // after the day's conversation, before voting opens — not before either.
  App.startVoting = function(){
    if(state.pendingGun){ startDayGunStep(); return; }
    beginVotingRound1();
  };

  function beginVotingRound1(){
    state.gamePhase = 'voting1';
    state.votesRound1 = new Map();
    const alive = aliveEntries();
    alive.forEach(([id, entry]) => {
      const candidates = alive.filter(([cid]) => cid !== id).map(([cid, e]) => ({ id: cid, name: e.name }));
      sendToPlayer(entry, { type: 'phase', phase: 'voting1', day: state.day, candidates });
    });
    renderVotingTally(1);
    showScreen('screen-host-voting');
  }

  App.startFinalVote = function(){
    state.gamePhase = 'voting2';
    state.votesRound2 = new Map();
    aliveEntries().forEach(([id, entry]) => {
      const candidates = state.defendingIds.filter(cid => cid !== id).map(cid => ({ id: cid, name: state.players.get(cid).name }));
      sendToPlayer(entry, { type: 'phase', phase: 'voting2', day: state.day, candidates });
    });
    renderVotingTally(2);
    showScreen('screen-host-voting');
  };

  function handlePlayerVote(voterId, round, candidateIds){
    const voter = state.players.get(voterId);
    if(!voter || !voter.alive) return;
    const ids = Array.isArray(candidateIds) ? candidateIds : [];
    if(round === 1 && state.gamePhase === 'voting1'){
      state.votesRound1.set(voterId, ids);
      renderVotingTally(1);
      maybeAutoCloseVoting(1);
    } else if(round === 2 && state.gamePhase === 'voting2'){
      state.votesRound2.set(voterId, ids.filter(id => state.defendingIds.includes(id)));
      renderVotingTally(2);
      maybeAutoCloseVoting(2);
    }
  }

  // Once every eligible voter for this round has actually cast a vote,
  // there's nothing left to wait for — advance immediately instead of
  // leaving the God to notice everyone's done and tap "Close Voting"
  // themselves. Does exactly what a manual App.closeVoting() click does;
  // the button stays available for the God to close EARLY (someone AFK,
  // wants to move on regardless), this only covers the "already unanimous
  // in the sense that no one is left to hear from" case.
  function maybeAutoCloseVoting(round){
    const votes = round === 1 ? state.votesRound1 : state.votesRound2;
    const eligibleIds = eligibleVoterIdsForRound(round);
    if(!eligibleIds.length || !eligibleIds.every(id => votes.has(id))) return;
    if(round === 1) closeVotingRound1(); else closeVotingRound2();
  }

  // Who's actually ABLE to cast a vote this round — everyone alive in round
  // 1, but in round 2 a SOLE defendant has no one to vote for (see
  // App.startFinalVote's candidate filtering) and so isn't a voter this
  // round either. Shared by the auto-advance "has everyone voted" check,
  // the vote-history record, and the host's live "who's voted" display, so
  // all three always agree on exactly the same set of people. Deliberately
  // NOT used for the majority-THRESHOLD math in closeVotingRound2 — that's
  // measured against the full alive headcount regardless of who can
  // physically vote, so a lone accuser's single vote can never eliminate a
  // sole defendant on its own (see the comment there).
  function eligibleVoterIdsForRound(round){
    if(round === 1) return aliveEntries().map(([id]) => id);
    return state.defendingIds.length === 1
      ? aliveEntries().map(([id]) => id).filter(id => id !== state.defendingIds[0])
      : aliveEntries().map(([id]) => id);
  }

  function renderVotingTally(round){
    const votes = round === 1 ? state.votesRound1 : state.votesRound2;
    const candidateIds = round === 1 ? aliveEntries().map(([id]) => id) : state.defendingIds;

    const counts = new Map();
    candidateIds.forEach(id => counts.set(id, 0));
    votes.forEach(ids => { ids.forEach(id => { if(counts.has(id)) counts.set(id, counts.get(id) + 1); }); });

    const box = $('voting-tally');
    box.innerHTML = '';
    candidateIds
      .map(id => ({ id, name: state.players.get(id).name, count: counts.get(id) }))
      .sort((a, b) => b.count - a.count)
      .forEach(c => {
        const row = document.createElement('div');
        row.className = 'slot';
        row.innerHTML =
          '<div class="name">' + escapeHtml(c.name) + '</div>' +
          '<div class="status" style="flex:0; white-space:nowrap;">' + t('voteCount', { n: c.count }) + '</div>';
        box.appendChild(row);
      });

    const totalAlive = aliveEntries().length;
    $('voting-progress').textContent = t('votedProgress', { n: votes.size, total: totalAlive });
    $('voting-eyebrow').textContent = t('dayVoteEyebrow', { day: state.day, round: round === 1 ? t('firstVote') : t('finalVote') });

    // Named breakdown of who's voted vs who's still expected to — the raw
    // n/total progress line above doesn't say WHO's holding things up.
    const remainingBox = $('voting-remaining-list');
    if(remainingBox){
      const eligibleIds = eligibleVoterIdsForRound(round);
      const votedNames = eligibleIds.filter(id => votes.has(id)).map(id => state.players.get(id).name);
      const remainingNames = eligibleIds.filter(id => !votes.has(id)).map(id => state.players.get(id).name);
      const sep = state.lang === 'en' ? ', ' : '، ';
      const lines = [
        t('votingVotedLabel', { n: votedNames.length }) + (votedNames.length ? ': ' + votedNames.join(sep) : ''),
        t('votingRemainingLabel', { n: remainingNames.length }) + (remainingNames.length ? ': ' + remainingNames.join(sep) : ''),
      ];
      remainingBox.innerHTML = lines.map(l => '<div style="margin-bottom:4px;">' + escapeHtml(l) + '</div>').join('');
    }
  }

  App.closeVoting = function(){
    if(state.gamePhase === 'voting1') closeVotingRound1();
    else if(state.gamePhase === 'voting2') closeVotingRound2();
  };

  // Persists exactly who voted for whom this round, for the "Vote History"
  // screen every player (alive or eliminated) can open at any later point —
  // see broadcastVoteHistory. eligibleIds is everyone who COULD have voted
  // this round, not just those who did, so a no-show reads as "didn't vote"
  // rather than silently vanishing from the record; an explicit empty
  // submission reads as "abstained" — the two are kept distinct.
  function recordVoteHistory(round, votesMap, eligibleIds){
    const rows = eligibleIds.map(id => {
      const voter = state.players.get(id);
      const ids = votesMap.get(id);
      let targets = null; // undefined in the map = never submitted anything
      if(ids !== undefined){
        targets = ids.map(tid => { const target = state.players.get(tid); return target ? target.name : null; }).filter(Boolean);
      }
      return { voter: voter ? voter.name : t('playerLabel'), targets };
    });
    state.voteHistory.push({ day: state.day, round, rows });
    broadcastVoteHistory();
  }

  function broadcastVoteHistory(){
    Array.from(state.players.values()).forEach(entry => {
      sendToPlayer(entry, { type: 'vote-history', history: state.voteHistory });
    });
  }

  function closeVotingRound1(){
    recordVoteHistory(1, state.votesRound1, aliveEntries().map(([id]) => id));
    const counts = new Map();
    state.votesRound1.forEach(ids => ids.forEach(id => counts.set(id, (counts.get(id) || 0) + 1)));
    // Majority has to be measured against every alive player who was
    // ELIGIBLE to vote, not just however many actually tapped submit before
    // the host closed the round (the host can close early — see
    // App.closeVoting — and plenty of players may never submit at all,
    // which never even adds them to state.votesRound1). Basing the
    // threshold on votesRound1.size instead of the alive count let a
    // single vote "win" outright whenever most of the table stayed silent,
    // since Math.floor(1/2) collapses to zero.
    const eligibleVoters = aliveEntries().length;
    const threshold = Math.floor(eligibleVoters / 2);
    const defendingIds = Array.from(counts.entries()).filter(([id, c]) => c >= threshold).map(([id]) => id);

    if(!defendingIds.length){
      showRoundResult(null, t('noMajorityNoOneTrial'));
      return;
    }
    state.defendingIds = defendingIds;
    state.gamePhase = 'defense';
    broadcastDefensePhase();
  }

  function broadcastDefensePhase(){
    const names = state.defendingIds.map(id => state.players.get(id).name);
    aliveEntries().forEach(([id, entry]) => {
      sendToPlayer(entry, { type: 'phase', phase: 'defense', day: state.day, defendingNames: names, onTrial: state.defendingIds.includes(id) });
    });
    renderDefenseList();
    showScreen('screen-host-defense');
  }

  function renderDefenseList(){
    $('defense-day').textContent = t('dayLabel', { n: state.day });
    const box = $('defense-list');
    box.innerHTML = '';
    state.defendingIds.forEach(id => {
      const entry = state.players.get(id);
      const row = document.createElement('div');
      row.className = 'slot connected';
      row.innerHTML = '<div class="name">' + escapeHtml(entry.name) + '</div>';
      box.appendChild(row);
    });
  }

  function closeVotingRound2(){
    recordVoteHistory(2, state.votesRound2, eligibleVoterIdsForRound(2));

    const counts = new Map();
    state.defendingIds.forEach(id => counts.set(id, 0));
    state.votesRound2.forEach(ids => {
      ids.forEach(id => { if(counts.has(id)) counts.set(id, counts.get(id) + 1); });
    });
    // Majority is measured against EVERYONE currently alive — the full
    // headcount, including the defendant themselves even though a sole
    // defendant structurally can't cast their own vote (see
    // App.startFinalVote, where their own candidate list is always empty).
    // This intentionally does NOT shrink the threshold just because one
    // fewer person is able to vote: with 4 alive and a single defendant, a
    // single accuser's vote must never be enough on its own to eliminate
    // someone — the threshold stays floor(4/2)=2, same as it would for any
    // other day-1 vote with 4 people in the game, not floor(3/2)=1.
    const eligibleVoters = aliveEntries().length;
    const threshold = Math.floor(eligibleVoters / 2);

    let eliminatedId = null;
    let note = '';

    if(state.defendingIds.length === 1){
      const onlyId = state.defendingIds[0];
      if(counts.get(onlyId) > 0 && counts.get(onlyId) >= threshold) eliminatedId = onlyId;
    } else {
      const maxCount = Math.max(...state.defendingIds.map(id => counts.get(id)));
      if(maxCount > 0){
        const topIds = state.defendingIds.filter(id => counts.get(id) === maxCount);
        if(topIds.length === 1){
          eliminatedId = topIds[0];
        } else {
          eliminatedId = topIds[Math.floor(Math.random() * topIds.length)];
          note = t('tiedRandomChosen', { n: maxCount, name: state.players.get(eliminatedId).name });
        }
      }
    }

    if(eliminatedId){
      eliminatePlayer(eliminatedId);
      state.winner = checkWinner();
      showRoundResult(eliminatedId, note);
    } else {
      showRoundResult(null, t('noMajorityNoOneLeaves'));
    }
  }

  function eliminatePlayer(id){
    const entry = state.players.get(id);
    entry.alive = false;
    sendToPlayer(entry, { type: 'eliminated' });
    transferZodiacLegacy(entry);
  }

  // If the just-eliminated player was the MAIN زودیاک, everything about the
  // role — independence (immunity to night kills), the nightly shot, and its
  // very identity — passes to زودیاک پسر, if one is alive. Renaming پسر's
  // roleName to ROLE_NAME_ZODIAC means every existing زودیاک-keyed mechanic
  // (night step, win condition, detective's decoy check) picks them up
  // automatically, with no further special-casing needed anywhere else. Day
  // votes are the only way the main زودیاک can ever die (see the immunity in
  // resolveNight/resolveDayGunAction), so eliminatePlayer is the only call
  // site that needs this check.
  function transferZodiacLegacy(diedEntry){
    if(diedEntry.roleName !== ROLE_NAME_ZODIAC) return;
    const heirs = findAliveByRoleName(ROLE_NAME_ZODIAC_SON);
    if(!heirs.length) return;
    const [heirId, heir] = heirs[0];
    const zodiacRoleDef = state.roles.find(r => r.id === 'role-zodiac');
    heir.roleId = 'role-zodiac';
    heir.roleName = ROLE_NAME_ZODIAC;
    heir.roleDesc = zodiacRoleDef ? zodiacRoleDef.description : heir.roleDesc;
    heir.independent = true;
    sendToPlayer(heir, { type: 'role', role: heir.role, roleId: heir.roleId, name: heir.roleName, description: heir.roleDesc, shield: !!heir.roleShield });
    logActivity(heir, t('actZodiacInherited'));
  }

  function checkWinner(){
    const alive = Array.from(state.players.values()).filter(e => e.alive);
    const aliveMafia = alive.filter(e => e.role === 'mafia').length;
    const aliveVillagers = alive.filter(e => e.role === 'villager' && !e.independent).length;
    const independentAlive = alive.some(e => e.independent);
    // Mafia eliminated: زودیاک (if still alive) wins outright on its own — this
    // is a separate outcome from a plain civilian win, not folded into it.
    if(aliveMafia === 0) return independentAlive ? 'zodiac' : 'village';
    // No civilians left at all — Mafia wins outright even with زودیاک still
    // alive; a lone independent can't stop Mafia once the whole town is gone.
    if(aliveVillagers === 0) return 'mafia';
    // Otherwise, زودیاک blocks the usual "Mafia outnumbers the village" win —
    // Mafia can only win once every independent role is gone too (day vote only;
    // see startMafiaPhaseStep/promptCivilianRole for why night kills can't do it).
    if(!independentAlive && aliveVillagers <= aliveMafia) return 'mafia';
    return null;
  }

  function showRoundResult(eliminatedId, note){
    state.gamePhase = 'result';
    const eliminatedEntry = eliminatedId ? state.players.get(eliminatedId) : null;

    aliveEntries().forEach(([id, entry]) => {
      sendToPlayer(entry, { type: 'day-result', eliminatedName: eliminatedEntry ? eliminatedEntry.name : null });
    });

    $('result-day').textContent = t('dayLabel', { n: state.day });
    if(eliminatedEntry){
      $('result-title').textContent = t('votedOut', { name: eliminatedEntry.name });
      $('result-detail').textContent = note || t('rolePrivate');
    } else {
      $('result-title').textContent = t('noOneEliminated');
      $('result-detail').textContent = note || t('didntReachMajority');
    }
    $('result-continue-btn').textContent = state.winner
      ? t('seeResults')
      : t('continueToNight');
    showScreen('screen-host-result');
  }

  App.proceedAfterResult = function(){
    if(state.winner) App.showGameOver();
    else startNight();
  };

  App.continueToNextDay = function(){
    state.day += 1;
    startDayOrInquiry();
  };

  App.showGameOver = function(){
    state.gamePhase = 'game-over';
    const roster = Array.from(state.players.values()).map(e => ({ name: e.name, team: e.role, roleName: e.roleName || e.role, independent: !!e.independent }));
    for(const entry of state.players.values()){
      sendToPlayer(entry, { type: 'game-over', winner: state.winner, roster });
    }

    $('game-over-title').textContent = winnerLabel(state.winner);
    const box = $('game-over-roster');
